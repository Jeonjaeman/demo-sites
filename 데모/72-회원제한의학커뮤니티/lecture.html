<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>강의 재생 · BONCHO 본초</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/css/base.css">
<style>
.layout { display: grid; grid-template-columns: 1fr 340px; gap: 40px; align-items: start; padding-top: 44px; }
.crumb { font-size: 13px; color: var(--t3); display: flex; gap: 8px; align-items: center; margin-bottom: 16px; }
.crumb a { color: var(--ac); font-weight: 600; }

/* ── 플레이어 — 유튜브 연동 재현 + 워터마크 오버레이 (발견 ③) ── */
.player { position: relative; border-radius: var(--r-md); overflow: hidden; aspect-ratio: 16/9; background: var(--navy-deep); }
.player img.poster { width: 100%; height: 100%; object-fit: cover; opacity: .82; transition: opacity .4s ease; }
.player.playing img.poster { opacity: .5; }
.player .bigplay {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 66px; height: 66px; border-radius: 50%; background: rgba(2, 89, 151, .92); color: #fff;
  display: flex; align-items: center; justify-content: center; transition: background .3s ease, transform .3s ease; z-index: 5;
}
.player .bigplay:hover { background: var(--ac2); transform: translate(-50%, -50%) scale(1.06); }
.player.playing .bigplay { display: none; }
.player .yt-chip {
  position: absolute; left: 12px; top: 12px; z-index: 4;
  font-family: var(--mono); font-size: 11px; font-weight: 600; color: #fff;
  background: rgba(10,14,18,.72); border-radius: 3px; padding: 3px 8px;
}
/* 워터마크 — 회원번호+시각, 4초마다 위치 이동. 캡처하면 반드시 함께 찍힌다 */
.player .wm {
  position: absolute; z-index: 6; pointer-events: none;
  font-family: var(--mono); font-size: 12.5px; font-weight: 600; letter-spacing: .04em;
  color: rgba(255, 255, 255, .5); text-shadow: 0 0 6px rgba(0,0,0,.4);
  transition: left 1.1s ease, top 1.1s ease;
  left: 8%; top: 12%;
}
.player .ctrlbar {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 5;
  padding: 26px 14px 10px; display: flex; align-items: center; gap: 12px;
  background: linear-gradient(0deg, rgba(10,14,18,.82), transparent);
  opacity: 0; transition: opacity .3s ease;
}
.player.playing .ctrlbar { opacity: 1; }
.player .ctrlbar .t { font-family: var(--mono); font-size: 11.5px; color: rgba(255,255,255,.8); }
.player .track { flex: 1 1 auto; height: 4px; background: rgba(255,255,255,.24); border-radius: 999px; overflow: hidden; }
.player .track i { display: block; height: 100%; width: 0%; background: var(--ac2); }

.play-note { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 12.5px; color: var(--t3); flex-wrap: wrap; }
.play-note .badge { flex: 0 0 auto; }

.lec-head { margin-top: 22px; }
.lec-head .tags { display: flex; gap: 8px; align-items: center; }
.lec-head h1 { font-size: 27px; font-weight: 700; line-height: 1.35; letter-spacing: -.02em; margin-top: 8px; }
.lec-head .by { font-size: 13.5px; color: var(--t2); margin-top: 8px; }
.lec-head .desc { font-size: 14.5px; color: var(--t2); line-height: 1.75; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }

/* 커리큘럼 아코디언 (인프런 문법 실측) */
.curri { margin-top: 30px; }
.curri .hd { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.curri .hd .tt { font-size: 17px; font-weight: 700; }
.curri .hd .sum { font-family: var(--mono); font-size: 12.5px; color: var(--t3); }
.curri .sect { border: 1px solid var(--line-strong); border-radius: var(--r-md); overflow: hidden; margin-bottom: 10px; }
.curri .sect > button { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 16px; background: var(--sunken); font-size: 14px; font-weight: 700; text-align: left; transition: background .3s ease; }
.curri .sect > button:hover { background: var(--hover); }
.curri .sect > button .n { font-family: var(--mono); font-size: 12px; color: var(--t3); font-weight: 500; }
.curri .sect ul { display: none; }
.curri .sect.open ul { display: block; }
.curri li { display: flex; align-items: center; gap: 10px; padding: 11px 16px; border-top: 1px solid var(--line); font-size: 13.5px; }
.curri li .no { font-family: var(--mono); font-size: 12px; color: var(--t3); flex: 0 0 22px; }
.curri li .pv { font-size: 10.5px; font-weight: 700; color: var(--ac); border: 1px solid var(--ac); border-radius: 3px; padding: 1px 6px; }
.curri li .dur { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--t3); }
.curri li.done .no { color: var(--ok); }

/* ── 유출 시뮬레이터 + 대안 비교 (발견 ③ 핵심 구현) ── */
.risk-panel { margin-top: 36px; border: 1px solid var(--line-strong); border-radius: var(--r-lg); overflow: hidden; }
.risk-panel .hd { padding: 18px 22px; background: var(--navy); color: #fff; }
.risk-panel .hd .eyebrow { font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--ac2); text-transform: uppercase; }
.risk-panel .hd .tt { font-size: 18px; font-weight: 700; margin-top: 4px; }
.risk-panel .hd .ds { font-size: 13px; color: rgba(255,255,255,.66); margin-top: 6px; line-height: 1.65; }
.risk-panel .bd { padding: 20px 22px; }

.leak-demo { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.leak-win { border: 1px solid var(--line-strong); border-radius: var(--r-md); overflow: hidden; }
.leak-win .bar { display: flex; align-items: center; gap: 7px; padding: 8px 12px; background: var(--sunken); border-bottom: 1px solid var(--line); }
.leak-win .bar i { width: 9px; height: 9px; border-radius: 50%; background: var(--line-strong); }
.leak-win .bar .url { font-family: var(--mono); font-size: 11px; color: var(--t2); background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.leak-win .scr { padding: 22px 16px; min-height: 128px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.leak-win .scr .ic { font-size: 24px; }
.leak-win .scr .t1x { font-size: 13.5px; font-weight: 700; }
.leak-win .scr .t2x { font-size: 12px; color: var(--t3); line-height: 1.6; }
.leak-win.bad-side .scr { background: #0a0e12; }
.leak-win.bad-side .t1x { color: #fff; }
.leak-win.bad-side .t2x { color: rgba(255,255,255,.55); }
.leak-verdict { margin-top: 14px; padding: 14px 16px; border-radius: var(--r-md); background: var(--bad-soft); color: var(--t1); font-size: 13.5px; line-height: 1.7; }
.leak-verdict b { color: var(--bad); }

.alt-ctl { display: flex; gap: 26px; flex-wrap: wrap; margin: 20px 0 14px; }
.alt-ctl label { font-size: 12.5px; color: var(--t2); display: block; }
.alt-ctl output { font-family: var(--mono); font-weight: 600; color: var(--ac); }
.alt-ctl input[type=range] { width: 210px; accent-color: var(--ac); display: block; margin-top: 6px; }
.alt-tbl { font-size: 13px; }
.alt-tbl th { border-top: 2px solid var(--t1); border-bottom: 1px solid var(--line-strong); font-size: 12.5px; font-weight: 700; height: 38px; padding: 0 10px; text-align: left; }
.alt-tbl td { border-bottom: 1px solid var(--line); padding: 10px; vertical-align: top; }
.alt-tbl .nm { font-weight: 700; }
.alt-tbl .cost { font-family: var(--mono); font-weight: 600; white-space: nowrap; }
.alt-tbl .rec td { background: var(--ac-soft); }
.alt-tbl .pill-tag { display: inline-block; font-size: 10.5px; font-weight: 700; color: #fff; background: var(--ac); border-radius: 999px; padding: 2px 8px; margin-left: 6px; }
.alt-note { font-size: 12px; color: var(--t3); margin-top: 10px; line-height: 1.6; }

/* sticky 스펙 사이드바 (인프런 실측 문법) */
.side { position: sticky; top: 86px; }
.side .panel .bd { padding: 20px; }
.side .price-row { display: flex; align-items: baseline; gap: 8px; }
.side .price-row .v { font-family: var(--mono); font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
.side .spec { margin-top: 16px; border-top: 1px solid var(--line); }
.side .spec div { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.side .spec dt { color: var(--t3); }
.side .spec dd { font-weight: 600; text-align: right; }
.side .btn.block { margin-top: 16px; }
.side .cont { margin-top: 10px; font-size: 12px; color: var(--t3); text-align: center; }

.lockveil-page { border: 1px solid var(--line-strong); border-radius: var(--r-lg); padding: 72px 30px; text-align: center; margin-top: 44px; }
.lockveil-page .ic { width: 54px; height: 54px; border-radius: 50%; background: var(--navy); color: #fff; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }

@media (max-width: 1080px) {
  .layout { grid-template-columns: 1fr; }
  .side { position: static; }
  .leak-demo { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<main class="shell" id="page"></main>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
B.header('lectures');
B.footer('');

(function () {
  var L = DATA.lectureOf(B.qs('id')) || DATA.LECTURES[0];
  document.title = L.t + ' · BONCHO 본초';
  var page = document.getElementById('page');
  var me = B.me();

  /* 권한 미달 → 잠금 */
  if (!B.canLecture(L)) {
    page.innerHTML = '<div class="lockveil-page reveal">'
      + '<div class="ic"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></div>'
      + '<div style="font-size:19px;font-weight:700">' + (L.grade >= 2 ? '한의사회원 전용 강의입니다' : '승인된 회원만 수강할 수 있습니다') + '</div>'
      + '<p style="font-size:13.5px;color:var(--t2);margin-top:10px;line-height:1.7">「' + B.esc(L.t) + '」 강의는 '
      + (L.grade >= 2 ? '면허가 확인된 한의사회원' : '가입 승인이 완료된 회원') + '에게만 재생됩니다.<br>영상 주소 자체가 페이지에 포함되지 않으므로 소스 보기로도 노출되지 않습니다.</p>'
      + '<a class="btn pri" style="margin-top:20px" href="join.html">가입 신청하기</a>'
      + '</div>';
    B.reveal(page);
    return;
  }

  /* 커리큘럼 데이터 생성 — 총 시간을 회차로 실제 분배 */
  var perEp = Math.round(L.min * 60 / L.ep);
  var eps = [];
  for (var i = 1; i <= L.ep; i++) {
    var sec = perEp + ((i * 137) % 90) - 45;
    eps.push({ no: i, t: i + '강 · ' + ['개요와 원리', '기초 술기', '실전 시연', '증례 적용', '심화·응용', '흔한 실수', 'Q&A 정리', '요약과 과제', '평가 문항', '마무리'][(i - 1) % 10], sec: sec });
  }
  var half = Math.ceil(eps.length / 2);
  var sections = [
    { name: '섹션 1. 기초', eps: eps.slice(0, half) },
    { name: '섹션 2. 임상 적용', eps: eps.slice(half) }
  ];
  function mmss(s) { var m = Math.floor(s / 60), ss = s % 60; return (m < 10 ? '0' : '') + m + ':' + (ss < 10 ? '0' : '') + ss; }
  function sum(list) { return list.reduce(function (a, e) { return a + e.sec; }, 0); }

  var hist = (DATA.MY_HISTORY[B.role()] || []).filter(function (h) { return h.ref === L.id; })[0];

  page.innerHTML =
    '<div class="layout">'
    + '<div>'
    + '<div class="crumb reveal"><a href="lectures.html">강의</a><span>›</span><a href="lectures.html?cat=' + encodeURIComponent(L.cat) + '">' + L.cat + '</a></div>'

    /* 플레이어 */
    + '<div class="player reveal" id="player">'
    + '<span class="yt-chip">YouTube 연동 · 한정공개</span>'
    + '<img class="poster" src="assets/img/' + L.img + '" alt="">'
    + '<button class="bigplay" id="playBtn" aria-label="재생"><svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>'
    + '<span class="wm" id="wm"></span>'
    + '<div class="ctrlbar"><span class="t" id="tCur">00:00</span><div class="track"><i id="trackBar"></i></div><span class="t">' + mmss(eps[0].sec) + '</span></div>'
    + '</div>'
    + '<div class="play-note">'
    + '<span class="badge ok">열람 기록</span><span>재생 시 회원번호·일시·콘텐츠·접속 IP가 기록됩니다</span>'
    + '<span class="badge doctor">워터마크</span><span>화면 위 회원번호는 4초마다 위치를 바꿉니다 — 캡처 시 반드시 함께 찍힙니다</span>'
    + '</div>'

    /* 강의 정보 */
    + '<div class="lec-head reveal">'
    + '<div class="tags"><span class="badge line">' + L.cat + '</span>'
    + (L.cpd ? '<span class="badge ok">보수교육 ' + L.cpd + '평점</span>' : '<span class="badge guest">평점 없음</span>')
    + (L.grade >= 2 ? '<span class="badge doctor">한의사 전용</span>' : '<span class="badge member">일반회원 수강 가능</span>')
    + '</div>'
    + '<h1>' + B.esc(L.t) + '</h1>'
    + '<div class="by">' + L.tutor + ' · ' + L.tutorRole + ' &nbsp;|&nbsp; 수강 ' + B.fmt(L.views) + '명 · ' + L.date + ' 개설</div>'
    + '<p class="desc">' + B.esc(L.desc) + '</p>'
    + '</div>'

    /* 커리큘럼 */
    + '<div class="curri reveal">'
    + '<div class="hd"><span class="tt">커리큘럼</span><span class="sum">전체 ' + L.ep + '개 ∙ (' + L.min + '분)</span></div>'
    + sections.map(function (s, si) {
        return '<div class="sect' + (si === 0 ? ' open' : '') + '">'
          + '<button type="button">' + s.name + '<span class="n">' + s.eps.length + '개 ∙ ' + mmss(sum(s.eps)) + '</span></button>'
          + '<ul>' + s.eps.map(function (e) {
              var done = hist && hist.prog === 100;
              var cur = hist && hist.prog < 100 && e.no === Math.ceil(L.ep * hist.prog / 100);
              return '<li class="' + (done ? 'done' : '') + '"><span class="no">' + (done ? '✓' : e.no) + '</span>'
                + '<span>' + e.t + '</span>'
                + (e.no === 1 ? '<span class="pv">미리보기</span>' : '')
                + (cur ? '<span class="pv" style="color:var(--warn);border-color:var(--warn)">이어보기</span>' : '')
                + '<span class="dur">' + mmss(e.sec) + '</span></li>';
            }).join('') + '</ul></div>';
      }).join('')
    + '</div>'

    /* 유출 시뮬레이터 + 대안 비교 */
    + '<div class="risk-panel reveal" id="riskPanel">'
    + '<div class="hd"><span class="eyebrow">Risk Review</span>'
    + '<div class="tt">이 링크가 유출되면 어떻게 될까요?</div>'
    + '<p class="ds">공고의 「유튜브 연동」과 「회원번호 워터마크」 요구는 서로 충돌합니다. 유튜브 한정공개 영상은 링크만 알면 누구나 재생돼,'
    + ' 사이트의 접근제어와 워터마크가 원본 영상에는 미치지 않습니다. 아래에서 직접 확인해 보세요.</p></div>'
    + '<div class="bd">'
    + '<div class="leak-demo">'
    + '<div class="leak-win"><div class="bar"><i></i><i></i><i></i><span class="url">boncho.example/lecture?id=' + L.id + '</span></div>'
    + '<div class="scr"><span class="ic">🔒</span><div class="t1x">본초 페이지 — 차단됨</div>'
    + '<div class="t2x">비회원 접근 시 플레이어가 렌더되지 않고<br>영상 주소도 응답에 포함되지 않습니다</div></div></div>'
    + '<div class="leak-win bad-side"><div class="bar"><i></i><i></i><i></i><span class="url">youtube.com/watch?v=●●●●●●●</span></div>'
    + '<div class="scr"><span class="ic">▶️</span><div class="t1x">유튜브 직접 접속 — 재생됨</div>'
    + '<div class="t2x">한정공개 영상은 링크를 가진 누구나 시청·재공유 가능<br>워터마크도, 열람 기록도 남지 않습니다</div></div></div>'
    + '</div>'
    + '<div class="leak-verdict"><b>결론</b> — 유튜브를 쓰는 한 워터마크는 페이지 오버레이까지가 한계이고, 유출된 원본 링크는 통제할 수 없습니다. '
    + '개발 단계에서 영상 호스팅 방식을 먼저 확정해야 하는 이유입니다. 규모를 조정해 세 가지 방식의 월 비용을 비교해 보세요.</div>'
    + '<div class="alt-ctl">'
    + '<label>회원 수 <output id="oN">1,000</output>명<input type="range" id="rN" min="100" max="3000" step="100" value="1000"></label>'
    + '<label>1인당 월 시청 <output id="oH">4</output>시간<input type="range" id="rH" min="1" max="20" step="1" value="4"></label>'
    + '</div>'
    + '<div class="tbl-wrap"><table class="alt-tbl"><thead><tr><th>방식</th><th>월 비용</th><th>유출 차단</th><th>워터마크</th><th>구축 공수</th></tr></thead><tbody id="altBody"></tbody></table></div>'
    + '<p class="alt-note">비용 산식 — 자체 스트리밍: 시청시간 × 0.75GB/h × CDN 전송료 30원/GB + 인코딩·스토리지 고정 3만원. 상용 호스팅: 플랜 6.6만원(전송 2TB 포함) + 초과분 55원/GB. 유튜브: 0원. 실제 단가는 사업자별 상이하며 계약 시 재산정합니다.</p>'
    + '</div></div>'

    + '</div>'

    /* sticky 사이드바 */
    + '<aside class="side reveal">'
    + '<div class="panel"><div class="bd">'
    + '<div class="price-row"><span class="v">회원 무료</span><span class="sm t3">· ' + (L.grade >= 2 ? '한의사회원' : '승인 회원') + ' 전용</span></div>'
    + '<dl class="spec">'
    + '<div><dt>연자</dt><dd>' + L.tutor + '</dd></div>'
    + '<div><dt>강의 구성</dt><dd>' + L.ep + '개 · ' + L.min + '분</dd></div>'
    + '<div><dt>수강 기한</dt><dd>승인 회원 상시</dd></div>'
    + '<div><dt>보수교육 평점</dt><dd>' + (L.cpd ? L.cpd + '평점' : '해당 없음') + '</dd></div>'
    + '<div><dt>이수증</dt><dd>' + (L.cpd ? '수료 시 발급' : '—') + '</dd></div>'
    + '<div><dt>질의응답</dt><dd>연자 답변 제공</dd></div>'
    + '<div><dt>열람 기록</dt><dd>회원·일시·IP 기록</dd></div>'
    + '</dl>'
    + (hist && hist.prog < 100
      ? '<button class="btn pri block lg" id="resumeBtn">이어보기 — ' + hist.prog + '% 지점부터</button>'
      : '<button class="btn pri block lg" id="resumeBtn">수강 시작하기</button>')
    + (hist && hist.prog < 100 ? '<div class="meter" style="margin-top:12px"><i style="width:' + hist.prog + '%"></i></div>' : '')
    + '<p class="cont">부정 공유가 확인되면 이용약관에 따라 이용이 제한될 수 있습니다</p>'
    + '</div></div>'
    + '</aside>'
    + '</div>';

  B.reveal(page);

  /* 아코디언 */
  page.querySelectorAll('.curri .sect > button').forEach(function (b) {
    b.addEventListener('click', function () { b.parentElement.classList.toggle('open'); });
  });

  /* ── 재생 — 워터마크 이동 + 진행 + 열람 기록 ── */
  var playing = false, prog = 0, wmTimer = null, playTimer = null;
  var wm = document.getElementById('wm');
  function wmText() {
    var d = new Date();
    var pad = function (n) { return (n < 10 ? '0' : '') + n; };
    wm.textContent = (me ? me.no : 'GUEST') + ' · ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }
  function wmMove() {
    wm.style.left = (6 + Math.random() * 66) + '%';
    wm.style.top = (8 + Math.random() * 70) + '%';
    wmText();
  }
  wmMove();

  function startPlay() {
    if (playing) return;
    playing = true;
    document.getElementById('player').classList.add('playing');
    B.logView('강의', L.id, L.t + ' 재생');
    B.toast('재생을 시작했습니다.<br><span class="sm">열람 기록: ' + (me ? me.no : '') + ' · 이 시청은 관리자 열람 로그에 남습니다</span>');
    wmTimer = setInterval(wmMove, 4000);
    var total = eps[0].sec;
    playTimer = setInterval(function () {
      prog = Math.min(total, prog + 1);
      document.getElementById('trackBar').style.width = (prog / total * 100) + '%';
      document.getElementById('tCur').textContent = mmss(prog);
      if (prog >= total) { clearInterval(playTimer); clearInterval(wmTimer); }
    }, 1000);
  }
  document.getElementById('playBtn').addEventListener('click', startPlay);
  var resume = document.getElementById('resumeBtn');
  if (resume) resume.addEventListener('click', function () {
    startPlay();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  /* ── 대안 비교 — 슬라이더 연동 실계산 ── */
  function calcAlt() {
    var N = +document.getElementById('rN').value;
    var H = +document.getElementById('rH').value;
    document.getElementById('oN').textContent = B.fmt(N);
    document.getElementById('oH').textContent = H;
    var gb = N * H * 0.75;                              /* 총 전송량 GB */
    var selfCost = Math.round(gb * 30 + 30000);         /* 자체 HLS: 30원/GB + 고정 3만 */
    var comCost = Math.round(66000 + Math.max(0, gb - 2048) * 55);
    var rows = [
      { nm: '유튜브 한정공개', cost: 0, block: '불가 — 링크 유출 시 통제 불능', wmk: '페이지 오버레이만', work: '0.5일', rec: false },
      { nm: '상용 영상 호스팅', cost: comCost, block: '도메인 화이트리스트', wmk: '플레이어 오버레이', work: '2일', rec: N < 800 },
      { nm: '자체 스트리밍 (HLS+서명 URL)', cost: selfCost, block: '60초 만료 서명 URL', wmk: '회원번호 소부(burn-in) 가능', work: '8일', rec: N >= 800 }
    ];
    document.getElementById('altBody').innerHTML = rows.map(function (r) {
      return '<tr class="' + (r.rec ? 'rec' : '') + '"><td class="nm">' + r.nm + (r.rec ? '<span class="pill-tag">이 규모 권장</span>' : '') + '</td>'
        + '<td class="cost">' + (r.cost ? '월 ' + B.fmt(r.cost) + '원' : '0원') + '</td>'
        + '<td>' + r.block + '</td><td>' + r.wmk + '</td><td>' + r.work + '</td></tr>';
    }).join('');
  }
  document.getElementById('rN').addEventListener('input', calcAlt);
  document.getElementById('rH').addEventListener('input', calcAlt);
  calcAlt();
})();
</script>
</body>
</html>
