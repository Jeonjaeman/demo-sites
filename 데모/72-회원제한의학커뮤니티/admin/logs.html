<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>열람 로그 · BONCHO 관리자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/admin.css">
<style>
.policy-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 18px; }
.pcard { background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-md); padding: 15px 17px; }
.pcard .lb { font-size: 12px; color: var(--t2); }
.pcard .v { font-family: var(--mono); font-size: 21px; font-weight: 600; margin-top: 7px; }
.pcard .sub { font-size: 11.5px; color: var(--t3); margin-top: 6px; line-height: 1.55; }
.integrity { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.integrity .result { font-size: 13px; font-weight: 700; }
.integrity .result.ok { color: var(--ok); }
.integrity .result.bad { color: var(--bad); }
tr.tampered td { background: var(--bad-soft); }
tr.live-log td { background: var(--ac-soft); }
@media (max-width: 900px) { .policy-cards { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
if (AD.guard()) {
  var body = AD.shell('logs', '열람 로그', '열람 회원 · 일시 · 콘텐츠 · 접속 IP — 기록이 아니라 위·변조 검증과 역추적이 되는 감사 도구');

  /* 세션 실기록 + 기본 로그 합산 */
  var live = B.sessionLogs();
  var rows = live.concat(DATA.LOGS);

  /* 해시 체인 — 실제 계산 (djb2 → hex 8자리, prev 연결) */
  function h32(str) {
    var h = 5381;
    for (var i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0;
    return ('00000000' + (h >>> 0).toString(16)).slice(-8);
  }
  function chain(list) {
    var prev = 'genesis0';
    return list.map(function (r) {
      var payload = prev + '|' + r.at + '|' + r.no + '|' + r.kind + '|' + r.ref + '|' + r.ip;
      var hash = h32(payload);
      var out = { row: r, prev: prev, hash: hash };
      prev = hash;
      return out;
    });
  }
  var chained = chain(rows.slice().reverse()).reverse();   /* 오래된 것부터 체인 → 표시는 최신순 */
  var tamperedIdx = -1;

  body.innerHTML =
    '<div class="policy-cards">'
    + '<div class="pcard"><div class="lb">보관 정책 (안전성 확보조치 기준 §8)</div><div class="v">1년 보관</div>'
    + '<div class="sub">접속기록 법정 최소 보관기간. 최장 보관분 잔여 <b class="ac">D-247</b> 후 자동 파기 예약</div></div>'
    + '<div class="pcard"><div class="lb">수집 고지</div><div class="v">동의 완료</div>'
    + '<div class="sub">IP·열람 이력 수집은 가입 시 개인정보 수집·이용 동의와 처리방침에 고지됨 — IP는 화면에서 뒷자리 마스킹</div></div>'
    + '<div class="pcard"><div class="lb">기록 건수</div><div class="v"><b data-count="' + rows.length + '">' + rows.length + '</b>행</div>'
    + '<div class="sub">이 세션에서 사용자 화면을 열람하면 실기록이 위에 추가됩니다' + (live.length ? ' · <b class="ac">방금 ' + live.length + '행 추가됨</b>' : '') + '</div></div>'
    + '</div>'

    /* 이상 패턴 탐지 — 실제 규칙 계산 */
    + '<div id="anomHost"></div>'

    + '<div class="panel"><div class="hd"><span class="h3">열람 기록</span>'
    + '<div class="row gap-8 integrity">'
    + '<span class="result" id="intResult"></span>'
    + '<button class="btn sm pri" id="verifyBtn">무결성 검증</button>'
    + '<button class="btn sm" id="tamperBtn">변조 시뮬레이션</button>'
    + '<button class="btn sm" id="csvBtn">CSV</button>'
    + '</div></div>'
    + '<div class="tbl-wrap"><table class="tbl static"><thead><tr>'
    + '<th>일시</th><th>회원</th><th>종류</th><th>콘텐츠</th><th>접속 IP</th><th>체류</th><th>해시 체인</th>'
    + '</tr></thead><tbody id="logRows"></tbody></table></div></div>';

  function renderRows() {
    document.getElementById('logRows').innerHTML = chained.map(function (c, i) {
      var r = c.row;
      return '<tr class="' + (i === tamperedIdx ? 'tampered' : '') + (r.live ? ' live-log' : '') + '">'
        + '<td class="mono sm">' + r.at + (r.live ? ' <span class="badge ok">실기록</span>' : '') + '</td>'
        + '<td><b>' + r.name + '</b> <span class="mono sm t3">' + r.no + '</span></td>'
        + '<td><span class="badge line">' + r.kind + '</span></td>'
        + '<td class="sm">' + B.esc(r.title) + '</td>'
        + '<td class="mono sm t3">' + r.ip + '</td>'
        + '<td class="mono sm t3">' + r.dur + '</td>'
        + '<td><span class="hash' + (i === tamperedIdx ? ' badv' : '') + '">' + c.hash + '</span></td>'
        + '</tr>';
    }).join('');
  }

  /* 무결성 검증 — 전체 체인 실제 재계산 */
  document.getElementById('verifyBtn').addEventListener('click', function () {
    var list = chained.slice().reverse();
    var prev = 'genesis0', broken = 0;
    list.forEach(function (c) {
      var payload = prev + '|' + c.row.at + '|' + c.row.no + '|' + c.row.kind + '|' + c.row.ref + '|' + c.row.ip;
      if (h32(payload) !== c.hash) broken++;
      prev = c.hash;
    });
    var el = document.getElementById('intResult');
    if (broken === 0) {
      el.textContent = '무결성 확인 — ' + rows.length + '행 / 변조 0건';
      el.className = 'result ok';
      B.toast('전체 해시 체인을 재계산했습니다. <b>변조 없음</b>');
    } else {
      el.textContent = '경고 — 변조 의심 ' + broken + '행 검출';
      el.className = 'result bad';
      B.toast('해시 체인 검증 실패 — <b>' + broken + '행</b>이 기록 이후 수정되었습니다.', 'bad');
    }
  });

  /* 변조 시뮬레이션 — 실제로 데이터 한 행을 바꾸고 검증이 실패하는 것을 보여줌 */
  document.getElementById('tamperBtn').addEventListener('click', function () {
    tamperedIdx = 2;
    chained[tamperedIdx].row.ip = '10.0.xxx.xxx (변조됨)';
    renderRows();
    B.toast('3번째 행의 IP를 임의로 바꿨습니다. <b>무결성 검증</b>을 눌러 검출되는지 확인하세요.', 'bad');
  });

  document.getElementById('csvBtn').addEventListener('click', function () {
    var out = [['일시', '회원번호', '성명', '종류', '콘텐츠', 'IP', '체류', '해시']];
    chained.forEach(function (c) { out.push([c.row.at, c.row.no, c.row.name, c.row.kind, c.row.title, c.row.ip, c.row.dur, c.hash]); });
    B.csv('본초_열람로그_2026-08-25.csv', out);
  });

  /* 이상 패턴 — 규칙 실계산: ① 동일 계정 다중 IP ② 짧은 기간 다수 강의 순회 */
  (function () {
    var byUser = {};
    rows.forEach(function (r) {
      byUser[r.no] = byUser[r.no] || { name: r.name, ips: {}, lecs: {}, n: 0 };
      byUser[r.no].ips[r.ip] = 1;
      if (r.kind === '강의') byUser[r.no].lecs[r.ref] = 1;
      byUser[r.no].n++;
    });
    var anoms = [];
    Object.keys(byUser).forEach(function (no) {
      var u = byUser[no];
      var ipN = Object.keys(u.ips).length;
      var lecN = Object.keys(u.lecs).length;
      if (ipN >= 3) anoms.push('<b>' + u.name + ' (' + no + ')</b> — 서로 다른 IP ' + ipN + '곳에서 접속. 계정 공유 의심 — 확인 필요');
      if (lecN >= 4) anoms.push('<b>' + u.name + ' (' + no + ')</b> — 48시간 내 강의 ' + lecN + '편 순회 열람. 대량 캡처 패턴 점검 권장');
    });
    if (anoms.length) {
      document.getElementById('anomHost').innerHTML =
        '<div class="rule-head tight"><span class="h3">이상 패턴 탐지 (' + anoms.length + ')</span></div>'
        + anoms.map(function (a) { return '<div class="anom">' + a + '</div>'; }).join('')
        + '<div style="height:10px"></div>';
    }
  })();

  renderRows();
}
</script>
</body>
</html>
