<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FORME UI Primitive Showcase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="showcase-page">
  <header class="showcase-header"><div><p class="eyebrow">FORME system / v0.1</p><h1>Primitive<br>showcase.</h1></div><a href="index.html">상품 화면 보기 <span>→</span></a></header>
  <main class="showcase-grid">
    <section class="showcase-block"><p class="block-label">01 / Actions</p><button class="primary-button inset-cta"><span>추천 사이즈 확인하기</span><span class="cta-icon">→</span></button><button class="add-button">장바구니에 담기</button><button class="save-button">내 옷장에 저장</button></section>
    <section class="showcase-block"><p class="block-label">02 / Selection</p><div class="size-options"><button>S</button><button aria-pressed="true">M</button><button>L</button><button disabled>XL</button></div><div class="preference-options"><button><strong>슬림</strong><small>몸에 가깝게</small></button><button class="is-selected"><strong>정사이즈</strong><small>적당한 여유</small></button><button><strong>여유롭게</strong><small>편안하게</small></button></div></section>
    <section class="showcase-block"><p class="block-label">03 / Inputs</p><div class="measure-grid"><label class="field-shell"><span>키</span><span class="input-line"><input value="170"><em>cm</em></span><small>140–210cm</small></label><label class="field-shell"><span>몸무게</span><span class="input-line"><input placeholder="60"><em>kg</em></span><small>35–150kg</small></label></div></section>
    <section class="showcase-block"><p class="block-label">04 / Evidence</p><div class="fit-evidence bezel"><div class="evidence-title"><span>예상 핏</span><strong>Balanced</strong></div><div class="fit-map"><div><span>어깨</span><div class="fit-scale"><i style="--position:48%"></i></div><strong>정사이즈</strong></div><div><span>가슴</span><div class="fit-scale"><i style="--position:61%"></i></div><strong>여유 있음</strong></div></div></div></section>
  </main>
</body>
</html>
