<script>
(() => {
"use strict";
const root = $("#caseRoot");
const id = new URLSearchParams(location.search).get("id");
const pub = WORKS.filter((w) => w.consent === "ok");
const idx = pub.findIndex((w) => w.id === id);
const w = pub[idx];

if (!w) {
  root.innerHTML = `
    <div class="case-missing">
      <p class="overline">CASE NOT FOUND</p>
      <h1 class="display-md">이 케이스는 공개 상태가 아닙니다</h1>
      <p>게시 동의 확보 전이거나 주소가 잘못되었습니다. 비공개 케이스는 미팅에서 공유합니다.</p>
      <a class="btn-cta" href="works.html">Works 목록으로</a>
    </div>`;
  document.title = "Case — UNFRAME 언프레임";
} else {
  document.title = `${w.title} — UNFRAME`;
  const prev = pub[(idx - 1 + pub.length) % pub.length];
  const next = pub[(idx + 1) % pub.length];
  root.innerHTML = `
    <nav class="crumbs rv in" aria-label="breadcrumb"><a href="works.html">Works</a><span>/</span><b>${w.title}</b></nav>
    <p class="overline rv in">${w.cats.map((c) => CAT_LABEL[c]).join(" · ")} · ${w.year}</p>
    <h1 class="display-lg case-title rv in" data-chars>${w.title}</h1>
    <p class="wd-sub rv in">${w.client} — 가상 케이스</p>
    <div class="case-cover rv-clip">${w.img ? `<img src="${w.img}" alt="${w.title} 키 비주얼">` : ""}</div>
    <div class="case-grid">
      <div class="wd-block rv"><h4>Problem</h4><p>${w.problem}</p></div>
      <div class="wd-block rv"><h4>Approach</h4><p>${w.solve}</p></div>
    </div>
    ${w.video ? `<div class="case-film rv"><h4>Film</h4>
      <div class="case-film-frame">
        <video preload="none" playsinline controls poster="${w.img}" src="${w.video}" hidden></video>
        <button class="film-play" id="filmPlay" aria-label="캠페인 필름 재생"><i></i><span>${w.videoLabel || "캠페인 필름"}</span></button>
      </div></div>` : ""}
    <div class="wd-block rv"><h4>Result</h4>
      <div class="wd-results">${w.results.map(([n, l]) => `<div class="wd-result"><strong>${n}</strong><span>${l}</span></div>`).join("")}</div>
      <p class="wd-evidence">근거 ${w.evidence} · 성과 표기는 표시광고법 실증 원칙을 따릅니다</p>
    </div>
    <div class="case-nav">
      <a class="case-nav-link" href="work.html?id=${prev.id}"><span class="overline">← PREV</span><b>${prev.title}</b></a>
      <a class="case-nav-link next" href="work.html?id=${next.id}"><span class="overline">NEXT →</span><b>${next.title}</b></a>
    </div>
    <div class="wd-cta rv"><a class="btn-cta btn-lg" href="contact.html">이런 프로젝트 문의하기</a></div>`;

  // 영상 뷰어 — 자동재생 없음, 방문자가 눌러야 재생
  const playBtn = document.getElementById("filmPlay");
  if (playBtn) {
    playBtn.addEventListener("click", () => {
      const v = playBtn.parentElement.querySelector("video");
      v.hidden = false;
      playBtn.remove();
      v.play();
    });
  }

  // 리빌 재관찰 (동적 삽입분)
  const io2 = new IntersectionObserver((ents) => {
    ents.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in"); io2.unobserve(e.target); } });
  }, { threshold: 0.15 });
  $$(".rv:not(.in), .rv-clip", root).forEach((el) => io2.observe(el));
}
})();
</script>
</body>
