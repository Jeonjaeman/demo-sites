<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>캠핑장 상세 — CAMP FLOW(가칭) 데모</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<a class="skip-link" href="#main">본문 바로가기</a>
<header class="site-header">
  <div class="header-inner">
    <a class="wordmark" href="index.html"><span class="mark" aria-hidden="true"></span>CAMP FLOW <span class="badge badge-neutral">데모</span></a>
    <nav class="main-nav" aria-label="주요 메뉴">
      <a href="search.html" aria-current="page">캠핑장 찾기</a>
      <a href="index.html">큐레이션</a>
      <a href="complete.html#lookup">예약조회</a>
      <a href="complete.html#faq">이용안내</a>
    </nav>
    <div class="header-cta"><a class="btn btn-primary btn-compact" href="search.html">날짜로 찾기</a></div>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-label="메뉴 열기"><span></span><span></span><span></span></button>
  </div>
</header>
<div class="mobile-drawer" role="dialog" aria-modal="true" aria-label="모바일 메뉴">
  <div class="scrim"></div>
  <div class="panel">
    <button class="close-btn" type="button" aria-label="메뉴 닫기">✕</button>
    <a href="search.html">캠핑장 찾기</a>
    <a href="index.html">큐레이션</a>
    <a href="complete.html#lookup">예약조회</a>
    <a href="complete.html#faq">이용안내</a>
    <a class="btn btn-primary" href="search.html" style="margin-top:16px">날짜로 찾기</a>
  </div>
</div>

<main id="main" class="container page-head">
  <div id="camp-root"></div>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-links">
      <a href="complete.html#faq">이용약관(데모)</a>
      <a href="complete.html#faq">개인정보처리방침(데모)</a>
      <a href="complete.html#faq">문의</a>
      <a href="credits.html">이미지 출처·라이선스</a>
      <button type="button" data-admin-open>운영 데모 패널</button>
    </div>
    <p class="demo-notice">이 화면은 캠핑장 예약 MVP의 기능 검증용 데모입니다. 결제는 실제 청구되지 않습니다. 모든 캠핑장·예약자·업체 정보는 실존하지 않는 가상 데이터입니다.</p>
  </div>
</footer>

<div class="admin-drawer" role="dialog" aria-modal="true" aria-label="운영 데모 패널">
  <div class="scrim"></div>
  <div class="panel">
    <div class="panel-head">
      <h2>운영 데모 패널</h2>
      <span class="badge badge-neutral">가상 데이터</span>
      <button class="close-btn btn btn-ghost btn-compact" type="button" style="margin-left:auto">닫기</button>
    </div>
    <div class="panel-body"></div>
  </div>
</div>

<script type="module">
import { CAMPS, defaultDates } from './assets/js/data.js';
import { boot, $, toast, loadCamps } from './assets/js/app.js';
import { siteStatus, calcNights, calcRefund, AVAILABILITY_LABEL, formatKRW, isISODate } from './assets/js/core.js';

boot();

const params = new URLSearchParams(location.search);
const def = defaultDates();
const camps = loadCamps();
const requestedCamp = camps.find((c) => c.id === params.get('id'));
const id = requestedCamp?.id || CAMPS[0].id;
const rawCheckIn = isISODate(params.get('checkIn')) ? params.get('checkIn') : def.checkIn;
const rawCheckOut = isISODate(params.get('checkOut')) ? params.get('checkOut') : def.checkOut;
const validRange = calcNights(rawCheckIn, rawCheckOut) >= 1 && calcNights(rawCheckIn, rawCheckOut) <= 30;
const checkIn = validRange ? rawCheckIn : def.checkIn;
const checkOut = validRange ? rawCheckOut : def.checkOut;
const guestParam = Number(params.get('guests'));
const guests = Number.isInteger(guestParam) && guestParam >= 1 && guestParam <= 8 ? guestParam : 2;
const camp = camps.find((c) => c.id === id);
const root = $('#camp-root');

if (!camp) {
  root.innerHTML = `
    <div class="state-block" style="margin-top:48px">
      <h1>캠핑장을 찾을 수 없어요.</h1>
      <p>주소가 바뀌었거나 데모 데이터에서 제외된 캠핑장일 수 있어요.</p>
      <div class="actions"><a class="btn btn-primary" href="search.html">캠핑장 찾기로 돌아가기</a></div>
    </div>`;
} else {
  const nights = Math.max(1, calcNights(checkIn, checkOut));
  let selectedSite = camp.sites[0].id;
  const firstSite = camp.sites[0];
  const firstStatus = siteStatus(camp, firstSite.id, checkIn, nights);

  const galleryImgs = [camp.image, 'assets/img/detail-01.webp', 'assets/img/detail-02.webp', 'assets/img/detail-03.webp', 'assets/img/detail-04.webp'];

  root.innerHTML = `
    <nav aria-label="breadcrumb" class="small"><a href="search.html">캠핑장 찾기</a> / ${camp.region} / ${camp.name}</nav>
    <h1 class="page-title" style="margin-top:12px">${camp.name}</h1>
    <p class="lead" style="margin-top:8px">${camp.region} · ${camp.type} · ${camp.tags.join(' · ')} <span class="badge badge-neutral" style="margin-left:8px">가상 캠핑장</span></p>

    <section class="camp-first-booking" aria-label="첫 화면 예약 요약">
      <div><span class="small">${checkIn} · ${nights}박</span><strong class="num">₩${formatKRW(firstSite.price)} <small>/ 1박</small></strong></div>
      <span class="badge ${{ available: 'badge-available', needs_confirmation: 'badge-confirm', sold_out: 'badge-soldout' }[firstStatus]}">${AVAILABILITY_LABEL[firstStatus]}</span>
      <a class="btn btn-primary" href="#site-list">날짜·사이트 선택</a>
    </section>

    <div class="gallery" style="margin-top:32px">
      <img src="${galleryImgs[0]}" alt="${camp.name} 대표 풍경 (공개 라이선스 사진)" width="1200" height="750" fetchpriority="high" style="border-radius:12px;width:100%;height:100%;object-fit:cover;grid-row:span 2">
      ${galleryImgs.slice(1, 3).map((src, i) => `<img src="${src}" alt="${camp.name} 보조 사진 ${i + 1}" width="600" height="369" loading="lazy" style="border-radius:12px;width:100%;height:100%;object-fit:cover">`).join('')}
    </div>
    <p class="gallery-indicator" aria-live="polite">1 / 3 · 좌우로 사진 보기</p>

    <div class="detail-layout" style="margin-top:48px">
      <div style="display:flex;flex-direction:column;gap:48px">
        <section aria-labelledby="intro-t">
          <h2 id="intro-t" style="font-size:28px">소개</h2>
          <p style="margin-top:12px;line-height:1.7">${camp.intro}</p>
        </section>

        <section aria-labelledby="info-t">
          <h2 id="info-t" style="font-size:28px">기본 정보</h2>
          <table class="info-table" style="margin-top:16px">
            <tr><th scope="row">주소</th><td>${camp.address}</td></tr>
            <tr><th scope="row">입실 · 퇴실</th><td>${camp.checkInOut}</td></tr>
            <tr><th scope="row">최대 인원</th><td class="num">${camp.maxGuests}명</td></tr>
            <tr><th scope="row">반려동물</th><td>${camp.pets ? '동반 가능' : '동반 불가'}</td></tr>
            <tr><th scope="row">카라반 진입</th><td>${camp.caravan ? '가능' : '불가'}</td></tr>
            <tr><th scope="row">전기</th><td>${camp.electric ? '사용 가능' : '사용 불가'}</td></tr>
            <tr><th scope="row">화로</th><td>${camp.fire ? '사용 가능' : '사용 불가'}</td></tr>
          </table>
        </section>

        <section aria-labelledby="sites-t">
          <h2 id="sites-t" style="font-size:28px">사이트와 예약 가능 여부</h2>
          <p class="small" style="margin-top:8px" role="status" id="avail-note">${checkIn} ~ ${checkOut} · ${nights}박 기준으로 계산한 데모 상태입니다. 실시간 재고가 아닙니다.</p>
          <div id="site-list" style="margin-top:16px;display:flex;flex-direction:column;gap:12px"></div>
        </section>

        <section aria-labelledby="options-t">
          <h2 id="options-t" style="font-size:28px">부가 옵션</h2>
          <p class="small" style="margin-top:8px">인근 옵션상품은 예약 단계에서 수량을 골라 함께 요청할 수 있어요.</p>
          <div style="margin-top:8px">
            ${camp.options.map((o) => `
              <div class="option-row">
                <div class="o-info"><p class="o-name">${o.name}</p><p class="o-price num">₩${formatKRW(o.price)} / ${o.unit}</p></div>
                <span class="tag">예약 시 선택</span>
              </div>`).join('')}
          </div>
        </section>

        <section aria-labelledby="refund-t">
          <h2 id="refund-t" style="font-size:28px">이용 규칙과 환불 예상액</h2>
          <p style="margin-top:12px">매너타임 22시~07시. 예약은 담당자가 캠핑장에 확인한 뒤 확정됩니다. 아래 환불 예상액은 체크인 기준 ${checkIn}, 오늘부터의 D-day로 실제 계산한 데모 값입니다.</p>
          <table class="info-table" style="margin-top:16px" id="refund-table"></table>
        </section>

        <section aria-labelledby="similar-t">
          <h2 id="similar-t" style="font-size:28px">같은 지역 다른 캠핑장</h2>
          <div class="grid-results" style="margin-top:16px">
            ${CAMPS.filter((c) => c.region === camp.region && c.id !== camp.id).slice(0, 3).map((c) => `
              <article class="card"><a class="card-link" href="camp.html?id=${c.id}&checkIn=${checkIn}&checkOut=${checkOut}">
                <div class="card-img"><img src="${c.image}" alt="${c.name} 풍경" width="800" height="600" loading="lazy"></div>
                <div class="card-body"><p class="card-meta">${c.region} · ${c.type}</p><h3 class="card-title" style="font-size:20px">${c.name}</h3>
                <div class="card-foot"><p class="card-price">₩${formatKRW(c.pricePerNight)} <small>/ 1박</small></p></div></div>
              </a></article>`).join('') || '<p class="small">같은 지역의 다른 캠핑장이 아직 없어요.</p>'}
          </div>
        </section>
      </div>

      <aside class="sticky-panel" aria-label="예약 패널">
        <h2 style="font-size:20px">예약하기</h2>
        <dl>
          <div class="summary-row"><dt>날짜</dt><dd class="num">${checkIn} ~ ${checkOut}</dd></div>
          <div class="summary-row"><dt>인원</dt><dd class="num">${guests}명</dd></div>
          <div class="summary-row"><dt>사이트</dt><dd id="panel-site"></dd></div>
          <div class="summary-row"><dt>상태</dt><dd id="panel-status"></dd></div>
          <div class="summary-row summary-total"><dt>${nights}박 합계</dt><dd id="panel-price" class="num"></dd></div>
        </dl>
        <p class="small">예약 요청 후 담당자가 캠핑장에 확인합니다. 확정 전에는 결제가 완료되지 않으며, 이 데모에서는 실제 청구가 없습니다.</p>
        <a class="btn btn-primary btn-block" id="book-cta" href="#">이 날짜로 예약하기
          <span class="arrow-wrap" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></span></a>
      </aside>
    </div>
    <div class="camp-mobile-sticky" aria-label="모바일 예약 요약">
      <div><span id="mobile-status" class="small">${AVAILABILITY_LABEL[firstStatus]}</span><strong id="mobile-price" class="num">₩${formatKRW(firstSite.price)} / 1박</strong></div>
      <a class="btn btn-primary" href="#site-list">날짜 선택</a>
    </div>`;

  // 사이트 목록 + 패널 연동
  const siteList = $('#site-list');
  function renderSites() {
    siteList.innerHTML = camp.sites.map((s) => {
      const st = siteStatus(camp, s.id, checkIn, nights);
      const badge = { available: 'badge-available', needs_confirmation: 'badge-confirm', sold_out: 'badge-soldout' }[st];
      const disabled = st === 'sold_out';
      return `
      <label class="card" style="flex-direction:row;align-items:center;gap:16px;padding:16px 20px;cursor:${disabled ? 'not-allowed' : 'pointer'}">
        <input type="radio" name="site" value="${s.id}" ${s.id === selectedSite ? 'checked' : ''} ${disabled ? 'disabled' : ''} style="width:22px;height:22px;accent-color:var(--color-primary-700)">
        <div style="flex:1">
          <p style="font-weight:600">${s.name}</p>
          <p class="small num">최대 ${s.capacity}명 · ₩${formatKRW(s.price)} / 1박</p>
        </div>
        <span class="badge ${badge}">${AVAILABILITY_LABEL[st]}</span>
      </label>`;
    }).join('');
    siteList.querySelectorAll('input[name="site"]').forEach((radio) => {
      radio.addEventListener('change', () => {
        selectedSite = radio.value;
        renderPanel();
      });
    });
  }

  function renderPanel() {
    const site = camp.sites.find((s) => s.id === selectedSite);
    const st = siteStatus(camp, selectedSite, checkIn, nights);
    $('#panel-site').textContent = site.name;
    $('#panel-status').innerHTML = `<span class="badge ${{ available: 'badge-available', needs_confirmation: 'badge-confirm', sold_out: 'badge-soldout' }[st]}">${AVAILABILITY_LABEL[st]}</span>`;
    $('#panel-price').textContent = `₩${formatKRW(site.price * nights)}`;
    $('#mobile-status').textContent = AVAILABILITY_LABEL[st];
    $('#mobile-price').textContent = `₩${formatKRW(site.price)} / 1박`;
    const q = new URLSearchParams({ id: camp.id, siteId: selectedSite, checkIn, checkOut, guests: String(guests) });
    const cta = $('#book-cta');
    if (st === 'sold_out') {
      cta.textContent = '다른 날짜 보기';
      cta.setAttribute('href', `search.html?checkIn=${checkIn}&checkOut=${checkOut}&guests=${guests}`);
    } else {
      cta.innerHTML = '이 날짜로 예약하기 <span class="arrow-wrap" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></span>';
      cta.setAttribute('href', `booking.html?${q}`);
    }
  }

  // 환불표 (D-7/D-3/D-1 실제 계산, 옵션 분리)
  const site = camp.sites[0];
  const stay = site.price * nights;
  const optSample = camp.options[0].price;
  const daysBefore = Math.max(0, Math.round((new Date(checkIn) - new Date(new Date().toISOString().slice(0, 10))) / 86400000));
  const rows = [7, 3, 1, 0].map((d) => {
    const r = calcRefund(d, stay, optSample);
    return `<tr><th scope="row">${r.band}</th><td class="num">숙박 ₩${formatKRW(r.stayRefund)} (${Math.round(r.stayRate * 100)}%)</td><td class="num">옵션 ₩${formatKRW(r.optionRefund)} (${Math.round(r.optionRate * 100)}%)</td></tr>`;
  }).join('');
  $('#refund-table').innerHTML = `
    <tr><th>취소 시점</th><th>숙박비 환불 예상</th><th>옵션 환불 예상</th></tr>
    ${rows}
    <tr><th scope="row">현재 기준</th><td colspan="2">오늘은 체크인 ${daysBefore}일 전입니다. 이 시점에 취소하면 위 표의 해당 구간이 적용됩니다. (데모 계산, 실제 정책 미정)</td></tr>`;

  renderSites();
  renderPanel();
}
</script>
</body>
</html>
