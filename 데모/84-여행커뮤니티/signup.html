<!DOCTYPE html>
<html lang="ko" data-text="0">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>가입 — 놀판</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="assets/css/style.css">
<script>try{document.documentElement.dataset.text=JSON.parse(localStorage.getItem('nolpan.text'))??0}catch(e){}</script>
</head>
<body>
<main id="app" class="no-tab">
  <div class="steps" id="steps"><span id="step-label">1/4 시작</span><div class="bar"><i id="step-bar"></i></div></div>
  <div id="body"></div>
</main>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
(function(){
  const { $, $$, esc, D, q, state, save, mountShell, toast, sheet, closeSheet, ageJudge, NOW } = NP;
  mountShell({ back: 'index.html', title: '놀판 시작하기' });
  let step = +(q.get('step') || 1);
  const signup = NP.load('signup', { via: '', agree: false, verify: null, nick: '', color: '#1f7a5c' });
  const STEP_NAMES = ['시작', '약관', '연령 확인', '닉네임'];
  const body = $('#body');
  const persist = () => save('signup', signup);

  function go(n){ step = n; history.replaceState(null, '', '?step=' + n + (q.get('verify') ? '&verify=1' : '')); render(); window.scrollTo({ top: 0 }); }
  function render(){
    $('#step-label').textContent = `${step}/4 ${STEP_NAMES[step-1]}`;
    requestAnimationFrame(() => $('#step-bar').style.width = (step / 4 * 100) + '%');
    ({ 1: s1, 2: s2, 3: s3, 4: s4 })[step]();
    NP.reveal();
  }

  function s1(){
    body.innerHTML = `<section class="sec rv" style="padding-top:28px">
      <p class="eyebrow">성인 전용 여행 커뮤니티</p>
      <h1 style="margin:0 0 10px;font-size:1.7rem;letter-spacing:-.03em;line-height:1.2">여행 이야기를<br>나눌 준비가 되셨나요?</h1>
      <p class="lead">놀판은 청소년보호법 기준 <strong>성인만</strong> 가입할 수 있습니다. 카카오나 네이버 계정으로 1분이면 끝납니다.</p>
      <div style="display:grid;gap:10px;margin-top:24px">
        <button class="btn btn-lg btn-kakao btn-block" data-via="카카오"><svg viewBox="0 0 24 24" width="22" height="22" style="stroke:none;fill:#191919"><path d="M12 4C7 4 3 7.1 3 10.9c0 2.4 1.6 4.5 4 5.8l-.9 3.4 3.9-2.6c.7.1 1.3.2 2 .2 5 0 9-3.1 9-6.9S17 4 12 4z"/></svg>카카오로 시작하기</button>
        <button class="btn btn-lg btn-naver btn-block" data-via="네이버"><b style="font-size:1.1rem;margin-right:2px">N</b> 네이버로 시작하기</button>
        <button class="btn btn-lg btn-ghost btn-block" data-via="이메일">이메일로 가입하기</button>
      </div>
      <div class="notice notice-soft" style="margin-top:20px;font-size:.85rem">카카오·네이버 로그인은 <strong style="display:inline">이름·프로필·이메일</strong>만 받습니다. 생년월일은 받지 않고, 성인 여부는 다음 단계에서 따로 확인합니다. (카카오 운영정책: 출생연도로 성인 인증 불가)</div>
      <p class="lead" style="margin-top:16px;font-size:.88rem">이미 회원이신가요? <a href="my.html" style="color:var(--primary);font-weight:700">로그인</a></p>
    </section>`;
    $$('[data-via]').forEach(b => b.onclick = () => { signup.via = b.dataset.via; persist(); toast(`${signup.via} 로그인 (데모 — 실제 창은 열리지 않습니다)`); setTimeout(() => go(2), 400); });
  }

  function s2(){
    body.innerHTML = `<section class="sec rv" style="padding-top:24px">
      <h1 style="margin:0 0 8px;font-size:1.5rem;letter-spacing:-.02em">약관에 동의해 주세요</h1>
      <p class="lead">필수 2개만 체크하면 됩니다. 아래 「이런 글은 안 돼요」도 꼭 읽어 주세요.</p>
      <div style="margin-top:18px;display:grid;gap:2px">
        <label class="check" style="border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:6px"><input type="checkbox" id="all"><span style="font-weight:800">모두 동의</span></label>
        <label class="check"><input type="checkbox" class="req" data-k="tos"><span>[필수] 서비스 이용약관 <small>게시판 규칙·제재 기준 포함</small></span><button type="button" class="hdr-btn" aria-label="이용약관 보기" data-doc="tos" style="margin-left:auto"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button></label>
        <label class="check"><input type="checkbox" class="req" data-k="privacy"><span>[필수] 개인정보 처리방침 <small>성인 확인 결과·확인 수단·확인 일시 보관</small></span><button type="button" class="hdr-btn" aria-label="처리방침 보기" data-doc="privacy" style="margin-left:auto"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button></label>
        <label class="check"><input type="checkbox" data-k="mkt"><span>[선택] 여행 소식·이벤트 알림 받기</span></label>
      </div>
      <div class="notice notice-warn" style="margin-top:18px"><strong>이런 글은 안 돼요</strong><ul style="margin:4px 0 0;padding-left:18px;line-height:1.6">${D.termsSummary.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>
      <div class="kv" style="margin-top:14px"><dt>보관하는 것</dt><dd>성인 여부 · 확인 수단 · 확인 일시</dd><dt>보관하지 않는 것</dt><dd>생년월일 원본 · 주민번호</dd><dt>탈퇴 후</dt><dd>재가입 제한용 식별값만 암호화해 1년</dd></div>
      <button class="btn btn-lg btn-primary btn-block" id="next" style="margin-top:20px" disabled>다음</button>
    </section>`;
    const reqs = $$('.req'), all = $('#all'), next = $('#next');
    const sync = () => { next.disabled = !reqs.every(c => c.checked); all.checked = $$('input[type=checkbox]', body).filter(c => c !== all).every(c => c.checked); };
    all.onchange = () => { $$('input[type=checkbox]', body).forEach(c => c.checked = all.checked); sync(); };
    $$('input[data-k]').forEach(c => c.onchange = sync);
    $$('[data-doc]').forEach(b => b.onclick = (e) => { e.preventDefault(); sheet(`<h3 class="sheet-title">${b.dataset.doc==='tos'?'서비스 이용약관':'개인정보 처리방침'}</h3><p class="sheet-sub">의뢰자가 준비 중인 문구 자리입니다. 데모에서는 성인 확인·보관·신고 처리 조항이 들어갈 위치만 보여 드립니다.</p><div class="notice notice-soft" style="font-size:.85rem;line-height:1.7">제1조 목적 … 제5조 (성인 확인) 회원은 가입 시 본인확인기관을 통한 성인 인증 또는 생년월일 확인을 거친다. 생년월일만 확인한 회원은 일부 게시판 열람이 제한될 수 있다. … 제9조 (게시물 관리) 신고가 접수된 게시물은 검토가 끝날 때까지 접근이 제한될 수 있으며(정보통신망법 44조의2) 작성자는 이의를 제기할 수 있다. … 제12조 (탈퇴) 탈퇴 시 작성 글의 처리는 회원이 선택하며, 부정이용 방지를 위한 식별값은 1년간 보관 후 파기한다.</div><div class="sheet-actions"><button class="btn btn-primary" data-close>확인</button></div>`, { label: '약관' }); });
    next.onclick = () => { signup.agree = true; persist(); go(3); };
  }

  function s3(){
    const verifyFirst = !!q.get('verify');
    body.innerHTML = `<section class="sec rv" style="padding-top:24px">
      <h1 style="margin:0 0 8px;font-size:1.5rem;letter-spacing:-.02em">성인이신지 확인할게요</h1>
      <p class="lead">미성년자 보호를 위해 꼭 필요한 절차입니다. 나이는 다른 회원에게 보이지 않습니다.</p>
      <div class="seg" style="margin:18px 0 14px" role="tablist"><button role="tab" data-way="phone" aria-pressed="${verifyFirst||signup.verify?.way!=='dob'}">휴대폰·간편 본인확인</button><button role="tab" data-way="dob" aria-pressed="${!verifyFirst&&signup.verify?.way==='dob'}">생년월일 입력</button></div>
      <div id="way"></div>
    </section>`;
    let way = (verifyFirst || signup.verify?.way !== 'dob') ? 'phone' : 'dob';
    const drawWay = () => {
      $$('[data-way]').forEach(b => b.setAttribute('aria-pressed', b.dataset.way === way));
      if (way === 'phone') {
        $('#way').innerHTML = `<div class="notice notice-info"><strong>권장 경로 — 모든 게시판을 볼 수 있습니다</strong>통신사 본인확인(PASS)이나 카카오·네이버·토스 간편인증으로 확인합니다. 저희는 결과(성인 여부·확인 수단·일시)만 받고 <strong style="display:inline">주민번호·생년월일은 저장하지 않습니다.</strong></div>
          <div style="display:grid;gap:8px;margin-top:14px">${['PASS (통신 3사)', '카카오 인증서', '네이버 인증서', '토스 인증'].map(n => `<button class="btn btn-lg btn-ghost btn-block" data-cert="${n}" style="justify-content:space-between"><span>${n}</span><svg viewBox="0 0 24 24" width="20" height="20"><path d="M9 6l6 6-6 6"/></svg></button>`).join('')}</div>
          <p class="hint" style="margin-top:12px">실제 서비스에서는 본인확인기관 창이 열립니다. 데모에서는 샘플 인물을 고르면 결과가 돌아옵니다.</p>`;
        $$('[data-cert]').forEach(b => b.onclick = () => certSheet(b.dataset.cert));
      } else {
        $('#way').innerHTML = `<div class="notice notice-warn"><strong>임시 경로 — 일부 게시판이 잠깁니다</strong>생년월일만으로는 카카오 정책상 성인 확인으로 인정되지 않습니다. 이 경로로 가입하면 <strong style="display:inline">「자기신고 회원」</strong>이 되어 카지노가 있는 지역(정선·하이원, 마카오, 필리핀) 게시판 본문을 볼 수 없습니다. 나중에 본인확인을 하면 풀립니다.</div>
          <div class="field" style="margin-top:14px"><span class="lbl">생년월일</span><div class="date-row"><input class="input" id="y" inputmode="numeric" placeholder="년" maxlength="4" aria-label="년"><input class="input" id="m" inputmode="numeric" placeholder="월" maxlength="2" aria-label="월"><input class="input" id="d" inputmode="numeric" placeholder="일" maxlength="2" aria-label="일"></div><p class="hint" id="judge">입력하면 오늘(2026년 10월 20일) 기준으로 바로 판정합니다.</p></div>
          <div class="field"><span class="lbl">판정 기준 <small style="font-weight:500;color:var(--sub)">(의뢰자 결정 사항 — 미팅 확인)</small></span><div class="seg" style="margin:0" role="tablist"><button role="tab" data-mode="youth" aria-pressed="${state.ageMode==='youth'}">청소년보호법 (연 나이)</button><button role="tab" data-mode="civil" aria-pressed="${state.ageMode==='civil'}">민법 (만 나이)</button></div><p class="hint">청소년보호법은 「만 19세가 되는 해 1월 1일」부터 성인으로 봅니다. 만 나이 기준으로 막으면 법적으로 성인인 사람을 잘못 막습니다.</p></div>
          <div class="sample-btns"><button type="button" data-ex="2007-12-31">예시: 2007년 12월 31일생</button><button type="button" data-ex="2008-01-01">예시: 2008년 1월 1일생</button><button type="button" data-ex="1968-05-10">예시: 1968년 5월 10일생</button></div>
          <button class="btn btn-lg btn-primary btn-block" id="dob-next" style="margin-top:18px" disabled>다음</button>`;
        const y = $('#y'), m = $('#m'), d = $('#d'), jg = $('#judge'), next = $('#dob-next');
        let last = null;
        const judge = () => {
          const r = ageJudge(+y.value, +m.value, +d.value, state.ageMode);
          last = r;
          if (!r.valid) { jg.textContent = '입력하면 오늘(2026년 10월 20일) 기준으로 바로 판정합니다.'; jg.className = 'hint'; next.disabled = true; return; }
          jg.innerHTML = `${esc(r.text)} → <strong>${r.adult ? '가입할 수 있습니다' : '가입할 수 없습니다'}</strong>`; jg.className = r.adult ? 'ok-msg' : 'err-msg';
          next.disabled = !r.adult; next.textContent = r.adult ? '다음 (자기신고 회원으로)' : '미성년자는 가입할 수 없습니다';
        };
        [y, m, d].forEach(i => i.addEventListener('input', judge));
        $$('[data-mode]').forEach(b => b.onclick = () => { state.ageMode = b.dataset.mode; save('ageMode', state.ageMode); $$('[data-mode]').forEach(x => x.setAttribute('aria-pressed', x === b)); judge(); });
        $$('[data-ex]').forEach(b => b.onclick = () => { const [a, bb, c] = b.dataset.ex.split('-'); y.value = a; m.value = +bb; d.value = +c; judge(); });
        next.onclick = () => { if (!last?.adult) return; signup.verify = { way: 'dob', level: 'self', at: new Date().toISOString(), mode: state.ageMode }; persist(); go(4); };
      }
    };
    $$('[data-way]').forEach(b => b.onclick = () => { way = b.dataset.way; drawWay(); });
    drawWay();
  }
  function certSheet(cert){
    const people = [{ n: '김영희', b: '1966-03-12', adult: true }, { n: '박준서', b: '2007-11-02', adult: true, note: '만 18세 · 청소년보호법상 성인' }, { n: '이서준', b: '2009-06-30', adult: false }];
    const w = sheet(`<h3 class="sheet-title">${esc(cert)} 본인확인 (모의)</h3><p class="sheet-sub">실제로는 인증기관 화면이 뜹니다. 데모에서는 샘플 인물을 고르면 그 사람의 결과가 돌아옵니다. 놀판은 결과만 받습니다.</p>
      <div class="radio-list">${people.map((p, i) => `<label class="radio-row"><input type="radio" name="pp" value="${i}" ${i===0?'checked':''}><span><strong>${p.n}</strong><small>${p.b.replace(/-/g,'.')}생 · ${p.adult ? '성인' : '청소년'}${p.note ? ' · ' + p.note : ''}</small></span></label>`).join('')}</div>
      <div class="sheet-actions"><button class="btn btn-ghost" data-close>취소</button><button class="btn btn-primary" id="cert-go">인증하기</button></div>`, { label: '본인확인' });
    $('#cert-go', w).onclick = () => {
      const p = people[+w.querySelector('input[name=pp]:checked').value];
      closeSheet();
      if (!p.adult) { setTimeout(() => sheet(`<h3 class="sheet-title">가입할 수 없습니다</h3><p class="sheet-sub">${esc(p.n)} 님은 청소년보호법 기준 청소년입니다. 놀판은 성인 전용 커뮤니티라 가입이 안 됩니다. 입력한 정보는 저장하지 않았습니다.</p><div class="sheet-actions"><a class="btn btn-ghost" href="index.html">홈으로</a><button class="btn btn-primary" data-close>다른 방법</button></div>`, { label: '가입 불가' }), 260); return; }
      signup.verify = { way: 'phone', cert, level: 'verified', at: new Date().toISOString() }; persist();
      if (q.get('verify') && state.account === 'self') { state.account = 'verified'; save('account', state.account); toast('본인확인이 끝났습니다. 모든 게시판을 볼 수 있습니다'); setTimeout(() => history.length > 1 ? history.back() : location.href = 'domestic.html?region=jeongseon', 700); return; }
      toast(`성인 확인 완료 · ${cert} · ${new Date().toLocaleString('ko-KR', { month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' })}`);
      setTimeout(() => go(4), 500);
    };
  }

  function s4(){
    const colors = ['#1f7a5c', '#b25a1f', '#6b4fbb', '#2b6cb0', '#9f2f2f', '#0e8a8a', '#7a4f2a', '#4c6b2f'];
    body.innerHTML = `<section class="sec rv" style="padding-top:24px">
      <h1 style="margin:0 0 8px;font-size:1.5rem;letter-spacing:-.02em">어떻게 불러 드릴까요?</h1>
      <p class="lead">닉네임은 글과 댓글에 보입니다. 사진은 나중에 바꿔도 됩니다.</p>
      <div style="display:flex;justify-content:center;margin:22px 0 6px"><span class="avatar" id="av" style="--av:${signup.color};width:88px;height:88px;font-size:36px" aria-hidden="true">${esc((signup.nick||'놀')[0])}</span></div>
      <div class="chips" style="justify-content:center;padding-bottom:4px">${colors.map(c => `<button type="button" class="chip" data-color="${c}" aria-pressed="${c===signup.color}" style="width:44px;padding:0;background:${c};border-color:${c};color:#fff" aria-label="아바타 색"></button>`).join('')}</div>
      <div class="field" style="margin-top:14px"><label for="nick">닉네임</label><input class="input" id="nick" maxlength="12" value="${esc(signup.nick)}" placeholder="2~12자"><span class="hint" id="nick-msg">한글·영문·숫자. 다른 회원과 같을 수 없습니다.</span></div>
      <div class="kv"><dt>가입 경로</dt><dd>${esc(signup.via || '카카오')}</dd><dt>성인 확인</dt><dd>${signup.verify?.level === 'verified' ? `완료 · ${esc(signup.verify.cert)} · ${new Date(signup.verify.at).toLocaleDateString('ko-KR')}` : signup.verify ? '생년월일 자기신고 (일부 게시판 제한)' : '미완료'}</dd><dt>저장 항목</dt><dd>성인 여부 · 확인 수단 · 일시</dd></div>
      <button class="btn btn-lg btn-primary btn-block" id="done" style="margin-top:20px" disabled>놀판 시작하기</button>
    </section>`;
    const nick = $('#nick'), msg = $('#nick-msg'), done = $('#done'), av = $('#av');
    const taken = D.users.map(u => u.nick);
    const check = () => { const v = nick.value.trim(); av.textContent = (v || '놀')[0]; if (v.length < 2) { msg.textContent = '2자 이상 입력해 주세요'; msg.className = 'hint'; done.disabled = true; return; } if (taken.includes(v)) { msg.textContent = '이미 쓰고 있는 닉네임입니다'; msg.className = 'err-msg'; done.disabled = true; return; } msg.textContent = '쓸 수 있는 닉네임입니다'; msg.className = 'ok-msg'; done.disabled = false; };
    nick.addEventListener('input', check); check();
    $$('[data-color]').forEach(b => b.onclick = () => { signup.color = b.dataset.color; av.style.setProperty('--av', signup.color); $$('[data-color]').forEach(x => x.setAttribute('aria-pressed', x === b)); });
    done.onclick = () => {
      signup.nick = nick.value.trim(); persist();
      state.profile = { nick: signup.nick, color: signup.color }; save('profile', state.profile);
      state.account = signup.verify?.level === 'verified' ? 'verified' : 'self'; save('account', state.account);
      body.innerHTML = `<div class="done-wrap rv"><div class="done-ico">✓</div><h1>${esc(signup.nick)} 님, 환영합니다</h1><p>${state.account === 'self' ? '자기신고 회원으로 시작합니다. 카지노가 있는 지역 게시판은 본인확인 후 볼 수 있어요.' : '성인 확인이 끝났습니다. 모든 게시판을 볼 수 있어요.'}</p><div style="display:grid;gap:8px;width:100%;margin-top:10px"><a class="btn btn-lg btn-primary" href="index.html">홈으로</a><a class="btn btn-lg btn-ghost" href="text.html">글자 크기 먼저 정하기</a></div></div>`;
      $('#step-label').textContent = '완료'; $('#step-bar').style.width = '100%'; NP.reveal();
    };
  }
  render();
})();
</script>
</body>
</html>
