<!DOCTYPE html>
<html lang="ko" data-text="0">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>글 보기 — 놀판</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="assets/css/style.css">
<script>try{document.documentElement.dataset.text=JSON.parse(localStorage.getItem('nolpan.text'))??0}catch(e){}</script>
</head>
<body>
<main id="app" class="no-tab has-cmtbar"><div id="body"></div></main>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
(function(){
  const { $, $$, esc, D, q, state, save, img, post, user, avatar, badge, crumb, boardOf, commentsOf, ago, fmt, mountShell, me, canReadBody, toggleLike, moreSheet, reportSheet, needLogin, stagger, toast, reduce } = NP;
  const id = q.get('id') || '201';
  const p = post(id);
  mountShell({ back: p ? boardOf(p).page : 'index.html', title: p ? crumb(p) : '글 보기' });
  const body = $('#body');
  if (!p) { body.innerHTML = '<div class="empty"><strong>글을 찾을 수 없습니다</strong>삭제되었거나 차단한 회원의 글입니다<br><a class="btn btn-soft" style="margin-top:14px" href="index.html">홈으로</a></div>'; return; }
  let replyTo = null;

  function linkify(text){
    return esc(text).replace(/(https?:\/\/[^\s<]+)/g, '<a class="ext" href="$1">$1</a>').replace(/\n/g, '\n');
  }
  function render(){
    const u = user(p.uid), acc = me().acc, read = canReadBody(p), mine = p.uid === 'me';
    const isReview = p.status === 'review';
    const cm = commentsOf(p.id);
    const roots = cm.filter(c => !c.parent), replies = (pid) => cm.filter(c => c.parent === pid);
    const liked = !!state.likes[p.id];
    const bodyHtml = isReview
      ? `<div class="review-box"><h3>신고가 접수되어 검토 중인 게시물입니다</h3><p>신고 ${p.reported}건 · 사유: ${(p.reasons||[]).map(esc).join(', ')}<br>운영진 검토가 끝날 때까지 본문과 사진이 가려집니다.${mine ? '' : ' 작성자에게는 사유와 이의제기 안내가 전달됩니다.'}</p>${mine || acc.key==='verified' && p.uid==='ux' ? '' : ''}<div class="kv" style="margin-top:4px"><dt>작성자에게 보이는 것</dt><dd>가림 사유 · 이의제기 버튼 · 처리 기한(접수 후 3일)</dd><dt>근거</dt><dd>정보통신망법 44조의2 임시조치 · 플레이 UGC 정책</dd></div><button class="btn btn-ghost" id="appeal">작성자 화면: 이의제기 보기</button></div>`
      : !read.ok
        ? `<div class="lock-card" style="margin:14px 0"><h3>${read.why==='guest' ? '회원만 본문을 볼 수 있습니다' : '본인확인이 필요한 게시판입니다'}</h3><p>${read.why==='guest' ? '성인 전용 커뮤니티라 비회원에게는 제목까지만 보여 드립니다.' : '카지노가 있는 지역 게시판의 본문·사진·댓글은 휴대폰·간편 본인확인을 마친 회원만 볼 수 있습니다.'}</p><a class="btn btn-primary" href="${read.why==='guest' ? 'signup.html' : 'signup.html?step=3&verify=1'}">${read.why==='guest' ? '가입하고 보기' : '본인확인하고 열기'}</a></div>`
        : `${p.photos && p.photos.length ? `<div class="photos" id="photos">${p.photos.map((k,i) => `<img src="${img(k)}" alt="${esc(p.title)} 사진 ${i+1}" ${i?'loading="lazy"':''}>`).join('')}</div>${p.photos.length>1 ? `<p class="photos-n"><span id="ph-n">1</span> / ${p.photos.length} · 옆으로 넘기세요</p>` : ''}` : ''}
           <div class="body">${linkify(p.body)}</div>`;
    body.innerHTML = `
      <article class="post">
        <div class="post-crumb">${esc(crumb(p))}</div>
        <h1>${p.sponsored ? '<span class="label label-ad">광고·협찬</span>' : ''}${p.answered ? '<span class="label label-ok">답변 완료</span>' : ''}${esc(isReview ? '검토 중인 게시물' : p.title)}</h1>
        <div class="author">${avatar(u, 44)}<div class="who"><div class="nick">${esc(u.nick)}${badge(u)}${u.biz ? `<span class="badge badge-biz">${esc(u.biz)}</span>` : ''}</div><div class="meta">${ago(p.at)} · 조회 ${fmt(p.views)}${u.joined ? ` · 가입 ${u.joined.slice(0,7).replace('-', '.')}` : ''}</div></div><button class="hdr-btn" id="more" aria-label="더보기"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button></div>
        ${p.sponsored ? `<div class="notice notice-soft" style="margin-top:12px;font-size:.85rem">이 글은 작성자가 업체로부터 숙박·할인 등 <strong style="display:inline">대가를 받았다고 표시한 글</strong>입니다. (공정위 추천·보증 심사지침)</div>` : ''}
        ${bodyHtml}
        ${read.ok && !isReview ? `<div class="actions">
          <button class="act ${liked?'on':''}" id="like" aria-pressed="${liked}"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><span data-count>${fmt(p.likes)}</span></button>
          <a class="act" href="#cmts"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg><span>${cm.filter(c=>!c.deleted).length}</span></a>
          <button class="act" id="share"><svg viewBox="0 0 24 24"><path d="M4 12v7h16v-7M12 3v13M8 7l4-4 4 4"/></svg><span>공유</span></button>
        </div>` : ''}
      </article>
      ${read.ok && !isReview ? `<section class="cmts" id="cmts" aria-label="댓글"><h2>댓글 ${cm.filter(c=>!c.deleted).length}</h2><div id="cmt-list">
        ${roots.length ? roots.map(c => cmtHtml(c, u) + (replies(c.id).length ? `<button class="reply-toggle" data-tg="${c.id}" aria-expanded="true">답글 ${replies(c.id).length}개 접기</button><div class="replies" id="rp-${c.id}">${replies(c.id).map(r => cmtHtml(r, u, c)).join('')}</div>` : '')).join('') : '<div class="cmt-empty"><strong>아직 댓글이 없습니다</strong>첫 댓글을 남겨 보세요. 다정하게.</div>'}
      </div></section>` : ''}`;
    // 사진 인덱스
    const ph = $('#photos'); if (ph) ph.addEventListener('scroll', () => { $('#ph-n').textContent = Math.round(ph.scrollLeft / ph.clientWidth) + 1; }, { passive: true });
    const like = $('#like'); if (like) like.onclick = () => toggleLike(p.id, like);
    const sh = $('#share'); if (sh) sh.onclick = () => { navigator.clipboard?.writeText(location.href).catch(()=>{}); toast('링크를 복사했습니다. 카카오톡으로 보내 보세요'); };
    $('#more').onclick = () => moreSheet({ type: 'post', id: p.id, uid: p.uid });
    const ap = $('#appeal'); if (ap) ap.onclick = () => NP.sheet(`<h3 class="sheet-title">내 글이 가려졌습니다</h3><p class="sheet-sub">사유: ${(p.reasons||[]).map(esc).join(', ')}<br>검토 기한: 접수 후 3일. 이의가 있으면 아래 버튼으로 운영진에게 알려 주세요. 검토 결과는 알림으로 보내 드립니다.</p><div class="sheet-actions col"><button class="btn btn-primary" data-close>이의제기 보내기 (데모)</button><button class="btn btn-ghost" data-close>닫기</button></div>`, { label: '이의제기' });
    $$('[data-tg]').forEach(b => b.onclick = () => { const el = $('#rp-' + b.dataset.tg); const open = el.style.display !== 'none'; el.style.display = open ? 'none' : ''; b.setAttribute('aria-expanded', !open); b.textContent = (open ? '답글 N개 보기' : '답글 N개 접기').replace('N', el.children.length); });
    $$('[data-reply]').forEach(b => b.onclick = () => { if (me().acc.key === 'guest') return needLogin('댓글'); replyTo = +b.dataset.reply; const c = cm.find(x => x.id === replyTo); $('#replying').hidden = false; $('#replying-to').textContent = user(c.uid).nick; $('#cmt-input').focus(); });
    $$('[data-cmore]').forEach(b => b.onclick = () => { const c = cm.find(x => x.id === +b.dataset.cmore); moreSheet({ type: 'comment', id: c.id, uid: c.uid }); });
    $$('[data-clike]').forEach(b => b.onclick = () => { b.classList.toggle('on'); const n = b.querySelector('b'); n.textContent = +n.textContent + (b.classList.contains('on') ? 1 : -1); if (b.classList.contains('on') && !reduce) NP.burst(b); });
    stagger($('#cmt-list'));
    NP.reveal();
    // 댓글 입력창
    const bar = $('.cmt-bar'); if (bar) bar.hidden = !(read.ok && !isReview);
  }
  function cmtHtml(c, author, parent){
    const u = user(c.uid);
    const text = c.deleted ? '삭제된 댓글입니다' : (parent && c.uid !== parent.uid ? `<span class="at">@${esc(user(parent.uid).nick)}</span> ` : '') + esc(c.body);
    return `<div class="cmt" data-cid="${c.id}">${avatar(u, 36)}<div class="cmt-body"><div class="cmt-head"><span class="nick">${esc(u.nick)}</span>${c.uid === p.uid ? '<span class="op">글쓴이</span>' : ''}${c.best ? '<span class="op" style="background:var(--accent-0);color:#9a4a00">채택</span>' : ''}<span>${ago(c.at)}</span>${c.deleted ? '' : `<button class="more" data-cmore="${c.id}" aria-label="댓글 더보기"><svg viewBox="0 0 24 24" width="20" height="20"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button>`}</div>
      <p class="cmt-text ${c.deleted?'deleted':''}">${text}</p>
      ${c.deleted ? '' : `<div class="cmt-acts"><button data-clike="${c.id}"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><b>${c.likes || Math.max(0, (c.id * 7) % 11 - 2)}</b></button><button data-reply="${parent ? parent.id : c.id}"><svg viewBox="0 0 24 24"><path d="M9 14l-5-5 5-5M4 9h9a6 6 0 0 1 6 6v4"/></svg>답글</button></div>`}
    </div></div>`;
  }
  // 댓글 바
  document.body.insertAdjacentHTML('beforeend', `<div class="cmt-bar" id="cmt-bar"><div class="replying" id="replying" hidden><svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 14l-5-5 5-5M4 9h9a6 6 0 0 1 6 6v4"/></svg><span><b id="replying-to"></b> 님에게 답글</span><button id="cancel-reply">취소</button></div><form class="cmt-form" id="cmt-form"><label class="sr" for="cmt-input">댓글</label><textarea id="cmt-input" rows="1" placeholder="댓글을 남겨 주세요" maxlength="1000"></textarea><button type="submit" id="cmt-send" aria-label="댓글 등록" disabled><svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2-6z"/></svg></button></form></div>`);
  $('#app').appendChild($('#cmt-bar'));
  const ta = $('#cmt-input'), send = $('#cmt-send');
  ta.addEventListener('input', () => { send.disabled = !ta.value.trim(); ta.style.height = 'auto'; ta.style.height = Math.min(140, ta.scrollHeight) + 'px'; });
  ta.addEventListener('focus', () => { if (me().acc.key === 'guest') { ta.blur(); needLogin('댓글'); } });
  $('#cancel-reply').onclick = () => { replyTo = null; $('#replying').hidden = true; };
  $('#cmt-form').onsubmit = (e) => {
    e.preventDefault(); const t = ta.value.trim(); if (!t) return;
    const g = NP.guardCheck(t); if (g.level === 'block') { toast(`등록할 수 없습니다: ${g.hits[0].cat}`, 'err'); return; }
    state.comments.push({ id: Date.now(), post: p.id, parent: replyTo || undefined, body: t, at: new Date().toISOString() }); save('comments', state.comments);
    ta.value = ''; ta.style.height = ''; send.disabled = true; replyTo = null; $('#replying').hidden = true;
    render(); toast('댓글을 남겼습니다'); setTimeout(() => $('#cmts')?.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' }), 50);
  };
  render();
  document.addEventListener('np:refresh', render);
})();
</script>
</body>
</html>
