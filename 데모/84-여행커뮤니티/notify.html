<!DOCTYPE html>
<html lang="ko" data-text="0">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>알림 — 놀판</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="assets/css/style.css">
<script>try{document.documentElement.dataset.text=JSON.parse(localStorage.getItem('nolpan.text'))??0}catch(e){}</script>
</head>
<body>
<main id="app" class="no-tab">
  <div class="sec" style="padding-top:12px;padding-bottom:6px"><div class="sec-h"><h2 style="font-size:1rem;color:var(--sub);font-weight:600" id="cnt"></h2><button class="more-link" id="all-read">모두 읽음</button></div></div>
  <div class="notice notice-info" style="margin:0 var(--gutter) 10px;font-size:.85rem"><strong>앱에서는 푸시 알림으로 옵니다</strong>댓글·답글이 달리면 휴대폰 알림으로 바로 알려 드립니다. 웹에서는 이 화면과 종 모양 숫자로 확인하세요.</div>
  <div id="list"></div>
</main>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
(function(){
  const { $, $$, esc, D, state, save, user, avatar, ago, post, mountShell, stagger, toast } = NP;
  mountShell({ back: 'index.html', title: '알림' });
  const isRead = (n) => n.read || state.read.includes(n.id);
  function render(){
    const list = D.notifications.slice().sort((a,b) => new Date(b.at) - new Date(a.at));
    const unread = list.filter(n => !isRead(n)).length;
    $('#cnt').textContent = unread ? `안 읽은 알림 ${unread}개` : '모두 읽었습니다';
    $('#list').innerHTML = list.map(n => { const u = n.uid ? user(n.uid) : null; const p = n.post ? post(n.post) : null; const c = n.cid ? D.comments.find(x => x.id === n.cid) : null;
      return `<a class="ntf ${isRead(n) ? '' : 'unread'} li" href="${p ? `post.html?id=${p.id}#cmts` : '#'}" data-n="${n.id}">${u ? avatar(u, 40) : '<span class="avatar" style="--av:var(--ink);width:40px;height:40px;font-size:16px">놀</span>'}<div class="txt">${u ? `<b>${esc(u.nick)}</b>` : ''}${esc(n.text)}${p ? `<span class="q">${esc(c ? c.body : p.title)}</span>` : ''}<small>${ago(n.at)}${p ? ` · ${esc(p.title.slice(0, 18))}…` : ''}</small></div></a>`; }).join('');
    stagger($('#list'));
    $$('[data-n]').forEach(a => a.addEventListener('click', () => { if (!state.read.includes(a.dataset.n)) { state.read.push(a.dataset.n); save('read', state.read); } }));
  }
  $('#all-read').onclick = () => { state.read = D.notifications.map(n => n.id); save('read', state.read); render(); toast('모두 읽음으로 표시했습니다'); $('.hdr .dot')?.remove(); };
  render();
})();
</script>
</body>
</html>
