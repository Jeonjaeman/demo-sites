<!DOCTYPE html>
<html lang="ko" data-text="0">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>글쓰기 — 놀판</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="assets/css/style.css">
<script>try{document.documentElement.dataset.text=JSON.parse(localStorage.getItem('nolpan.text'))??0}catch(e){}</script>
</head>
<body>
<main id="app" class="no-tab has-writebar">
  <form id="wf" class="sec" novalidate style="padding-top:12px">
    <div class="field">
      <span class="lbl">어디에 올릴까요?</span>
      <button type="button" class="input" id="board-pick" style="text-align:left;display:flex;align-items:center;gap:8px"><span id="board-label" style="flex:1">게시판을 골라 주세요</span><svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 9l6 6 6-6"/></svg></button>
    </div>

    <div class="field">
      <span class="lbl">사진 <small style="font-weight:500;color:var(--sub)">(<span id="ph-left">10</span>장 더 넣을 수 있어요)</small></span>
      <div class="photo-grid" id="ph-grid"></div>
      <div class="sample-btns" style="margin-top:8px"><button type="button" id="ph-sample">샘플 사진 3장 넣기</button><button type="button" id="ph-clear">모두 지우기</button></div>
      <p class="hint" id="ph-hint">사진을 고르면 이 기기에서 바로 긴 변 1600px로 줄이고 위치정보(EXIF)를 지운 뒤 올립니다. 아이폰 HEIC 사진은 자동 변환 안내가 뜹니다.</p>
    </div>

    <div class="field">
      <label for="title">제목</label>
      <input class="input" id="title" maxlength="60" placeholder="예: 한시장 근처 쌀국수집, 아침 7시에 가면 줄 없어요">
      <span class="hint"><span id="title-n">0</span>/60</span>
    </div>

    <div class="field">
      <label for="bodyt">본문</label>
      <textarea class="textarea" id="bodyt" placeholder="어디서, 무엇을, 얼마에, 어떻게 가는지 적어 주시면 다른 분께 큰 도움이 됩니다."></textarea>
      <div id="guard" class="guard guard-ok"><strong>작성 가드</strong>입력하는 즉시 검사합니다. 아직 걸린 표현이 없습니다.</div>
      <div class="sample-btns"><button type="button" data-sample="ok">예시로 보기 · 정상 글</button><button type="button" data-sample="warn">예시 · 경고가 뜨는 글</button><button type="button" data-sample="block">예시 · 등록이 막히는 글</button></div>
    </div>

    <div class="field">
      <label class="check"><input type="checkbox" id="sponsored"><span>업체에서 대가를 받았어요<small>무료 숙박·할인·원고료 등. 체크하면 글에 「광고·협찬」 표시가 붙습니다 (공정위 추천·보증 심사지침)</small></span></label>
    </div>
    <div id="warn-ack" class="field" hidden>
      <label class="check"><input type="checkbox" id="ack"><span>게시판 규칙을 확인했고, 도박·대출·연락처 수집 목적이 아닙니다<small>경고 등급 표현이 있을 때만 묻습니다</small></span></label>
    </div>

    <div class="notice notice-soft" style="font-size:.85rem">누구나 볼 수 있는 글입니다. 카지노 사이트·가입코드·환전, 대출 호객, 유흥 알선, 전화번호·텔레그램 수집 글은 등록되지 않고, 올라와도 삭제·이용 정지됩니다. <a href="domestic.html?region=jeongseon&rules=1" data-allow>게시판 규칙</a></div>
  </form>
</main>
<div class="write-bar"><button class="btn btn-ghost" id="draft">임시저장</button><button class="btn btn-primary" id="submit" disabled>등록</button></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
(function(){
  const { $, $$, esc, D, q, state, save, img, guardCheck, highlight, mountShell, toast, sheet, closeSheet, processImage, kb, me, needLogin } = NP;
  mountShell({ back: 'index.html', title: '글쓰기' });
  $('#app').appendChild($('.write-bar'));
  if (me().acc.key === 'guest') { needLogin('글쓰기'); }

  let sel = { board: q.get('board') || '', region: q.get('region') || '', cat: q.get('cat') || '' };
  let photos = []; // {src, before, after, w, h, exif:true}
  const MAX = 10;
  const draft = NP.load('draft', null);

  function boardLabel(){
    if (!sel.board) return '';
    const B = D.boards[sel.board]; const r = B.regions.find(x => x.key === sel.region); const c = B.cats.find(x => x.key === sel.cat);
    return [B.name, r && r.name, c && c.name].filter(Boolean).join(' › ');
  }
  function pickBoard(){
    const w = sheet(`<h3 class="sheet-title">어디에 올릴까요?</h3><p class="sheet-sub">게시판 → 여행지 → 분류 순서로 고르세요. 카지노가 있는 지역은 규칙이 더 엄격합니다.</p><div id="pk"></div>`, { label: '게시판 선택' });
    let b = sel.board, r = sel.region;
    const draw = () => {
      const B = b && D.boards[b];
      $('#pk', w).innerHTML = `<div class="chips" style="padding-left:0;padding-right:0">${Object.values(D.boards).map(x => `<button type="button" class="chip" data-b="${x.key}" aria-pressed="${x.key===b}">${x.name}</button>`).join('')}</div>
        ${B && B.regions.length ? `<p class="lbl" style="font-size:.85rem;margin:6px 0">여행지</p><div class="chips" style="padding-left:0;padding-right:0">${B.regions.map(x => `<button type="button" class="chip" data-r="${x.key}" aria-pressed="${x.key===r}">${x.name}${x.casino?' ·규칙':''}</button>`).join('')}</div>` : ''}
        ${B ? `<p class="lbl" style="font-size:.85rem;margin:6px 0">분류</p><div class="chips" style="padding-left:0;padding-right:0">${B.cats.map(x => `<button type="button" class="chip" data-c="${x.key}">${x.name}</button>`).join('')}</div>` : ''}`;
      $$('[data-b]', w).forEach(x => x.onclick = () => { b = x.dataset.b; r = D.boards[b].regions[0]?.key || ''; draw(); });
      $$('[data-r]', w).forEach(x => x.onclick = () => { r = x.dataset.r; draw(); });
      $$('[data-c]', w).forEach(x => x.onclick = () => { sel = { board: b, region: r, cat: x.dataset.c }; $('#board-label').textContent = boardLabel(); closeSheet(); validate(); });
    };
    draw();
  }
  $('#board-pick').onclick = pickBoard;
  if (sel.board) { if (!sel.cat) sel.cat = ''; $('#board-label').textContent = boardLabel() || '게시판을 골라 주세요'; }

  /* 사진 */
  function drawPhotos(){
    const g = $('#ph-grid');
    g.innerHTML = photos.map((p, i) => `<div class="ph"><img src="${p.src}" alt="첨부 사진 ${i+1}">${i===0?'<span class="rep">대표</span>':''}<button type="button" class="del" data-del="${i}" aria-label="사진 ${i+1} 삭제"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button><span class="exif">${p.heic ? 'HEIC 변환' : '위치정보 지움'} · ${kb(p.before)}→${kb(p.after)}</span></div>`).join('')
      + (photos.length < MAX ? `<label class="ph add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>사진 추가<input type="file" id="ph-in" accept="image/*" multiple></label>` : '');
    $('#ph-left').textContent = MAX - photos.length;
    $$('[data-del]').forEach(b => b.onclick = () => { photos.splice(+b.dataset.del, 1); drawPhotos(); });
    const inp = $('#ph-in'); if (inp) inp.onchange = async (e) => {
      const files = Array.from(e.target.files).slice(0, MAX - photos.length);
      for (const f of files) {
        try { const r = await processImage(f); photos.push({ src: r.dataUrl, before: r.before, after: r.after, heic: r.heic }); }
        catch (err) { toast(err.message === 'heic' ? '아이폰 HEIC 사진은 실제 서비스에서 서버가 JPG로 변환합니다 (데모는 안내만)' : '읽을 수 없는 파일입니다'); }
      }
      drawPhotos(); toast(`${files.length}장을 줄여서 넣었습니다 — 위치정보는 지워졌습니다`);
    };
  }
  $('#ph-sample').onclick = async () => {
    const keys = ['danang-pho', 'hoian-lanterns', 'poolvilla'];
    for (const k of keys) { if (photos.length >= MAX) break; const blob = await (await fetch(img(k))).blob(); const file = new File([blob], k + '.jpg', { type: 'image/jpeg' }); const r = await processImage(file); photos.push({ src: r.dataUrl, before: Math.round(r.before * 9.3), after: r.after }); }
    drawPhotos(); toast('샘플 사진 3장을 넣었습니다 (원본 용량은 4~5MB로 가정)');
  };
  $('#ph-clear').onclick = () => { photos = []; drawPhotos(); };
  drawPhotos();

  /* 가드·검증 */
  const title = $('#title'), body = $('#bodyt'), guard = $('#guard'), submit = $('#submit'), ack = $('#ack'), ackWrap = $('#warn-ack');
  const SAMPLES = {
    ok: { t: '고한역 앞 곤드레밥집, 셔틀 기다리며 먹기 좋아요', b: '고한역 광장 바로 왼쪽 골목입니다. 곤드레밥 9천 원, 반찬 여섯 가지. 셔틀 출발 20분 전에 들어가면 여유 있게 먹고 나옵니다.\n\n주차는 역 앞 공영주차장 30분 무료.' },
    warn: { t: '하이원 갔다 온 후기 — 이번엔 운이 좋았네요', b: '곤돌라 타고 정상 다녀오고 저녁엔 슬롯 조금 했는데 잭팟은 아니어도 재미있었어요. 베팅은 소액으로만. 궁금한 분은 010-1234-5678로 연락 주세요.' },
    block: { t: '하이원 안 가도 집에서 즐기는 법 알려드려요', b: '현장 안 가도 됩니다. 온라인카지노 첫 충전 보너스 30%, 가입코드 NOL77 넣으면 추가 지급. 문의는 텔레그램 @nolpan77 또는 https://bit.ly/xxxx' },
  };
  $$('[data-sample]').forEach(b => b.onclick = () => { const s = SAMPLES[b.dataset.sample]; title.value = s.t; body.value = s.b; if (!sel.board) { sel = { board: 'domestic', region: 'jeongseon', cat: 'food' }; $('#board-label').textContent = boardLabel(); } validate(); body.focus(); });
  let lastLevel = 'ok';
  function validate(){
    const text = title.value + '\n' + body.value;
    const g = guardCheck(text);
    lastLevel = g.level;
    const cats = [...new Set(g.hits.map(h => h.cat))];
    if (g.level === 'ok') { guard.className = 'guard guard-ok'; guard.innerHTML = '<strong>작성 가드</strong>입력하는 즉시 검사합니다. 아직 걸린 표현이 없습니다.'; }
    else if (g.level === 'warn') { guard.className = 'guard guard-warn'; guard.innerHTML = `<strong>확인이 필요한 표현이 있습니다 — ${cats.map(esc).join(' · ')}</strong><div class="preview-body" style="background:#fff">${highlight(body.value, g.hits)}</div><ul>${g.hits.map(h => `<li>「${esc(h.word)}」 ${esc(h.cat)}${h.cat==='연락처 노출' ? ' — 본문에 전화번호·메신저 ID를 적으면 수집 목적으로 오인될 수 있습니다' : ' — 여행 정보로 보이도록 표현을 바꿔 주세요'}</li>`).join('')}</ul>규칙을 확인했다고 체크하면 등록됩니다. 운영진이 한 번 더 봅니다.`; }
    else { guard.className = 'guard guard-block'; guard.innerHTML = `<strong>등록할 수 없는 내용입니다 — ${cats.map(esc).join(' · ')}</strong><div class="preview-body" style="background:#fff;color:var(--ink)">${highlight(body.value, g.hits)}</div><ul>${g.hits.filter(h=>h.level==='block').map(h => `<li>「${esc(h.word)}」 ${esc(h.cat)}</li>`).join('')}</ul>표시된 표현을 지우면 등록 버튼이 켜집니다. 반복되면 이용이 정지됩니다.`; }
    ackWrap.hidden = g.level !== 'warn';
    const ready = sel.board && sel.cat && title.value.trim().length >= 2 && body.value.trim().length >= 10 && g.level !== 'block' && (g.level !== 'warn' || ack.checked);
    submit.disabled = !ready;
    submit.textContent = g.level === 'block' ? '등록 불가' : !sel.cat ? '게시판 선택' : title.value.trim().length < 2 ? '제목 입력' : body.value.trim().length < 10 ? `본문 ${10 - body.value.trim().length}자 더` : (g.level === 'warn' && !ack.checked) ? '규칙 확인 필요' : '등록';
    $('#title-n').textContent = title.value.length;
  }
  title.addEventListener('input', validate); body.addEventListener('input', validate); ack.addEventListener('change', validate);
  if (draft && !q.get('board')) { title.value = draft.title || ''; body.value = draft.body || ''; sel = draft.sel || sel; $('#board-label').textContent = boardLabel() || '게시판을 골라 주세요'; toast('임시저장한 글을 불러왔습니다'); }
  validate();
  $('#draft').onclick = () => { save('draft', { title: title.value, body: body.value, sel }); toast('임시저장했습니다. 다음에 글쓰기를 열면 이어 씁니다'); };
  $('#submit').onclick = () => {
    if (submit.disabled) return;
    const id = Date.now();
    state.posts.unshift({ id, board: sel.board, region: sel.region, cat: sel.cat, title: title.value.trim(), body: body.value.trim(), photos: photos.map(p => p.src), likes: 0, views: 1, at: new Date().toISOString(), sponsored: $('#sponsored').checked || me().acc.key === 'biz' && $('#sponsored').checked, flaggedWarn: lastLevel === 'warn' });
    save('posts', state.posts); localStorage.removeItem('nolpan.draft');
    toast(lastLevel === 'warn' ? '등록했습니다. 경고 표현이 있어 운영진이 확인합니다' : '등록했습니다');
    setTimeout(() => location.href = `post.html?id=${id}`, 500);
  };
})();
</script>
</body>
</html>
