<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATTEST — 고객사 포털 (데모)</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .detail { margin-top: 16px; }
  .qr-box { display: grid; grid-template-columns: 300px 1fr; gap: 20px; align-items: start; }
  .qr-canvas { background: #fff; border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; place-items: center; }
  .qr-canvas canvas { width: 256px !important; height: 256px !important; }
  .sim { margin-top: 12px; }
  .sim input[type=range] { width: 100%; accent-color: var(--primary); }
  .sim .vals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
  .sim .vals div { padding: 10px 12px; border-radius: var(--r); background: var(--surface); font-size: 13px; }
  .sim .vals b { display: block; font-size: 16px; font-variant-numeric: tabular-nums; }
  .sim-preview { display: flex; align-items: flex-end; gap: 14px; margin-top: 12px; }
  .sim-preview .real { border: 1px dashed var(--line2); background: #fff; display: grid; place-items: center; }
  .sim-preview canvas { image-rendering: pixelated; }
  .dday { display: flex; align-items: center; gap: 18px; padding: 18px 20px; border-radius: var(--r); background: var(--primary-tint); }
  .dday .num { font-family: var(--mono); font-size: 40px; font-weight: 600; line-height: 1; color: var(--primary); }
  .dday.hot { background: var(--bad-tint); } .dday.hot .num { color: var(--bad); }
  .twocol { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .twocol ul { list-style: none; }
  .twocol li { padding: 8px 10px; border-radius: var(--r); font-size: 13.5px; margin-bottom: 6px; display: flex; gap: 8px; }
  .twocol .ok li { background: var(--primary-tint); color: var(--primary-deep); }
  .twocol .bad li { background: var(--bad-tint); color: var(--bad); }
  .examples { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 12px; }
  .lockbox { padding: 12px 14px; border-radius: var(--r); background: var(--surface); font-size: 13.5px; color: var(--muted); display: flex; gap: 10px; align-items: center; }
  canvas.cv { width: 100%; height: 180px; display: block; }
  @media (max-width: 860px) { .qr-box, .twocol { grid-template-columns: 1fr; } .sim .vals { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><div class="mk">A</div><div><b>ATTEST</b><small>Client Portal · Demo</small></div></div>
    <nav class="snav" id="snav">
      <div class="grp">보고서</div>
      <button data-s="reports" class="on">내 보고서 <span class="n" id="n-rep"></span></button>
      <button data-s="qr">QR 다운로드</button>
      <div class="grp">규제 대응</div>
      <button data-s="evidence">실증자료 · D-15</button>
      <button data-s="claim">표시 문구 검사기</button>
      <div class="grp">데이터</div>
      <button data-s="stats">스캔 통계 (자사분)</button>
    </nav>
    <div class="side-foot"><div class="who"><div class="av" id="av">RA</div><div><b id="who-name"></b><br><span id="who-role" class="muted"></span></div></div>
      <div style="margin-top:10px;"><a href="index.html">← 진입 화면</a> · <a href="admin.html">기관 관리자</a></div></div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div><h1 id="t-title">내 보고서</h1><div class="sub" id="t-sub"></div></div>
      <div class="row">
        <span class="small muted">역할 전환</span>
        <select class="sel" id="role-sel"><option value="ADMIN">이수정 · 관리자</option><option value="RA">김하은 · RA (품질)</option><option value="MKT">박지훈 · 마케터</option></select>
      </div>
    </header>
    <div class="content">
      <div class="demo-bar"><span><b>루미네 코스메틱</b> 계정 — 자사에 발급된 보고서만 보입니다 · 원문 PDF는 <b>RA·관리자</b>만, 마케터는 QR·요약만 (역할 전환으로 확인)</span><span class="micro">모든 데이터 가상</span></div>
      <section class="sect on" id="s-reports"></section>
      <section class="sect" id="s-qr"></section>
      <section class="sect" id="s-evidence"></section>
      <section class="sect" id="s-claim"></section>
      <section class="sect" id="s-stats"></section>
    </div>
  </main>
</div>
<div class="ov" id="modal"><div class="modal" id="modal-box"></div></div>
<div id="toast" role="status"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/qr.js"></script>
<script src="assets/js/rules.js"></script>
<script src="assets/js/zip.js"></script>
<script>
'use strict';
const D = Store.load();
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const ORG = orgOf(D, 'o1');
let role = (new URLSearchParams(location.search).get('role') || 'RA').toUpperCase();
if (!['ADMIN', 'RA', 'MKT'].includes(role)) role = 'RA';
let cur = 'r1', sect = 'reports', bots = false;
const USERS = { ADMIN: ORG.users[0], RA: ORG.users[1], MKT: ORG.users[2] };
const canOriginal = () => role === 'RA' || role === 'ADMIN';
const I = {
  check: '<svg class="i" viewBox="0 0 16 16"><path d="M3 8.5l3 3 7-7"/></svg>', x: '<svg class="i" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg>',
  lock: '<svg class="i" viewBox="0 0 16 16"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 015 0v2"/></svg>',
  dl: '<svg class="i" viewBox="0 0 16 16"><path d="M8 2v8M4.5 7.5L8 11l3.5-3.5M3 13h10"/></svg>',
  search: '<svg class="i" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>',
};
let toastTimer;
function toast(m) { const el = $('#toast'); el.textContent = m; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2800); }
function modal(html) { $('#modal-box').innerHTML = html; $('#modal').classList.add('show'); }
function closeModal() { $('#modal').classList.remove('show'); }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
function audit(action, target) { D.auditLogs.unshift({ at: nowStr(), who: `${USERS[role].name} (${ORG.name} ${role})`, action, target, where: '서울' }); Store.save(); }
const myReports = () => D.reports.filter(r => r.orgId === ORG.id);
const myTokens = () => D.qrs.filter(q => myReports().some(r => r.id === q.reportId)).map(q => q.token);

const TITLES = { reports: ['내 보고서', '보고서 번호로 검색 · 상세에서 공개 동의·원문·버전 확인'], qr: ['QR 다운로드', '인쇄 패키지(SVG·PNG·사양서) · 인쇄 크기 시뮬레이터'], evidence: ['실증자료 · D-15', '식약처 실증자료 요청 대응 — 15일 이내 제출 (화장품법 §14)'], claim: ['표시 문구 검사기', 'QR 옆에 인쇄될 문구를 §13·관리지침 규칙으로 검사'], stats: ['스캔 통계', '자사 QR만 · 봇 제외 실계산'] };
const RENDER = { reports: rReports, qr: rQR, evidence: rEvidence, claim: rClaim, stats: rStats };
$$('#snav button').forEach(b => b.addEventListener('click', () => go(b.dataset.s)));
function go(s) {
  sect = s; $$('#snav button').forEach(x => x.classList.toggle('on', x.dataset.s === s)); $$('.sect').forEach(x => x.classList.toggle('on', x.id === 's-' + s));
  $('#t-title').textContent = TITLES[s][0]; $('#t-sub').textContent = TITLES[s][1]; RENDER[s]();
}
$('#role-sel').value = role;
$('#role-sel').addEventListener('change', e => { role = e.target.value; history.replaceState(null, '', 'client.html?role=' + role); who(); RENDER[sect](); toast(role === 'MKT' ? '마케터 전환 — 원문 다운로드 버튼이 사라집니다' : '원문 PDF 다운로드 가능 역할'); });
function who() { $('#who-name').textContent = USERS[role].name; $('#who-role').textContent = ORG.name + ' · ' + ({ ADMIN: '관리자', RA: '품질(RA)', MKT: '마케터' })[role]; $('#av').textContent = role; }

/* ═══ 내 보고서 ═══ */
function rReports() {
  const list = myReports();
  $('#n-rep').textContent = list.length;
  const q = ($('#rep-q') || {}).value || 'SP-2026-0417';
  $('#s-reports').innerHTML = `
    <div class="card">
      <div class="toolbar">
        <div class="tb-search">${I.search}<input id="rep-q" value="${esc(q)}" placeholder="보고서 번호 · 제품명"></div>
        <button class="btn sec sm" id="rep-ex1">예시로 조회 · SP-2026-0417</button>
        <button class="btn sec sm" id="rep-ex2">SP-2026-0402 (동의 대기)</button>
        <span class="sp"></span><span class="small muted">${list.length}건 · 자사 발급분만</span>
      </div>
      <div class="tbl-wrap"><table class="tbl click"><thead><tr><th>보고서 번호</th><th>제품</th><th>시험</th><th>상태</th><th>QR</th><th>최종 발급</th></tr></thead><tbody>
        ${list.filter(r => !q || r.no.toLowerCase().includes(q.toLowerCase()) || r.product.includes(q)).map(r => {
          const qs = D.qrs.filter(x => x.reportId === r.id); const v = latestVersion(r);
          return `<tr data-id="${r.id}" class="${cur === r.id ? 'sel' : ''}"><td class="mono">${esc(r.no)}</td><td>${esc(r.product)}</td><td>${esc(typeOf(D, r.type).ko)}</td><td><span class="chip ${r.status}">${esc(statusLabel(r.status))}</span></td><td>${qs.length ? qs.length + '건' : '<span class="muted">—</span>'}</td><td>${esc(v.date)} · v${v.v}</td></tr>`;
        }).join('')}
      </tbody></table></div>
    </div>
    <div class="detail" id="rep-detail"></div>`;
  $('#rep-q').addEventListener('input', () => { const v = $('#rep-q').value; rReports(); $('#rep-q').value = v; $('#rep-q').focus(); $('#rep-q').setSelectionRange(v.length, v.length); });
  $('#rep-ex1').addEventListener('click', () => { cur = 'r1'; $('#rep-q').value = 'SP-2026-0417'; rReports(); });
  $('#rep-ex2').addEventListener('click', () => { cur = 'r3'; $('#rep-q').value = 'SP-2026-0402'; rReports(); });
  $$('#s-reports tbody tr').forEach(tr => tr.addEventListener('click', () => { cur = tr.dataset.id; rReports(); }));
  rDetail();
}
function flowHTML(r) {
  const steps = ['registered', 'viewed', 'consented', 'active'];
  const idx = r.status === 'revised' ? 3 : steps.indexOf(r.status);
  const term = ['expired', 'suspended', 'revoked'].includes(r.status);
  return `<div class="flow">${steps.map((s, i) => `<div class="st ${term ? 'done' : i < idx ? 'done' : i === idx ? 'cur' : ''}"><i></i>${statusLabel(s)}</div>${i < 3 ? '<div class="ln"></div>' : ''}`).join('')}${term ? `<div class="ln"></div><div class="st bad"><i></i>${statusLabel(r.status)}</div>` : ''}</div>`;
}
function rDetail() {
  const r = reportOf(D, cur); if (!r || r.orgId !== ORG.id) { $('#rep-detail').innerHTML = ''; return; }
  const v = latestVersion(r), tt = typeOf(D, r.type), qs = D.qrs.filter(x => x.reportId === r.id);
  const ct = claimTable(r, tt.ko);
  $('#rep-detail').innerHTML = `
    <div class="card">
      <div class="card-h"><div><span class="label">${esc(r.no)}</span><h2 style="margin-top:4px;">${esc(r.product)}</h2></div><span class="chip ${r.status}">${esc(statusLabel(r.status))}</span></div>
      ${flowHTML(r)}
      <div class="grid g2" style="margin-top:16px;">
        <div>
          <div class="label" style="margin-bottom:6px;">시험 정보</div>
          <table class="tbl"><tbody>
            <tr><td class="muted" style="width:120px">시험 종류</td><td>${esc(tt.ko)}</td></tr>
            <tr><td class="muted">기간 · 피험자</td><td>${esc(r.period.start)} ~ ${esc(r.period.end)} · ${r.subjects}명</td></tr>
            <tr><td class="muted">시험책임자</td><td>${esc(r.supervisor.name)} (경력 ${r.supervisor.years}년) · IRB ${esc(r.irb)}</td></tr>
            <tr><td class="muted">판정</td><td>${esc(r.verdict.ko)}</td></tr>
            <tr><td class="muted">유해사례</td><td>${esc(r.adverseNote || '기재 없음')}</td></tr>
          </tbody></table>
          <div class="label" style="margin:16px 0 8px;">공개 동의 (B-5)</div>
          ${r.consent ? `<div class="note ok">${I.check} <b>${esc(r.consent.by)}</b> · ${esc(r.consent.at)} · 범위: ${esc(r.consent.scope)} — 이 동의 후에만 기관이 QR을 발급할 수 있습니다</div>`
            : `<div class="note warn"><b>공개 동의 대기</b> — 기관은 귀사가 동의하기 전까지 QR을 발급할 수 없습니다. ${canOriginal() ? '' : '(동의 권한: RA·관리자)'}</div>
               ${canOriginal() ? `<div class="row" style="margin-top:10px;"><select class="sel" id="c-scope" style="height:36px;"><option>요약 공개</option><option>요약 + 결과 그래프</option></select><button class="btn sm" id="c-agree">공개에 동의합니다</button></div>` : ''}`}
        </div>
        <div>
          <div class="label" style="margin-bottom:6px;">원문 · 버전 · 무결성</div>
          ${canOriginal() ? `<button class="btn" id="dl-orig">${I.dl} 원문 PDF 다운로드 · ${esc(r.files.original.name)} (${r.files.original.size}MB)</button><div class="micro muted" style="margin-top:6px;">다운로드는 감사로그에 기록됩니다 (누가·언제·어디서)</div>`
            : `<div class="lockbox">${I.lock} 원문 PDF는 RA·관리자 역할에서만 내려받을 수 있습니다 — 마케터 계정에는 요약과 QR만 제공됩니다 (C-5)</div>`}
          <div class="tl" style="margin-top:16px;">${r.versions.slice().reverse().map((vv, i) => `<div class="ev ${i === 0 ? 'cur' : ''}"><b>v${vv.v}</b> · ${esc(vv.date)} — ${esc(vv.reason)}<div class="meta">${esc(vv.by)}${i === 0 ? ' · 현재 게시본 — 인쇄된 QR이 이 버전을 가리킵니다' : ''}</div><div class="hash">SHA-256 ${esc(vv.hash)}</div></div>`).join('')}</div>
          <div class="label" style="margin:8px 0 6px;">연결된 QR ${qs.length}건</div>
          <div class="chips">${qs.map(q => `<span class="chip ${q.status} mono">${esc(q.token)} · ${esc(q.label)}</span>`).join('') || '<span class="muted small">발급 전</span>'}</div>
        </div>
      </div>
      <hr class="sep">
      <div class="label" style="margin-bottom:8px;">이 자료로 실증 가능한 표현 / 불가능한 표현 (B-1·B-3)</div>
      <div class="twocol"><ul class="ok">${ct.ok.map(x => `<li>${I.check}<span>${esc(x)}</span></li>`).join('')}</ul><ul class="bad">${ct.bad.map(x => `<li>${I.x}<span>${esc(x)}</span></li>`).join('')}</ul></div>
    </div>`;
  const ag = $('#c-agree'); if (ag) ag.addEventListener('click', () => {
    r.consent = { at: nowStr(), by: `${USERS[role].name} (${role})`, scope: $('#c-scope').value };
    if (['registered', 'viewed'].includes(r.status)) r.status = 'consented';
    audit('공개 동의', `${r.no} · ${r.consent.scope}`); Store.save();
    toast('공개 동의 기록 — 기관 관리자 화면에서 QR 발급이 가능해집니다'); rReports();
  });
  const dl = $('#dl-orig'); if (dl) dl.addEventListener('click', () => {
    const pdf = miniPdf([`Report No: ${r.no}   Version: v${v.v}   Issued: ${v.date}`, `Client: ${ORG.en}   Product: ${r.product.replace(/[^\x20-\x7E]/g, '?')}`, `Test: ${tt.en}   Subjects: ${r.subjects}   Period: ${r.period.start} ~ ${r.period.end}`, `SHA-256: ${v.hash}`, '', 'DEMO FILE - fictional data. Original report body omitted.', `Downloaded by ${USERS[role].name} (${role}) at ${nowStr()} - logged in audit trail.`], 'ATTEST - Human Application Test Report (DEMO)');
    downloadBlob(new Blob([pdf], { type: 'application/pdf' }), r.files.original.name);
    audit('원문 PDF 다운로드', `${r.no} v${v.v}`);
    toast('원문 PDF 다운로드 — 감사로그에 기록되었습니다');
  });
}

/* ═══ QR 다운로드 ═══ */
let qrSel = '7K9F2Q', simMm = 20;
function rQR() {
  const qs = D.qrs.filter(q => myTokens().includes(q.token) && q.status === 'active');
  if (!qs.some(q => q.token === qrSel)) qrSel = qs[0] ? qs[0].token : null;
  const q = qrOf(D, qrSel), r = q ? reportOf(D, q.reportId) : null;
  const url = PUBLIC_BASE + (q ? q.token : '');
  const enc = q ? QR.encode(url, 'M') : null;
  const staticUrl = 'https://drive.google.com/file/d/1xQm9Kz_aBcDeFgHiJkLmNoPqRsTuVwXyZ01234/view?usp=sharing';
  const encStatic = QR.encode(staticUrl, 'M');
  $('#s-qr').innerHTML = `
    <div class="card">
      <div class="toolbar"><span class="small muted">활성 QR</span><select class="sel" id="qr-pick">${qs.map(x => `<option value="${x.token}" ${x.token === qrSel ? 'selected' : ''}>${esc(reportOf(D, x.reportId).no)} · ${esc(x.label)} (${x.lang.toUpperCase()})</option>`).join('')}</select>
        <button class="btn sec sm" id="qr-new">+ 추가 QR 발급 (SKU·언어별)</button>
        <span class="sp"></span>${q ? `<span class="chip mono">${esc(q.token)}</span><span class="chip">v${enc.version} · ${enc.size}×${enc.size} 모듈 · EC-M</span>` : ''}</div>
      ${q ? `
      <div class="qr-box">
        <div>
          <div class="qr-canvas"><canvas id="qr-cv"></canvas></div>
          <div class="micro muted" style="margin-top:8px;word-break:break-all;">인코딩 URL <span class="mono">${esc(url)}</span> (${url.length}자) — 파일 주소가 아니라 <b>불변 토큰</b>. 보고서가 개정돼도 이 QR은 그대로 최신본을 가리킵니다 (A-1)</div>
          <div class="row" style="margin-top:12px;"><button class="btn" id="dl-pack">${I.dl} 인쇄 패키지 (ZIP)</button><button class="btn sec sm" id="dl-svg">SVG만</button><button class="btn sec sm" id="dl-png">PNG만</button></div>
          <div class="micro muted" style="margin-top:6px;">패키지: SVG(벡터) · PNG 1024px · 인쇄 사양서 · 승인 문구 카드 — 다운로드는 발급 이력에 기록</div>
        </div>
        <div>
          <div class="label">인쇄 크기 시뮬레이터 (C-3) — 실계산</div>
          <div class="sim">
            <input type="range" id="sim" min="10" max="40" step="1" value="${simMm}">
            <div class="vals" id="sim-vals"></div>
            <div class="sim-preview"><div class="real" id="sim-real"><canvas id="sim-cv"></canvas></div><div class="small muted">← 화면 96dpi 기준 실제 크기 근사 (<span id="sim-mm"></span>mm)<br>모듈 크기 = 인쇄 폭 ÷ (모듈 수 + quiet zone 8)<br>임계: 모듈 ≥ 0.12mm · 코드 ≥ 15mm · 권장 20mm↑</div></div>
            <div id="sim-warn" style="margin-top:10px;"></div>
          </div>
          <hr class="sep">
          <div class="label" style="margin-bottom:8px;">정적 QR(구글 드라이브 링크)과 비교</div>
          <table class="tbl"><thead><tr><th></th><th>동적 (이 QR)</th><th>정적 (파일 URL)</th></tr></thead><tbody>
            <tr><td class="muted">문자 수</td><td class="num">${url.length}</td><td class="num">${staticUrl.length}</td></tr>

  const toks = myTokens();
  const raw = scanStats(D.scans, { tokens: toks, excludeBots: false }), val = scanStats(D.scans, { tokens: toks, excludeBots: true });
  const s = bots ? val : raw;
  $('#s-stats').innerHTML = `
    <div class="grid g4" style="margin-bottom:16px;">
      <div class="kpi"><div class="k">30일 스캔 (${bots ? '유효' : '원시'})</div><div class="v">${s.total.toLocaleString()}<small>회</small></div><div class="d">봇 추정 ${raw.bots}회 · 유효 ${val.total}회</div></div>
      <div class="kpi"><div class="k">모바일 비율</div><div class="v">${Math.round((s.byDevice.mobile || 0) / (s.total || 1) * 100)}<small>%</small></div><div class="d">PC ${s.byDevice.pc || 0} · 봇 ${s.byDevice.bot || 0}</div></div>
      <div class="kpi"><div class="k">활성 QR</div><div class="v">${D.qrs.filter(q => toks.includes(q.token) && q.status === 'active').length}<small>건</small></div><div class="d">자사 QR ${toks.length}건</div></div>
      <div class="kpi"><div class="k">영문 화면 비율</div><div class="v">${Math.round((s.byLang.en || 0) / (s.total || 1) * 100)}<small>%</small></div><div class="d">수출용 QR 포함</div></div>
    </div>
    <div class="card"><div class="card-h"><h3>일별 스캔 추이 (30일) — 자사 QR ${toks.length}건</h3><div class="row"><span class="small muted">봇 제외</span><span class="tgl ${bots ? 'on' : ''}" id="st-bot"></span></div></div>
      <canvas class="cv" id="st-cv"></canvas>
      <div class="micro muted" style="margin-top:8px;">봇 판정: 메신저 링크 프리뷰 · 검색엔진 크롤러 · 보안 스캐너 · 동일 IP 연속 — 토글하면 그래프가 실제로 재계산됩니다 (C-4) · 수집 항목: ${esc(D.settings.scanIpPolicy)}</div></div>`;
  $('#st-bot').addEventListener('click', () => { bots = !bots; rStats(); });
  drawDaily($('#st-cv'), s.byDay);
}
function drawDaily(cv, byDay) {
  const paint = () => {
    const dpr = devicePixelRatio || 1, w = cv.clientWidth || 600, h = cv.clientHeight || 180;
    cv.width = w * dpr; cv.height = h * dpr; const c = cv.getContext('2d'); c.scale(dpr, dpr);
    const days = []; for (let i = 29; i >= 0; i--) days.push(addDays(TODAY, -i));
    const vals = days.map(d => byDay[d] || 0), max = Math.max(...vals, 1);
    const bw = (w - 30) / days.length;
    c.font = '11px Geist Mono, monospace'; c.fillStyle = '#9f9fa9'; c.textAlign = 'left';
    days.forEach((d, i) => { const x = 30 + i * bw, bh = (h - 28) * vals[i] / max; c.fillStyle = i === days.length - 1 ? '#005850' : '#d1ddd3'; c.fillRect(x + 2, h - 22 - bh, bw - 4, bh); if (i % 7 === 0) { c.fillStyle = '#9f9fa9'; c.fillText(d.slice(5), x, h - 6); } });
    c.fillStyle = '#71717b'; c.fillText(String(max), 0, 12);
  };
  // 레이아웃 확정 전 측정(backing 수십 px) 방지 — 크기가 잡힐 때마다 다시 그림
  if (cv._ro) cv._ro.disconnect();
  cv._ro = new ResizeObserver(() => { if (cv.clientWidth > 60) paint(); });
  cv._ro.observe(cv);
  if (cv.clientWidth > 60) paint();
}

/* 다른 탭 동기화 */
window.addEventListener('storage', e => { if (e.key !== ATTEST_KEY) return; Store._d = null; const nd = Store.load(); Object.keys(D).forEach(k => delete D[k]); Object.assign(D, nd); RENDER[sect](); });

who(); go('reports');
</script>
