<script>
'use strict';
const D = Store.load();
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
let sect = 'dash', cur = 'r1', bots = true, filt = { q: '', org: '', st: '' };
const I = {
  check: '<svg class="i" viewBox="0 0 16 16"><path d="M3 8.5l3 3 7-7"/></svg>', x: '<svg class="i" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg>',
  lock: '<svg class="i" viewBox="0 0 16 16"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 015 0v2"/></svg>',
  dl: '<svg class="i" viewBox="0 0 16 16"><path d="M8 2v8M4.5 7.5L8 11l3.5-3.5M3 13h10"/></svg>',
  search: '<svg class="i" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>',
  ext: '<svg class="i" viewBox="0 0 16 16"><path d="M6 3H3.5v9.5H13V10M9 3h4v4M13 3L7.5 8.5"/></svg>',
};
let toastTimer;
function toast(m) { const el = $('#toast'); el.textContent = m; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 3000); }
function modal(html) { $('#modal-box').innerHTML = html; $('#modal').classList.add('show'); }
function closeModal() { $('#modal').classList.remove('show'); }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
function audit(action, target) { D.auditLogs.unshift({ at: nowStr(), who: '한지연 (기관)', action, target, where: '서울' }); }
function newToken() { const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let t = ''; do { t = ''; for (let i = 0; i < 6; i++) t += A[Math.floor(Math.random() * A.length)]; } while (qrOf(D, t)); return t; }
const TITLES = { dash: ['대시보드', '실계산 KPI · 만료 임박 · 신고 접수'], reports: ['보고서', '상태 머신 · 실증 요건 게이트 · 공개 항목 · 버전'], register: ['보고서 등록', '실증 요건을 등록 단계에서 확인합니다 (B-2)'], qrs: ['QR 발급 · 이력', '불변 토큰 · 보고서 1:N · 상태 4종 · 정적 QR 비교'], orgs: ['고객사 · 사용자', '조직 - 브랜드 - 사용자 3계층 · 역할 3종 · 계약'], stats: ['스캔 통계', '봇 제외 실계산 · 수집 항목 최소화'], audit: ['감사로그', '누가 · 언제 · 무엇을 · 어디서 · CSV(UTF-8 BOM)'], infra: ['보안 · 인프라 현황', '공고 제안 필수 ⑤ — 호스팅 방식·월 비용·보안 정책을 화면으로'], handover: ['인수인계 현황', '공고 제안 필수 ④ — 문서가 아니라 화면으로 증명 (C-6)'] };
const RENDER = { dash: rDash, reports: rReports, register: rRegister, qrs: rQRs, orgs: rOrgs, stats: rStats, audit: rAudit, infra: rInfra, handover: rHandover };
$$('#snav button').forEach(b => b.addEventListener('click', () => go(b.dataset.s)));
function go(s) { sect = s; $$('#snav button').forEach(x => x.classList.toggle('on', x.dataset.s === s)); $$('.sect').forEach(x => x.classList.toggle('on', x.id === 's-' + s)); $('#t-title').textContent = TITLES[s][0]; $('#t-sub').textContent = TITLES[s][1]; RENDER[s](); counts(); }
function counts() { $('#n-rep').textContent = D.reports.length; $('#n-qr').textContent = D.qrs.length; }
$('#reset-demo').addEventListener('click', () => { Store.reset(); location.reload(); });

/* ═══ 대시보드 ═══ */
function rDash() {
  const evFail = D.reports.filter(r => !evidenceCheck(r).pass).length;
  const consentWait = D.reports.filter(r => !r.consent && ['registered', 'viewed'].includes(r.status)).length;
  const raw = scanStats(D.scans), val = scanStats(D.scans, { excludeBots: true });
  const expiring = D.orgs.filter(o => o.contract.status === 'active' && dday(o.contract.end) <= 30);
  $('#s-dash').innerHTML = `
    <div class="grid g5" style="margin-bottom:16px;">
      <div class="kpi"><div class="k">보고서</div><div class="v">${D.reports.length}<small>건</small></div><div class="d">QR 활성 ${D.reports.filter(r => r.status === 'active').length} · 고객사 ${D.orgs.length}</div></div>
      <div class="kpi"><div class="k">활성 QR</div><div class="v">${D.qrs.filter(q => q.status === 'active').length}<small>/ ${D.qrs.length}</small></div><div class="d">만료 ${D.qrs.filter(q => q.status === 'expired').length} · 정지 ${D.qrs.filter(q => q.status === 'suspended').length} · 폐기 ${D.qrs.filter(q => q.status === 'revoked').length}</div></div>
      <div class="kpi"><div class="k">30일 유효 스캔</div><div class="v">${val.total.toLocaleString()}<small>회</small></div><div class="d">원시 ${raw.total} · 봇 ${raw.bots} 제외</div></div>
      <div class="kpi ${evFail ? 'alert' : ''}"><div class="k">실증 요건 미충족</div><div class="v">${evFail}<small>건</small></div><div class="d">QR 발급 잠김 — 보고서에서 확인</div></div>
      <div class="kpi ${consentWait ? 'alert' : ''}"><div class="k">공개 동의 대기</div><div class="v">${consentWait}<small>건</small></div><div class="d">고객사 동의 전 발급 불가</div></div>
    </div>
    <div class="grid g2">
      <div class="card"><div class="card-h"><h3>스캔 추이 30일</h3><div class="row"><span class="small muted">봇 제외</span><span class="tgl ${bots ? 'on' : ''}" id="d-bot"></span></div></div><canvas class="cv" id="d-cv"></canvas></div>
      <div class="card"><div class="card-h"><h3>알림</h3></div>
        ${expiring.map(o => `<div class="note warn" style="margin-bottom:8px;"><b>${esc(o.name)}</b> 계약 종료 D-${dday(o.contract.end)} (${esc(o.contract.end)}) — 종료 후 QR은 「만료 랜딩」으로 전환됩니다(404 없음). 연장 여부 확인 필요</div>`).join('')}
        ${D.orgs.filter(o => o.contract.status === 'suspended').map(o => `<div class="note bad" style="margin-bottom:8px;"><b>${esc(o.name)}</b> 구독 미납 정지 — QR은 「일시 표시 제한」 랜딩 · 기본 진위확인은 유지 (${esc(o.contract.note || '')})</div>`).join('')}
        ${D.reports.filter(r => !evidenceCheck(r).pass).map(r => `<div class="note bad" style="margin-bottom:8px;"><b>${esc(r.no)}</b> 실증 요건 미충족 — ${evidenceCheck(r).fails.map(f => f.label.split(' (')[0]).join(' · ')}</div>`).join('')}
        <div class="label" style="margin:14px 0 6px;">도용·위조 신고 접수 ${D.demoReports.length}건</div>
        ${D.demoReports.slice().reverse().map(x => `<div class="small" style="padding:6px 0;border-bottom:1px solid var(--line)"><span class="mono">${esc(x.id)}</span> · ${esc(x.at)} · QR ${esc(x.token)} · ${esc(x.reason)} <span class="chip warn" style="height:20px;font-size:11px;">${esc(x.status)}</span></div>`).join('')}
      </div>
    </div>
    <div class="card" style="margin-top:16px;"><div class="card-h"><h3>최근 감사로그</h3><button class="btn ghost sm" id="d-audit">전체 보기</button></div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>시각</th><th>누가</th><th>무엇을</th><th>대상</th></tr></thead><tbody>${D.auditLogs.slice(0, 6).map(a => `<tr><td class="mono">${esc(a.at)}</td><td>${esc(a.who)}</td><td>${esc(a.action)}</td><td class="mono">${esc(a.target)}</td></tr>`).join('')}</tbody></table></div></div>`;
  $('#d-bot').addEventListener('click', () => { bots = !bots; rDash(); });
  $('#d-audit').addEventListener('click', () => go('audit'));
  drawDaily($('#d-cv'), (bots ? val : raw).byDay);
}
function drawDaily(cv, byDay) {
  const paint = () => {
    const dpr = devicePixelRatio || 1, w = cv.clientWidth || 600, h = cv.clientHeight || 180;
    cv.width = w * dpr; cv.height = h * dpr; const c = cv.getContext('2d'); c.scale(dpr, dpr);
    const days = []; for (let i = 29; i >= 0; i--) days.push(addDays(TODAY, -i));
    const vals = days.map(d => byDay[d] || 0), max = Math.max(...vals, 1), bw = (w - 30) / days.length;
    c.font = '11px Geist Mono, monospace'; c.textAlign = 'left';
    days.forEach((d, i) => { const x = 30 + i * bw, bh = (h - 28) * vals[i] / max; c.fillStyle = i === days.length - 1 ? '#005850' : '#d1ddd3'; c.fillRect(x + 2, h - 22 - bh, bw - 4, bh); if (i % 7 === 0) { c.fillStyle = '#9f9fa9'; c.fillText(d.slice(5), x, h - 6); } });
    c.fillStyle = '#71717b'; c.fillText(String(max), 0, 12);
  };
  // 레이아웃 확정 전 측정(backing 수십 px) 방지 — 크기가 잡힐 때마다 다시 그림
  if (cv._ro) cv._ro.disconnect();
  cv._ro = new ResizeObserver(() => { if (cv.clientWidth > 60) paint(); });
  cv._ro.observe(cv);
  if (cv.clientWidth > 60) paint();
}

/* ═══ 보고서 ═══ */
function rReports() {
  const list = D.reports.filter(r => (!filt.q || r.no.toLowerCase().includes(filt.q.toLowerCase()) || r.product.includes(filt.q)) && (!filt.org || r.orgId === filt.org) && (!filt.st || r.status === filt.st));
  $('#s-reports').innerHTML = `
    <div class="card">
      <div class="toolbar">
        <div class="tb-search">${I.search}<input id="f-q" value="${esc(filt.q)}" placeholder="보고서 번호 · 제품명 (시험법 300종 규모 — 검색형 필터)"></div>
        <select class="sel" id="f-org"><option value="">고객사 전체</option>${D.orgs.map(o => `<option value="${o.id}" ${filt.org === o.id ? 'selected' : ''}>${esc(o.name)}</option>`).join('')}</select>
        <select class="sel" id="f-st"><option value="">상태 전체</option>${['registered', 'viewed', 'consented', 'active', 'expired', 'suspended', 'revoked'].map(s => `<option value="${s}" ${filt.st === s ? 'selected' : ''}>${statusLabel(s)}</option>`).join('')}</select>
        <span class="sp"></span><span class="small muted">${list.length}건</span>
      </div>
      <div class="tbl-wrap"><table class="tbl click"><thead><tr><th>고객사</th><th>보고서 번호</th><th>시험 유형</th><th>제품명</th><th>발급일</th><th>실증</th><th>상태</th><th>QR</th></tr></thead><tbody>
        ${list.map(r => { const ev = evidenceCheck(r), qs = D.qrs.filter(q => q.reportId === r.id); return `<tr data-id="${r.id}" class="${cur === r.id ? 'sel' : ''}"><td>${esc(orgOf(D, r.orgId).name)}</td><td class="mono">${esc(r.no)}</td><td>${esc(typeOf(D, r.type).ko)}</td><td>${esc(r.product)}</td><td>${esc(latestVersion(r).date)} · v${latestVersion(r).v}</td><td>${ev.pass ? `<span class="chip ok">${I.check} 충족</span>` : `<span class="chip bad">${I.x} ${ev.fails.length}건</span>`}</td><td><span class="chip ${r.status}">${esc(statusLabel(r.status))}</span></td><td>${qs.length ? qs.map(q => `<span class="chip ${q.status} mono" style="height:20px;font-size:10.5px;">${esc(q.token)}</span>`).join(' ') : '<span class="muted">—</span>'}</td></tr>`; }).join('')}
      </tbody></table></div>
    </div>
    <div class="detail" id="rep-detail"></div>`;
  $('#f-q').addEventListener('input', e => { filt.q = e.target.value; rReports(); const el = $('#f-q'); el.focus(); el.setSelectionRange(filt.q.length, filt.q.length); });
  $('#f-org').addEventListener('change', e => { filt.org = e.target.value; rReports(); });
  $('#f-st').addEventListener('change', e => { filt.st = e.target.value; rReports(); });
  $$('#s-reports tbody tr').forEach(tr => tr.addEventListener('click', () => { cur = tr.dataset.id; rReports(); $('#rep-detail').scrollIntoView({ behavior: 'smooth', block: 'start' }); }));
  rDetail();
}
function flowHTML(r) {
  const steps = ['registered', 'viewed', 'consented', 'active'];
  const idx = steps.indexOf(r.status), term = ['expired', 'suspended', 'revoked'].includes(r.status);
  return `<div class="flow">${steps.map((s, i) => `<div class="st ${term ? 'done' : i < idx ? 'done' : i === idx ? 'cur' : ''}"><i></i>${statusLabel(s)}</div>${i < 3 ? '<div class="ln"></div>' : ''}`).join('')}${term ? `<div class="ln"></div><div class="st bad"><i></i>${statusLabel(r.status)}</div>` : ''}</div>`;
}
const PF_LABELS = { product: '제품명', type: '시험 유형', period: '시험 기간', subjects: '피험자 수(인원만)', verdict: '판정·결론 문장', adverse: '유해사례 결론', institution: '시험기관', supervisor: '시험책임자 성명·경력', method: '통계 분석 방법', irb: 'IRB 승인번호' };
const PRIV = { photo: '피험자 사진·부위 이미지 마스킹 확인', initials: '이니셜·연령·성별 개별값 제거 확인', history: '병력·복용약 등 건강정보 제거 확인', signature: '피험자 서명란 제거 확인' };
function rDetail() {
  const r = reportOf(D, cur); if (!r) return;
  const org = orgOf(D, r.orgId), ev = evidenceCheck(r), can = canIssueQR(r), qs = D.qrs.filter(q => q.reportId === r.id), v = latestVersion(r), pp = privacyPass(r);
  $('#rep-detail').innerHTML = `
    <div class="card">

        <div class="row"><span class="chip ${r.status}">${esc(statusLabel(r.status))}</span>${qs[0] ? `<a class="btn sec sm" href="r.html?t=${qs[0].token}" target="_blank">공개 화면 ${I.ext}</a>` : ''}</div></div>

        </div>
        <div>
          <div class="label" style="margin-bottom:8px;">② 공개 항목 화이트리스트 (A-2) — 체크 해제 시 공개 화면에서 즉시 사라짐</div>
          <div class="pf">${Object.keys(PF_LABELS).map(k => `<label><input type="checkbox" data-pf="${k}" ${r.publicFields[k] ? 'checked' : ''}> ${esc(PF_LABELS[k])}</label>`).join('')}

      { name: 'ATTEST_인수인계/.env.example', data: `DATABASE_URL=\nOBJECT_STORAGE_BUCKET=\nOBJECT_STORAGE_KEY=\nOBJECT_STORAGE_SECRET=\nPUBLIC_BASE_URL=https://attest.kr/r/\nMAIL_API_KEY=\nSESSION_SECRET=` },
    ];
    const size = ZIP.download(files, `ATTEST_인수인계패키지_${TODAY}.zip`); audit('인수인계 패키지 생성', `${files.length}개 파일`); Store.save(); toast(`인수인계 패키지 ZIP 생성 (${files.length}개 파일 · ${Math.round(size / 1024)}KB)`);
  });
}

window.addEventListener('storage', e => { if (e.key !== ATTEST_KEY) return; Store._d = null; const nd = Store.load(); Object.keys(D).forEach(k => delete D[k]); Object.assign(D, nd); RENDER[sect](); counts(); });
go('dash');
</script>
