<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>프로그램 상세 — 더알림</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
<style>
.meta-row{display:flex;gap:1.5rem;flex-wrap:wrap;font-family:var(--serif);font-size:var(--fs-c16s);color:var(--g700);margin-top:1rem}.meta-row span+span::before{content:"·";margin-right:1.5rem}
.def-row dd .faq ul li{border:0;padding-bottom:0;margin-bottom:0}
</style>
</head>
<body>
<div id="hd"></div>
<main class="s-wrap" id="main"></main>
<div id="ft"></div>
<script src="assets/js/programs.js"></script><script src="assets/js/data.js"></script><script src="assets/js/shell.js"></script><script src="assets/js/ui.js"></script>
<script>
(function(){
  const p = DATA.program(qs("id")) || PROGRAMS.find(x=>x.id==="med-01");
  document.title = `${p.name} — 더알림 프로그램`;
  const center = CENTERS.find(c=>c.id===p.center);
  const field = ({youth:"진로·취업",corp:"리더십",medical:"병원·의료",public:"소통·CS"})[p.center];
  const recs = LECTURERS.filter(l => l.pub && l.featured && (l.field===field || l.field2===field || (p.legal && l.legal))).slice(0,4);
  const availN = DATA.countLecturers({ field, legal:p.legal });
  const hoursTotal = p.sessions ? p.sessions.reduce((a,s)=>a+s.min,0) : p.hours*60;
  const refund = p.legal ? "법정의무교육은 고용보험 환급 대상이 아닙니다." : (p.hours>=4 ? "사업주훈련 환급 요건 검토 가능 — 과정 인정·고용보험 가입이 전제입니다." : "2시간 이하 과정은 환급 대상 요건을 충족하지 않습니다.");
  const faq = (n, title, right, items, open) => `<div class="faq ${open?"is-active":""}"><button class="faq-q" type="button" aria-expanded="${!!open}">${n?`<span class="n">${n}</span>`:""}<span class="q" style="flex:1">${title}</span><span class="ft-b16" style="flex:none;opacity:.8">${right}</span><span class="pm"></span></button><div class="faq-a"><div><div class="ad"><ul>${items.map(it=>`<li class="${/^\[실전사례\]/.test(it)?"act":""}">${H.esc(it)}</li>`).join("")}</ul></div></div></div></div>`;
  const sessions = p.sessions && p.sessions.length ? `<dl class="def-row" data-reveal=""><dt>차시별 강의계획<br><span class="ft-c16s c-sub">${p.sessions.length}차시 · ${hoursTotal}분</span></dt><dd><div data-single>${p.sessions.map((s,i)=>faq("0"+s.n, H.esc(s.title)+(s.activity?' <span class="chip" style="margin-left:.5rem">활동</span>':""), s.min+"분", s.items, i===0)).join("")}</div></dd></dl>` : "";
  const blocks = p.blocks && p.blocks.length ? p.blocks.map(b => `<dl class="def-row" data-reveal=""><dt>${H.esc(b.title||b.head)}</dt><dd>${b.groups.some(g=>g.name) ? `<div data-single>${b.groups.filter(g=>g.name).map((g,i)=>faq("", H.esc(g.name), g.items.length+"항목", g.items, i===0)).join("")}</div>` : `<ul>${b.groups.flatMap(g=>g.items).map(it=>`<li>${H.esc(it)}</li>`).join("")}</ul>`}</dd></dl>`).join("") : "";
  $("#main").innerHTML = `
  <div class="bc"><a href="index.html" aria-label="홈"><span class="home"></span></a><i></i><a href="programs.html">프로그램 카탈로그</a><i></i><a href="programs.html?center=${p.center}">${center.name}</a></div>
  <div class="board-head" data-reveal-box style="margin-bottom:5rem"><div><p class="ft-c16s c-sub" data-reveal="mask">${center.name}${p.legal?" · 법정의무교육":""}</p><h1 class="t" data-reveal="mask">${H.esc(p.name)}</h1><div class="meta-row" data-reveal=""><span>${p.hours}시간${p.sessions?` · ${p.sessions.length}차시`:""}</span><span>${p.targets.map(t=>TARGET_LABEL[t]||t).join(" · ")}</span><span>${p.format.join(" / ")}</span><span>가용 강사 ${availN}명</span></div></div><div class="btn-row" data-reveal=""><button class="btn-outline" type="button" id="share">링크 복사</button><button class="btn-outline" type="button" id="pdf">강의계획서 내려받기</button><button class="cta" type="button" data-cart="${p.id}" data-name="${H.esc(p.name)}" data-label="제안서에 담기"><span class="lb">${cart.has(p.id)?"담김":"제안서에 담기"}</span></button></div></div>
  <section class="sticky2" data-reveal-box>
    <div class="left" data-reveal=""><h2 class="lb">${H.esc(p.summary||p.name)}</h2><div class="ph"><img src="assets/img/${H.progImg(p)}.webp" alt=""></div><p class="cap">${center.name} 현장 — 사진은 데모용 생성 이미지입니다.</p></div>
    <div class="right">
      ${p.goals && p.goals.length ? `<div data-reveal=""><p class="lead32">교육 목표</p><ul class="mt16" style="display:grid;gap:.5rem">${p.goals.map(g=>`<li class="ft-b20" style="position:relative;padding-left:1rem"><i style="position:absolute;left:0;top:.65rem;width:6px;height:6px;border-radius:50%;background:var(--primary)"></i>${H.esc(g)}</li>`).join("")}</ul></div>` : ""}
      <div class="cards" data-reveal=""><div class="infocard"><div class="lb">교육 대상</div><div class="vl">${H.esc(p.target || p.targets.map(t=>TARGET_LABEL[t]).join(", "))}</div></div><div class="infocard"><div class="lb">시간 · 형태</div><div class="vl">${p.hours}시간${p.sessions?` (${hoursTotal}분 · ${p.sessions.length}차시)`:""} · ${p.format.join(" · ")} · 권장 ${p.center==="medical"?"20~40명 (활동형)":p.hours>=8?"15~30명":"제한 없음"}</div></div><div class="infocard"><div class="lb">환급</div><div class="vl">${refund}</div></div></div>
      <div class="cta-wrap" style="justify-content:flex-start" data-reveal=""><a class="cta" href="request.html?progs=${p.id}">이 과정으로 제안서 요청</a><span class="ft-c14 c-sub" style="align-self:center">1~2영업일 회신 · 견적서·강사 약력 동봉</span></div>
    </div>
  </section>
  <section class="sec" data-reveal-box>
    ${sessions}${blocks}
    ${p.effects && p.effects.length ? `<dl class="def-row" data-reveal=""><dt>기대효과</dt><dd><ul>${p.effects.map(g=>`<li>${H.esc(g)}</li>`).join("")}</ul></dd></dl>` : ""}
    <div class="note-box mt40" data-reveal=""><div class="nt">문의 · 담당 매니저</div><ul><li>${p.center==="medical"||p.center==="corp"?"박매니저":"최매니저"} · 0507-1322-2916 · 월–일 10:00–20:00</li><li>품의용 강의계획서는 「강의계획서 내려받기」로 즉시 받을 수 있습니다</li></ul></div>
  </section>
  <section class="sec" data-reveal-box>
    <div class="row-between b-b-line" style="padding-bottom:1.5rem;margin-bottom:2.5rem"><div><h2 class="h40" data-reveal="mask">이 과정을 맡는 강사</h2><p class="ft-t24s c-sub" data-reveal="">공개 ${availN}명 중 ${recs.length}명 · 지명은 참고 사항이고 매니저가 최종 배정합니다</p></div>${H.under(`lecturers.html?field=${encodeURIComponent(field)}`)}</div>
    <div class="g4" id="lecs">${recs.map(H.lecCard).join("")}</div>
  </section>
  <section class="sec" data-reveal-box>
    <div class="row-between b-b-line" style="padding-bottom:1.5rem;margin-bottom:2.5rem"><div><h2 class="h40" data-reveal="mask">같은 센터의 다른 과정</h2></div>${H.under(`programs.html?center=${p.center}`)}</div>
    <div class="g4">${PROGRAMS.filter(x=>x.center===p.center && x.id!==p.id).slice(0,4).map(H.progCard).join("")}</div>
  </section>`;
  $("#pdf").addEventListener("click", () => {
    const lines = [`더알림 강의계획서 (샘플)`, `프로그램: ${p.name}`, `센터: ${center.name} · 총 ${p.hours}시간`, `대상: ${p.target||p.targets.map(t=>TARGET_LABEL[t]).join(", ")}`, ``, `[교육 목표]`, ...(p.goals||[]).map(g=>`- ${g}`), ``, `[차시별 계획]`, ...(p.sessions||[]).flatMap(s=>[`${s.n}차시 · ${s.title} (${s.min}분)`, ...s.items.map(i=>`   · ${i}`)]), ``, `[기대효과]`, ...(p.effects||[]).map(g=>`- ${g}`), ``, `※ 본 문서는 리뉴얼 제안 데모가 생성한 샘플입니다.`];
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿"+lines.join("\r\n")], { type:"text/plain;charset=utf-8" })); a.download = `더알림_강의계획서_${p.name}.txt`; a.click(); toast("강의계획서 샘플을 내려받았습니다", "ok"); });
  $("#share").addEventListener("click", () => { navigator.clipboard && navigator.clipboard.writeText(location.href).catch(()=>{}); toast("링크를 복사했습니다 — 품의서에 붙여 쓰세요", "ok"); });
  UI.reveal(); UI.accordion();
})();
</script>
</body></html>
