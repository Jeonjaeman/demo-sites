<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>프로그램 상세 — 더알림</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="hd"></div>
<main id="main"></main>
<div id="ft"></div>
<script src="assets/js/programs.js"></script><script src="assets/js/data.js"></script><script src="assets/js/shell.js"></script><script src="assets/js/ui.js"></script>
<script>
(function(){
  const p = DATA.program(qs("id")) || PROGRAMS.find(x=>x.id==="med-01");
  document.title = `${p.name} — 더알림 프로그램`;
  const center = CENTERS.find(c=>c.id===p.center);
  const field = ({youth:"진로·취업",corp:"리더십",medical:"병원·의료",public:"소통·CS"})[p.center];
  const recs = LECTURERS.filter(l => l.pub && l.featured && (l.field===field || l.field2===field || (p.legal && l.legal))).slice(0,3);
  const availN = DATA.countLecturers({ field, legal:p.legal });
  const hoursTotal = p.sessions ? p.sessions.reduce((a,s)=>a+s.min,0) : p.hours*60;
  const refund = p.legal ? "법정의무교육은 환급 대상이 아닙니다" : (p.hours>=4 ? "사업주 훈련 환급 요건 검토 가능 (기관 조건에 따라 다름)" : "2시간 이하 과정은 환급 대상 요건 미충족");
  const sessions = p.sessions && p.sessions.length ? `<h2 class="sub-h"><small>Curriculum</small>차시별 강의계획 <span class="muted small">${p.sessions.length}차시 · ${hoursTotal}분</span></h2>
    <div class="acc-group">${p.sessions.map((s,i)=>`<div class="acc ${i===0?"open":""}"><button class="acc-h" aria-expanded="${i===0}"><span class="n">0${s.n}</span><span>${H.esc(s.title)}${s.activity?' <span class="tag soft">활동</span>':""}</span><span class="min">${s.min}분</span><span class="chev"></span></button><div class="acc-b"><div><ul>${s.items.map(it=>`<li class="${/^\[실전사례\]/.test(it)?"act":""}">${H.esc(it)}</li>`).join("")}</ul></div></div></div>`).join("")}</div>` : "";
  const blocks = p.blocks && p.blocks.length ? p.blocks.map(b => `<h2 class="sub-h"><small>${H.esc(b.head)}</small>${H.esc(b.title)}</h2>
      ${b.groups.some(g=>g.name) ? `<div class="acc-group">${b.groups.filter(g=>g.name).map((g,i)=>`<div class="acc ${i===0?"open":""}"><button class="acc-h" aria-expanded="${i===0}"><span class="n">0${g.n||i+1}</span><span>${H.esc(g.name)}</span><span class="min">${g.items.length}항목</span><span class="chev"></span></button><div class="acc-b"><div><ul>${g.items.map(it=>`<li>${H.esc(it)}</li>`).join("")}</ul></div></div></div>`).join("")}</div>` : `<ul class="checks">${b.groups.flatMap(g=>g.items).map(it=>`<li>${H.esc(it)}</li>`).join("")}</ul>`}`).join("") : "";
  $("#main").innerHTML = `
  <section class="phero"><div class="hero-media"><img src="assets/img/${center.img}.webp" alt="" data-parallax=".1"></div><div class="shell">
    <div class="crumb"><a href="index.html">홈</a><span>/</span><a href="programs.html?center=${p.center}">${center.name}</a><span>/</span><span>프로그램</span></div>
    <span class="eyebrow" style="color:rgba(255,255,255,.7)">${center.en}${p.legal?" · 법정의무":""}</span>
    <h1 class="mt2" data-words>${H.esc(p.name)}</h1>
    <p class="lead">${H.esc(p.summary)}</p>
  </div></section>
  <section class="sec"><div class="shell detail">
    <div>
      ${p.goals && p.goals.length ? `<h2 class="sub-h" style="margin-top:0"><small>Goals</small>교육 목표</h2><ul class="checks" data-reveal="stagger">${p.goals.map(g=>`<li>${H.esc(g)}</li>`).join("")}</ul>` : ""}
      ${p.target ? `<h2 class="sub-h"><small>Who</small>교육 대상</h2><p class="lead">${H.esc(p.target)}</p>` : ""}
      ${sessions}${blocks}
      ${p.effects && p.effects.length ? `<h2 class="sub-h"><small>Outcomes</small>기대효과</h2><ul class="checks" data-reveal="stagger">${p.effects.map(g=>`<li>${H.esc(g)}</li>`).join("")}</ul>` : ""}
      <h2 class="sub-h"><small>Lecturers</small>이 과정을 맡는 강사 <span class="muted small">공개 ${availN}명 중 대표 ${recs.length}명</span></h2>
      <div class="grid g3" data-reveal="stagger">${recs.map(H.lecCard).join("")}</div>
      <p class="small muted mt2">강사 배정은 기관 일정·권역·담당자 피드백 이력을 함께 보고 매니저가 확정합니다. 특정 강사를 지명하려면 제안서 요청 시 이름을 적어 주세요.</p>
    </div>
    <aside class="sticky"><div class="meta-card">
      <div class="eyebrow">Program</div>
      <dl><dt>총 시간</dt><dd>${p.hours}시간${p.sessions?` (${hoursTotal}분)`:""}</dd><dt>차시</dt><dd>${p.sessions?p.sessions.length+"차시":"협의"}</dd><dt>대상</dt><dd>${p.targets.map(t=>TARGET_LABEL[t]||t).join(", ")}</dd><dt>형태</dt><dd>${p.format.join(" · ")}</dd><dt>권장 인원</dt><dd>${p.center==="medical"?"20~40명 (활동형)":p.hours>=8?"15~30명":"제한 없음"}</dd><dt>가용 강사</dt><dd>${availN}명</dd></dl>
      <div class="notice ${p.legal?"warn":"ok"} small">${refund}</div>
      <button class="btn btn-primary cart-btn-lg" type="button" data-cart="${p.id}" data-name="${H.esc(p.name)}">${cart.has(p.id)?"담김 — 제안서에서 보기":"제안서에 담기"}</button>
      <button class="btn btn-ghost" type="button" id="pdf">샘플 강의계획서 내려받기</button>
      <a class="btn btn-ghost" href="request.html">바로 제안서 요청</a>
    </div></aside>
  </div></section>
  <section class="sec-tight sec-paper2"><div class="shell"><div class="sec-head"><div><span class="eyebrow">Related</span><h2>같은 센터의 다른 과정</h2></div><a class="link" href="programs.html?center=${p.center}">전체 보기</a></div><div class="grid g3" data-reveal="stagger">${PROGRAMS.filter(x=>x.center===p.center && x.id!==p.id).slice(0,3).map(H.progCard).join("")}</div></div></section>`;

  document.querySelector(".cart-btn-lg").addEventListener("click", function(){ setTimeout(()=>{ this.textContent = cart.has(p.id) ? "담김 — 제안서에서 보기" : "제안서에 담기"; this.classList.toggle("on", false); }, 0); });
  // 샘플 강의계획서: 실제 텍스트 파일 생성 (Blob)
  $("#pdf").addEventListener("click", () => {
    const lines = [`더알림 강의계획서 (샘플)`, `프로그램: ${p.name}`, `센터: ${center.name} · 총 ${p.hours}시간`, `대상: ${p.target||p.targets.map(t=>TARGET_LABEL[t]).join(", ")}`, ``, `[교육 목표]`, ...(p.goals||[]).map(g=>`- ${g}`), ``, `[차시별 계획]`, ...(p.sessions||[]).flatMap(s=>[`${s.n}차시 · ${s.title} (${s.min}분)`, ...s.items.map(i=>`   · ${i}`)]), ``, `[기대효과]`, ...(p.effects||[]).map(g=>`- ${g}`), ``, `※ 본 문서는 리뉴얼 제안 데모가 생성한 샘플입니다.`];
    const blob = new Blob(["﻿"+lines.join("\r\n")], { type:"text/plain;charset=utf-8" }); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `더알림_강의계획서_${p.name}.txt`; a.click(); toast("강의계획서 샘플을 내려받았습니다", "ok");
  });
})();
</script>
</body></html>
