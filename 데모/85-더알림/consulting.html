<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>개인컨설팅 — 더알림</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
<style>
.con{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.con>div{padding:26px;background:#fff;border:1px solid var(--line-2);border-radius:var(--r-lg);display:grid;gap:10px;transition:transform var(--t) var(--ease),box-shadow var(--t)} .con>div:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.con h3{font-size:21px} .con .who{font-size:12.5px;color:var(--muted)} .con ul{display:grid;gap:4px;font-size:14px;color:var(--ink-2)} .con li::before{content:"· ";color:var(--gold)}
.con .meta{display:flex;justify-content:space-between;font-size:13.5px;padding-top:10px;border-top:1px solid var(--line-2);margin-top:auto} .con .meta b{font-family:var(--serif);font-size:16px}
</style>
</head>
<body>
<div id="hd"></div>
<main>
<section class="phero"><div class="hero-media"><img src="assets/img/consulting-room.webp" alt="" data-parallax=".1"></div><div class="shell">
  <div class="crumb"><a href="index.html">홈</a><span>/</span><span>개인컨설팅</span></div>
  <span class="eyebrow" style="color:rgba(255,255,255,.7)">Private Consulting</span>
  <h1 class="mt2" data-words>1:1로 묻고,<br>현직자가 답합니다</h1>
  <p class="lead">진로·취업·창업·프레젠테이션·온라인 마케팅. 대기업·공기업 전현직자와 정부지원사업을 따 본 컨설턴트가 직접 합니다. 회당 60~120분, 온라인·강남본사.</p>
</div></section>
<section class="sec"><div class="shell">
  <div class="sec-head"><div><span class="eyebrow">Programs</span><h2 data-words>7개 과정</h2></div><p class="lead">비용은 회당 기준이며 첫 상담 30분은 무료입니다. 대학생·졸업생·중장년·경력단절 집중반은 소그룹(4명)으로도 엽니다.</p></div>
  <div class="con" data-reveal="stagger" id="con"></div>
</div></section>
<section class="sec sec-paper2"><div class="shell"><div class="cta" data-reveal><div><h2>첫 상담 30분은 무료입니다</h2><p>빠른 상담에서 "개인(자격·컨설팅)"을 고르면 담당 컨설턴트가 연락합니다.</p></div><div class="cta-btns"><a class="btn btn-light" href="contact.html">빠른 상담 신청 →</a></div></div></div></section>
</main>
<div id="ft"></div>
<script src="assets/js/programs.js"></script><script src="assets/js/data.js"></script><script src="assets/js/shell.js"></script><script src="assets/js/ui.js"></script>
<script>
$("#con").innerHTML = CONSULTING.map(c=>`<div><span class="who">${c.who}</span><h3>${c.name}</h3><p class="muted small">${c.line}</p><ul>${c.items.map(i=>`<li>${i}</li>`).join("")}</ul><div class="meta"><span>${c.sessions}</span><b>${c.price}</b></div><button class="btn btn-ghost btn-sm" type="button" onclick="toast('${c.name} 상담을 신청했습니다 — 컨설턴트가 연락드립니다','ok')">무료 첫 상담 신청</button></div>`).join("");
</script>
</body></html>
