<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>강사 프로필 — 더알림</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
<style>
.hist li{display:grid;grid-template-columns:7rem 1fr auto;gap:1rem;padding:1rem 0;border-bottom:1px solid var(--g300);font-size:1rem}.hist li span:first-child{font-family:var(--serif);color:var(--g700)}
.def-row dd .hist li{padding-left:0}.def-row dd .hist li::before{display:none}
.fb{padding:1.5rem;background:var(--g100);font-family:var(--serif);font-size:var(--fs-b20);line-height:1.6}.fb+.fb{margin-top:.75rem}.fb small{display:block;font-family:var(--sans);color:var(--g700);margin-top:.5rem;font-size:.875rem}
.dl2{display:grid;grid-template-columns:auto 1fr;gap:.5rem 1.5rem;font-size:1rem}.dl2 dt{color:var(--g700)}.dl2 dd{font-weight:600}
</style>
</head>
<body class="has-hero-visual">
<div id="hd"></div>
<main class="inner" id="main"></main>
<div id="ft"></div>
<script src="assets/js/programs.js"></script><script src="assets/js/data.js"></script><script src="assets/js/shell.js"></script><script src="assets/js/ui.js"></script>
<script>
(function(){
  const l = DATA.lecturer(qs("id")) || DATA.lecturer("L0001");
  document.title = `${l.name} 강사 — 더알림`;
  const r = (s=>()=>{ s=(s*9301+49297)%233280; return s/233280; })(parseInt(l.id.slice(1)));
  const progs = PROGRAMS.filter(p => { const f = ({youth:"진로·취업",corp:"리더십",medical:"병원·의료",public:"소통·CS"})[p.center]; return f===l.field || f===l.field2 || (l.legal && p.legal) || (l.topics||[]).some(t=>p.name.includes(t.split(" ")[0])); }).slice(0,6);
  const orgTypes = ["종합병원","특성화고","공공기관","대기업","중견기업","대학","요양병원","지자체"], months = ["2026.10","2026.09","2026.09","2026.08","2026.07","2026.06","2026.05","2026.04"];
  const hist = Array.from({length:8}, (_,i) => ({ m: months[i], org: orgTypes[Math.floor(r()*orgTypes.length)]+" ("+REGIONS[Math.floor(r()*REGIONS.length)]+")", prog: progs[Math.floor(r()*Math.max(1,progs.length))]?.name || l.field+" 교육", sat: (4.3 + r()*0.7).toFixed(1) }));
  const fbs = CASES.filter(c=>c.lec===l.id).slice(0,2);
  const generic = [["교육 후 부서 분위기가 달라졌다는 말을 여러 명에게 들었습니다.","인사팀장 · 중견기업"],["사례가 전부 우리 현장 이야기라 몰입이 좋았습니다.","교육담당 · 공공기관"]];
  const img = l.img ? `assets/img/${l.img}.webp` : "assets/img/hero-main.webp";
  $("#main").innerHTML = `
  <section class="hv"><img class="bg" src="${img}" alt=""><div class="in"><div><p class="lb">${H.esc(l.field)}${l.field2?" · "+H.esc(l.field2):""} · ${l.region}</p><h1 class="t">${H.esc(l.name)} <span class="serif" style="font-size:var(--fs-t32s);font-weight:400">${H.esc(l.title || l.field + " 전문 강사")}</span></h1></div><a class="btn-outline w" href="lecturers.html?field=${encodeURIComponent(l.field)}">목록으로</a></div></section>
  <div class="hv-body" data-reveal-box>
    <div class="hv-box" data-reveal="">
      <p class="ft-b24">${H.esc(l.line || `${l.field} 분야에서 ${l.exp}년. 현장의 사례로 시작해 참여자가 스스로 답을 찾게 하는 방식을 고집합니다.`)}</p>
      <div class="stats4" style="grid-template-columns:repeat(2,1fr);gap:1rem"><div class="stat"><div class="lb">경력</div><div class="num"><span data-count="${l.exp}">0</span><small>년</small></div></div><div class="stat"><div class="lb">출강 횟수</div><div class="num"><span data-count="${l.runs}">0</span><small>회</small></div></div><div class="stat"><div class="lb">담당자 평점</div><div class="num"><span data-count="${l.rating}" data-dec="1">0</span><small>/ 5</small></div></div><div class="stat"><div class="lb">재출강 요청</div><div class="num"><span data-count="${Math.round(l.runs*0.31)}">0</span><small>건</small></div></div></div>
      <dl class="dl2"><dt>강의 주제</dt><dd>${(l.topics||[l.field, l.field2].filter(Boolean)).join(" · ")}</dd><dt>매칭 조건</dt><dd>${l.region}${l.online?" · 온라인 가능":""}${l.weekend?" · 주말 가능":""}</dd><dt>인정자격</dt><dd>${l.legal?'<span class="tag-pri">법정의무교육 인정자격 보유</span>':"없음 — 법정의무 과목 매칭 불가"}</dd><dt>공개 범위</dt><dd>전체 공개 (동의 2026.08.21) · 연락처 비공개</dd></dl>
      <div class="btn-row"><a class="cta" href="request.html?lec=${l.id}">이 강사로 제안서 요청</a><a class="btn-outline" href="lecturers.html?field=${encodeURIComponent(l.field)}">같은 분야 강사</a></div>
      <p class="ft-c14 c-sub">강사 지명은 참고 사항이며 일정·권역·피드백 이력을 종합해 매니저가 최종 배정합니다.</p>
    </div>
    <div data-reveal=""><div class="ph"><img src="${img}" alt=""></div><p class="cap">${H.esc(l.name)} · ${H.esc(l.title || l.field + " 강사")} — 초상은 데모용 생성 이미지입니다.</p></div>
  </div>
  <section class="sec" data-reveal-box>
    <dl class="def-row" data-reveal=""><dt>담당 가능 프로그램</dt><dd><div class="g3">${progs.slice(0,3).map(H.progCard).join("")}</div></dd></dl>
    <dl class="def-row" data-reveal=""><dt>최근 출강 이력<br><span class="ft-c16s c-sub">기관유형·권역만 공개</span></dt><dd><ul class="hist">${hist.map(h=>`<li><span>${h.m}</span><span>${h.org} · ${h.prog}</span><span>★ ${h.sat}</span></li>`).join("")}</ul></dd></dl>
    <dl class="def-row" data-reveal=""><dt>담당자 피드백<br><span class="ft-c16s c-sub">공개 동의 문장만</span></dt><dd>${(fbs.length?fbs.map(c=>[c.quote,c.who+" · "+c.org]):generic).map(([q,w])=>`<div class="fb">“${H.esc(q)}”<small>— ${w}</small></div>`).join("")}</dd></dl>
  </section>
  <section class="sec" data-reveal-box>
    <div class="row-between b-b-line" style="padding-bottom:1.5rem;margin-bottom:2.5rem"><div><h2 class="h40" data-reveal="mask">같은 분야 강사</h2></div>${H.under(`lecturers.html?field=${encodeURIComponent(l.field)}`)}</div>
    <div class="g4">${LECTURERS.filter(x=>x.pub&&x.featured&&x.id!==l.id&&(x.field===l.field||x.field2===l.field)).slice(0,4).map(H.lecCard).join("")}</div>
  </section>`;
  UI.reveal(); UI.countUp();
})();
</script>
</body></html>
