<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>허루프 HERLOOP — 여성들의 안전한 이야기 공간</title>
<meta name="description" content="본인확인을 거친 회원만 참여하는 여성 커뮤니티 (제안용 데모)">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23C2557A'/><circle cx='50' cy='50' r='22' fill='none' stroke='white' stroke-width='7'/><circle cx='50' cy='50' r='7' fill='white'/></svg>">
</head>
<body>

<header class="hd">
  <div class="hd-in">
    <a class="logo" href="index.html">
      <span class="logo-mk">◍</span>
      <span><b>허루프</b><small>HERLOOP</small></span>
    </a>
    <nav class="hd-nav">
      <button class="on" data-v="feed">전체</button>
      <button data-v="own">회원 이야기 <span id="ownCnt" style="opacity:.6">0</span></button>
      <button data-v="ext">읽을거리</button>
    </nav>
    <div class="hd-r">
      <a class="btn btn-l btn-sm" href="admin.html">관리자</a>
      <span id="meBox"></span>
    </div>
  </div>
</header>

<main class="main">
  <div class="wrap">
    <div class="banner rv">
      🛡<div><b>허루프는 본인확인을 거친 회원만 글을 쓸 수 있습니다.</b>
      성별·연령대만 확인하고 이름과 연락처는 저장하지 않습니다. 서로 안심하고 이야기하기 위한 최소한의 장치입니다.</div>
    </div>

    <div class="banner blue rv rv-1">
      🔗<div><b>읽을거리는 외부 글의 제목과 짧은 발췌만 보여 드립니다.</b>
      본문 전체를 가져오지 않고 원문 링크로 연결합니다 — 원 저작자의 권리를 지키기 위해서입니다.</div>
    </div>

    <div class="tabs" id="tabs"></div>
    <div id="feed"></div>
  </div>
</main>

<button class="fab" id="fab" title="글쓰기">✏️</button>

<!-- 게이트 (본인확인 / 글쓰기 / 신고) -->
<div class="gate" id="gate">
  <div class="gate-card" style="position:relative">
    <button class="gate-x" onclick="closeGate()">✕</button>
    <div id="gateBody"></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
