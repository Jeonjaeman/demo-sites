<script src="assets/js/data.js"></script>
<script src="assets/js/i18n.js"></script>
<script>
(() => {
  const D = window.MIYABI_DATA, L = window.MIYABI_LANG;

  /* 스크럽 라인 KO 대응 */
  if (L === 'ko') document.getElementById('scrubJa').textContent =
    '예약 사이트가 아니라, 당신만을 위한 조용한 3일을 설계하는 컨시어지입니다.';

  /* 카테고리 카드 */
  const catGrid = document.getElementById('catGrid');
  catGrid.innerHTML = Object.entries(D.CATS).map(([k, c], i) => {
    const n = D.PROGRAMS.filter(p => p.cat === k).length;
    return `<a class="cat-card rv rv-d${i}" href="program.html?cat=${k}">
      <img src="${c.img}" alt="${c.ja}" loading="lazy">
      <span class="cat-spot"></span>
      <div class="cat-meta">
        <span class="cbadge ${c.medical ? 'md' : ''}" data-i="${c.medical ? 'badge_medical' : 'badge_instant'}"></span>
        <h3>${c[L] || c.ja}</h3>
        <span class="cnt">${n} PROGRAMS</span>
      </div></a>`;
  }).join('');

  /* 인기 캐러셀 — 인기순 정렬 실계산 */
  const pop = [...D.PROGRAMS].sort((a, b) => b.pop - a.pop).slice(0, 8);
  document.getElementById('popCar').innerHTML = pop.map(p => {
    const c = D.CATS[p.cat];
    return `<a class="car-item" href="program.html?id=${p.id}">
      <div class="thumb"><img src="${c.img}" alt="" loading="lazy">
        <span class="cbadge" data-i="${c.medical ? 'badge_medical' : 'badge_instant'}"></span></div>
      <div class="body">
        <span class="area">${p.area}</span>
        <h3>${pName(p)}</h3>
        <div class="meta"><span class="star">★ ${p.rating.toFixed(1)}</span><span>(${p.rc})</span><span>${p.dur}${t('pd_min')}</span></div>
        <div class="price">${p.krw === 0
          ? `<b>${t('pd_free_consult')}</b>`
          : `<b>${fmtKrw(p.krw)}</b><span>${fmtJpy(p.krw)}</span>`}</div>
      </div></a>`;
  }).join('');

  /* 여정 타임라인 — 다운타임 배치 근거 시각화 */
  const JR = {
    ja: [
      { d: 1, t: '仁川空港 到着 → ホテル', s: '夕方: パーソナルカラー診断 (120分)', hot: false },
      { d: 1, t: 'パーソナルカラー診断', s: '翌日のメイク・撮影の土台に。診断書PDF発行', hot: true },
      { d: 2, t: '午前: クリニック相談 (通訳同行)', s: '施術する場合はダウンタイムを考慮し最終日は避ける', hot: true },
      { d: 2, t: '午後: シグネチャーフェイシャル', s: '肌を整えて翌日の撮影へ', hot: false },
      { d: 3, t: 'アイドルメイク&スタジオ撮影', s: '診断カラー×整った肌で、ベストな一枚を', hot: true },
      { d: 3, t: '仁川空港 出発', s: '撮影データはLINEで後日納品', hot: false }
    ],
    ko: [
      { d: 1, t: '인천공항 도착 → 호텔', s: '저녁: 퍼스널컬러 진단 (120분)', hot: false },
      { d: 1, t: '퍼스널컬러 진단', s: '다음날 메이크업·촬영의 토대. 진단서 PDF 발행', hot: true },
      { d: 2, t: '오전: 클리닉 상담 (통역 동행)', s: '시술 시 다운타임 고려, 마지막 날은 피해서', hot: true },
      { d: 2, t: '오후: 시그니처 페이셜', s: '피부를 정돈해 다음날 촬영으로', hot: false },
      { d: 3, t: '아이돌 메이크업 & 스튜디오 촬영', s: '진단 컬러 × 정돈된 피부로 최고의 한 컷', hot: true },
      { d: 3, t: '인천공항 출발', s: '촬영 데이터는 LINE으로 후일 전달', hot: false }
    ]
  };
  document.getElementById('jrTl').innerHTML = (JR[L] || JR.ja).map((x, i) =>
    `<div class="jr-day rv rv-d${i % 4} ${x.hot ? 'hot' : ''}">
      <span class="dl">DAY ${x.d} — ${x.d}${t('j_day')}</span><h4>${x.t}</h4><p>${x.s}</p></div>`).join('');

  /* 리뷰 — 비의료만 (의료법 대응 정책의 기능화) */
  const rvs = D.REVIEWS.slice(0, 6);
  document.getElementById('rvGrid').innerHTML = rvs.map((r, i) => {
    const p = D.PROGRAMS.find(x => x.id === r.pid);
    return `<div class="rv-card rv rv-d${i % 3}">
      <span class="stars">${'★'.repeat(r.stars)}${'☆'.repeat(5 - r.stars)}</span>
      <blockquote>${L === 'ko' ? r.ko : r.ja}</blockquote>
      <span class="prog">${pName(p)}</span>
      <div class="who"><span>${r.name}</span><span>${r.date}</span></div></div>`;
  }).join('');
})();
</script>
<script src="assets/js/main.js"></script>
</body>
