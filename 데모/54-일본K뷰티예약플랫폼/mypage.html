<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>マイページ | MIYABI Seoul</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Noto+Sans+JP:wght@300;400;500;600&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
.login-card { max-width: 400px; margin: 0 auto; background: var(--card); border: 1px solid var(--line); padding: 40px 36px; }
.login-card h1 { font-family: var(--serif); font-size: 24px; font-weight: 600; letter-spacing: .06em; margin-bottom: 24px; text-align: center; }
.auth-tabs { display: flex; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.auth-tabs button { flex: 1; font-size: 13px; letter-spacing: .08em; padding: 12px 0; color: var(--ink-faint); border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all .3s; }
.auth-tabs button.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.login-card .agree { display: flex; gap: 9px; align-items: flex-start; font-size: 12px; color: var(--ink-soft); margin-top: 18px; line-height: 1.7; }
.login-card .agree input { margin-top: 3px; accent-color: var(--accent); }
.login-card .pw-note { font-size: 11px; color: var(--ink-faint); margin-top: 5px; }
.login-card label { display: block; font-size: 11.5px; letter-spacing: .12em; color: var(--ink-faint); margin: 16px 0 7px; }
.login-card input { width: 100%; border: 1px solid var(--line); background: var(--bg); padding: 13px 14px; font-family: inherit; font-size: 14px; }
.login-card input:focus { outline: none; border-color: var(--accent); }
.login-card .btn { width: 100%; margin-top: 24px; }
.login-card .demo-hint { text-align: center; font-size: 11.5px; color: var(--ink-faint); margin-top: 16px; }
</style>
</head>
<body>

<header class="nav scrolled">
  <div class="nav-in">
    <a class="logo" href="index.html">MIYABI<em>·</em>SEOUL</a>
    <nav class="nav-links">
      <a href="program.html" data-i="nav_programs"></a>
      <a href="index.html#journey" data-i="nav_journey"></a>
      <a href="index.html#contact" data-i="nav_contact"></a>
    </nav>
    <div class="nav-cta">
      <div class="lang-sw"><button data-lang="ja">JA</button><button data-lang="ko">KO</button></div>
      <a class="btn sm" href="mypage.html" data-i="nav_mypage"></a>
    </div>
    <button class="nav-burger" aria-label="menu"><span></span><span></span><span></span></button>
  </div>
</header>

<main class="mp-wrap shell" id="app"></main>

<!-- 취소 모달 -->
<div class="modal-bk" id="mCancel"><div class="modal">
  <h3 data-i="mp_cancel_title"></h3>
  <div id="cnBody"></div>
  <div class="btn-row">
    <button class="btn ghost" id="cnKeep" data-i="mp_cancel_keep"></button>
    <button class="btn" id="cnGo" style="background:var(--warn)" data-i="mp_cancel_confirm"></button>
  </div>
</div></div>

<!-- 리뷰 모달 -->
<div class="modal-bk" id="mReview"><div class="modal">
  <h3 data-i="mp_review_title"></h3>
  <p id="rvProg" style="font-size:12.5px;color:var(--accent);letter-spacing:.06em;margin-bottom:6px"></p>
  <p id="rvMedNote" style="display:none;font-size:12px;color:var(--ink-faint);line-height:1.8;border:1px dashed var(--line);padding:12px 14px;margin:10px 0"></p>
  <div class="rate-row" id="rateRow"></div>
  <textarea id="rvText" data-i-ph="mp_review_ph"></textarea>
  <div class="btn-row">
    <button class="btn" id="rvGo" data-i="mp_review_submit"></button>
  </div>
</div></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/i18n.js"></script>
<script>
(() => {
  const D = window.MIYABI_DATA, L = window.MIYABI_LANG;
  const app = document.getElementById('app');
  const logged = () => sessionStorage.getItem('myb_login') === '1';

  /* ---------- 로그인·회원가입 (목 세션 · 데모 원클릭) ---------- */
  if (!logged()) {
    let mode = 'login';
    const renderAuth = () => {
      app.innerHTML = `<div class="login-card rv in">
        <h1>${t(mode === 'login' ? 'login_title' : 'signup_tab')}</h1>
        <div class="auth-tabs">
          <button id="tLogin" class="${mode === 'login' ? 'on' : ''}">${t('login_tab')}</button>
          <button id="tSignup" class="${mode === 'signup' ? 'on' : ''}">${t('signup_tab')}</button>
        </div>
        ${mode === 'login' ? `
          <label>${t('login_email')}</label><input type="email" value="yui.sato@example.jp">
          <label>${t('login_pw')}</label><input type="password" value="••••••••">
          <button class="btn" id="go">${t('login_demo')}</button>`
        : `
          <label>${t('su_name')}</label><input type="text" id="suName" value="佐藤 結衣">
          <label>${t('login_email')}</label><input type="email" id="suMail" value="yui.sato@example.jp">
          <label>${t('login_pw')}</label><input type="password" id="suPw" value="••••••••••"><p class="pw-note">${t('su_pw_note')}</p>
          <div class="agree"><input type="checkbox" id="suAgree"><label for="suAgree" style="margin:0;letter-spacing:.02em;font-size:12px;color:var(--ink-soft)">${t('su_terms')}</label></div>
          <button class="btn" id="go" disabled>${t('su_demo')}</button>`}
        <p class="demo-hint">DEMO — 実際の認証は行いません / 실제 인증 없음</p>
      </div>`;
      document.getElementById('tLogin').addEventListener('click', () => { mode = 'login'; renderAuth(); });
      document.getElementById('tSignup').addEventListener('click', () => { mode = 'signup'; renderAuth(); });
      const agree = document.getElementById('suAgree'), go = document.getElementById('go');
      agree?.addEventListener('change', () => go.disabled = !agree.checked);
      go.addEventListener('click', () => {
        if (mode === 'signup') {
          const nm = document.getElementById('suName'), em = document.getElementById('suMail');
          let ok = true;
          [nm, em].forEach(f => { const bad = !f.value.trim() || (f.type === 'email' && !/@/.test(f.value)); f.classList.toggle('err', bad); f.style.borderColor = bad ? 'var(--warn)' : ''; if (bad) ok = false; });
          if (!ok) return;
        }
        sessionStorage.setItem('myb_login', '1'); location.reload();
      });
    };
    renderAuth();
    applyI18n(); return;
  }

  /* ---------- 예약 목록 ---------- */
  const mine = JSON.parse(localStorage.getItem('myb_bk') || '[]');
  const all = [...mine, ...D.BOOKINGS.filter(b => b.name === '佐藤 結衣')];
  const cancelled = new Set(JSON.parse(localStorage.getItem('myb_cancel') || '[]'));
  all.forEach(b => { if (cancelled.has(b.no)) b.status = 'cancel'; });

  const upcoming = all.filter(b => b.date >= '2026-08-07' && b.status !== 'cancel' && b.status !== 'done');
  const history = all.filter(b => b.date < '2026-08-07' || b.status === 'done' || b.status === 'cancel');

  let tab = 'up';
  app.innerHTML = `
    <div class="mp-head rv in"><h1>${t('mp_title')}</h1><p>佐藤 結衣 ${t('mp_hello')}</p></div>
    <div class="mp-tabs">
      <button id="tabUp" class="on">${t('mp_upcoming')} (${upcoming.length})</button>
      <button id="tabHi">${t('mp_history')} (${history.length})</button>
    </div>
    <div class="bk-list" id="list"></div>`;

  const stLabel = s => t('mp_status_' + s);
  const bkHtml = b => {
    const p = D.PROGRAMS.find(x => x.id === b.pid), c = D.CATS[p.cat];
    const [y, m, d] = b.date.split('-');
    const acts = [];
    if (tab === 'up' && (b.status === 'paid' || b.status === 'consult' || b.status === 'pending'))
      acts.push(`<button data-cn="${b.no}">${t('mp_cancel')}</button>`);
    if (tab === 'hi' && b.status === 'done')
      acts.push(`<button data-rv="${b.no}" data-pid="${b.pid}">${t('mp_review')}</button>`);
    if (b.status === 'paid' || b.status === 'done')
      acts.push(`<button data-rc="${b.no}">${t('mp_receipt')}</button>`);
    return `<div class="bk-card rv in">
      <div class="bk-date"><b>${m}.${d}</b><span>${b.time}</span></div>
      <div class="bk-info">
        <h3>${pName(p)}</h3>
        <div class="sub"><span>${c[L] || c.ja} · ${p.area}</span><span>${b.pax}${t('persons')}</span><span>${b.no}</span></div>
      </div>
      <div class="bk-side">
        <span class="st ${b.status}">${stLabel(b.status)}</span>
        ${b.paid ? `<span style="font-family:var(--serif);font-size:17px">${fmtKrw(b.paid)}</span>` : ''}
        <div class="bk-acts">${acts.join('')}</div>
      </div></div>`;
  };

  const renderList = () => {
    const rows = (tab === 'up' ? upcoming : history);
    document.getElementById('list').innerHTML = rows.length
      ? rows.map(bkHtml).join('')
      : `<p style="color:var(--ink-faint);font-size:13.5px;padding:40px 0;text-align:center">${t('mp_empty')}</p>`;
  };
  renderList();

  document.getElementById('tabUp').addEventListener('click', e => { tab = 'up'; swap(e.target); });
  document.getElementById('tabHi').addEventListener('click', e => { tab = 'hi'; swap(e.target); });
  const swap = el => {
    document.querySelectorAll('.mp-tabs button').forEach(b => b.classList.toggle('on', b === el));
    renderList();
  };

  /* ---------- 취소 — 수수료 실계산 (단계 정책의 기능화) ---------- */
  const mCancel = document.getElementById('mCancel');
  let target = null;
  document.getElementById('list').addEventListener('click', e => {
    const cn = e.target.closest('[data-cn]'); const rv = e.target.closest('[data-rv]'); const rc = e.target.closest('[data-rc]');
    if (cn) openCancel(cn.dataset.cn);
    if (rv) openReview(rv.dataset.rv, rv.dataset.pid);
    if (rc) receipt(rc.dataset.rc);
  });

  const daysUntil = ds => Math.floor((new Date(ds + 'T00:00:00+09:00') - D.today) / 86400000) + 1;

  function openCancel(no) {
    target = all.find(b => b.no === no);
    const p = D.PROGRAMS.find(x => x.id === target.pid);
    const dd = daysUntil(target.date);
    const pol = D.CANCEL_POLICY.find(x => dd >= x.minDays) || D.CANCEL_POLICY.at(-1);
    const fee = Math.round(target.paid * pol.rate / 100);
    const refund = target.paid - fee;
    document.getElementById('cnBody').innerHTML = `
      <p style="font-size:13.5px;color:var(--ink-soft)">${pName(p)} — ${target.date} ${target.time}</p>
      <div class="fee-table">
        <div class="row"><span>${t('cp_title')}</span><span>D−${dd}</span></div>
        ${target.paid === 0
          ? `<div class="row hl"><span>${t('mp_cancel_fee')}</span><b>—</b></div>`
          : `<div class="row"><span>${t('mp_status_paid')}</span><span>${fmtKrw(target.paid)}</span></div>
             <div class="row hl"><span>${t('mp_cancel_fee')} (${pol.rate}%)</span><b>−${fmtKrw(fee)}</b></div>
             <div class="row hl"><span>${t('mp_cancel_refund')}</span><b style="color:var(--ok)">${fmtKrw(refund)}</b></div>`}
      </div>`;
    mCancel.classList.add('on');
  }
  document.getElementById('cnKeep').addEventListener('click', () => mCancel.classList.remove('on'));
  mCancel.addEventListener('click', e => { if (e.target === mCancel) mCancel.classList.remove('on'); });
  document.getElementById('cnGo').addEventListener('click', () => {
    cancelled.add(target.no);
    localStorage.setItem('myb_cancel', JSON.stringify([...cancelled]));
    mCancel.classList.remove('on');
    toast(t('toast_cancel'));
    setTimeout(() => location.reload(), 900);
  });

  /* ---------- 리뷰 — 의료/비의료 분기 ---------- */
  const mReview = document.getElementById('mReview');
  let stars = 5;
  function openReview(no, pid) {
    const p = D.PROGRAMS.find(x => x.id === pid);
    const medical = D.CATS[p.cat].medical;
    document.getElementById('rvProg').textContent = pName(p);
    const note = document.getElementById('rvMedNote');
    const txt = document.getElementById('rvText');
    note.style.display = medical ? 'block' : 'none';
    note.textContent = t('mp_review_medical');
    txt.style.display = medical ? 'none' : 'block';
    txt.value = '';
    const row = document.getElementById('rateRow');
    row.innerHTML = [1,2,3,4,5].map(i => `<button data-s="${i}" class="${i <= stars ? 'on' : ''}">★</button>`).join('');
    row.onclick = e => { const b = e.target.closest('[data-s]'); if (!b) return; stars = +b.dataset.s;
      row.querySelectorAll('button').forEach((x, i) => x.classList.toggle('on', i < stars)); };
    mReview.classList.add('on');
  }
  mReview.addEventListener('click', e => { if (e.target === mReview) mReview.classList.remove('on'); });
  document.getElementById('rvGo').addEventListener('click', () => {
    mReview.classList.remove('on'); toast(t('toast_review'));
  });

  /* ---------- 영수증 — Blob 실생성 ---------- */
  function receipt(no) {
    const b = all.find(x => x.no === no);
    const p = D.PROGRAMS.find(x => x.id === b.pid);
    const lines = [
      'MIYABI Seoul — RECEIPT (DEMO)', '================================',
      `No.      ${b.no}`, `Program  ${p.ja.name}`, `Date     ${b.date} ${b.time}`,
      `Pax      ${b.pax}`, `Amount   KRW ${b.paid.toLocaleString()} (≈JPY ${D.jpy(b.paid).toLocaleString()})`,
      '', '* This is a demo document. 本書はデモです。'
    ].join('\n');
    const blob = new Blob(['﻿' + lines], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `receipt_${b.no}.txt`; a.click();
    URL.revokeObjectURL(a.href);
  }

  applyI18n();
})();
</script>
<script src="assets/js/main.js"></script>
</body>
</html>
