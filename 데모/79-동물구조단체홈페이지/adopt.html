  <p class="lead" data-en="Dogs, cats, rabbits, goats. Filter by who you are looking for — and if adoption isn't possible right now, fostering for 1–3 months helps just as much.">개, 고양이, 토끼, 염소. 찾는 조건으로 좁혀 보세요. 지금 입양이 어렵다면 1~3개월 임시보호도 큰 힘이 돼요.</p>
