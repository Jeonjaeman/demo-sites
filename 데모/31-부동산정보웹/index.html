<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PINDEX 핀덱스 — 지도 기반 부동산 정보</title>
<meta name="description" content="지도 기반 부동산 정보 탐색 웹 서비스 프론트엔드 제안 데모 — 마커 성능·지오코딩·프론트 경계선을 실제로 계산해 보여줍니다">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232B6FFF'/%3E%3Cpath d='M16 7c-3.3 0-6 2.6-6 5.9 0 4.4 6 11.1 6 11.1s6-6.7 6-11.1C22 9.6 19.3 7 16 7zm0 8.2a2.3 2.3 0 110-4.6 2.3 2.3 0 010 4.6z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./assets/css/style.css?v=1">
</head>
<body>

<header class="hd">
  <div class="brand"><span class="mk">◉</span>
    <span>PINDEX<small>핀덱스</small></span></div>
  <nav>
    <a href="./index.html" class="on">지도 탐색</a>
    <a href="./admin.html">착수 전 검토</a>
  </nav>
  <div class="sp"></div>
  <span class="bd mute tiny" id="hdCount">—</span>
  <button class="btn sm" id="btnSheet" style="display:none">목록</button>
</header>

<div class="mapwrap">
  <!-- 좌측 패널 376px (호갱노노 실측) -->
  <aside class="panel" id="panel">
    <div class="panel-h">
      <input class="inp sm" id="q" placeholder="단지명 · 지역 검색" autocomplete="off">
      <div class="between" style="margin-top:10px">
        <span class="small muted" id="listMeta">—</span>
        <button class="btn sm" id="btnReset">초기화</button>
      </div>
    </div>
    <div class="filters" id="filters"></div>
    <div class="list" id="list"></div>
  </aside>

  <!-- 지도 -->
  <div class="stage" id="stage">
    <canvas id="map"></canvas>

    <div class="mapctl tl">
      <div class="mapbox">
        <b id="mapTitle">서울 전역</b>
        <div class="tiny faint" id="mapSub" style="margin-top:2px">—</div>
      </div>
    </div>

    <div class="mapctl tr">
      <button class="btn sm" id="btnZoomIn">＋</button>
      <button class="btn sm" id="btnZoomOut">－</button>
      <button class="btn sm" id="btnFit">전체</button>
    </div>

    <!-- 성능 패널 — 실제 프레임 시간 측정 -->
    <div class="mapctl bl">
      <div class="mapbox" style="min-width:250px">
        <div class="between" style="gap:10px">
          <b style="font-size:12.5px">렌더 성능 (실측)</b>
          <button class="chip acc" id="btnCluster" aria-pressed="true" style="height:26px;font-size:12px">클러스터링</button>
        </div>
        <div class="num" id="perf" style="margin-top:7px;font-size:12.5px;line-height:1.7">—</div>
        <div class="tiny faint" style="margin-top:5px" id="perfNote">—</div>
      </div>
    </div>

    <div id="ovHost"></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script src="./assets/js/data.js?v=1"></script>
<script src="./assets/js/app.js?v=1"></script>
</body>
</html>
