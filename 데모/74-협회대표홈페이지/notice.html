<main id="main">
  <div class="page-hero">
    <div class="shell">
      <nav class="crumb" aria-label="현재 위치"><a href="index.html">홈</a><span>›</span><span>공지사항</span></nav>

      <h1>공지사항</h1>
      <p>요율 조정, 시스템 점검, 채용 등 조합의 주요 소식을 안내합니다.</p>
    </div>
  </div>

  <section class="sec-fn">
    <div class="shell">
      <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:24px">
        <div class="seg" role="group" aria-label="분류 필터" id="cat-seg">
          <button type="button" data-cat="all" aria-pressed="true">전체</button>
          <button type="button" data-cat="안내" aria-pressed="false">안내</button>
          <button type="button" data-cat="점검" aria-pressed="false">점검</button>
          <button type="button" data-cat="교육" aria-pressed="false">교육</button>
          <button type="button" data-cat="채용" aria-pressed="false">채용</button>
          <button type="button" data-cat="공시" aria-pressed="false">공시</button>
        </div>
        <div class="field" style="margin-left:auto;min-width:240px">
          <label for="notice-search" style="position:absolute;left:-9999px">공지 검색</label>
          <input id="notice-search" type="search" placeholder="제목으로 검색" autocomplete="off">
        </div>
      </div>
      <div class="notice-rows" id="notice-list"></div>
      <div id="empty" hidden style="text-align:center;padding:60px 0;color:var(--ink-3)">검색 결과가 없습니다.</div>
    </div>
  </section>

<script src="assets/js/data.js"></script>
<script src="assets/js/core.js"></script>
<script>
(function () {
  var $ = HGCore.$;
  var cat = 'all', kw = '';
  function render() {
    var rows = HG.NOTICES.slice().sort(function (a, b) { return (b.pin - a.pin) || (b.id - a.id); });
    rows = rows.filter(function (n) { return (cat === 'all' || n.cat === cat) && (!kw || n.title.indexOf(kw) >= 0); });
    $('#empty').hidden = rows.length > 0;
    $('#notice-list').innerHTML = rows.map(function (n) {
      return '<a class="notice-row" href="notice-view.html?id=' + n.id + '">' +
        '<span class="n-cat">' + n.cat + '</span>' +
        '<span class="n-title">' + (n.pin ? '<span class="pin">고정</span>' : '') + n.title + '</span>' +
        '<span class="n-date num-en">' + n.date + '</span></a>';
    }).join('');
  }
  HGCore.$$('#cat-seg button').forEach(function (b) {
    b.addEventListener('click', function () {
      cat = b.dataset.cat;
      HGCore.$$('#cat-seg button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      render();
    });
  });
  $('#notice-search').addEventListener('input', function (e) { kw = e.target.value.trim(); render(); });
  render();
})();
</script>
