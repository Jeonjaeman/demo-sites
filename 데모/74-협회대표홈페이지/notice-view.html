<script>
(function () {
  var $ = HGCore.$;
  var id = +(new URLSearchParams(location.search).get('id') || HG.NOTICES[0].id);
  var sorted = HG.NOTICES.slice().sort(function (a, b) { return b.id - a.id; });
  var idx = sorted.findIndex(function (n) { return n.id === id; });
  if (idx < 0) idx = 0;
  var n = sorted[idx];
  document.title = n.title + ' — 헤리가드공제조합 (데모)';
  $('#v-cat').textContent = n.cat;
  $('#v-title').textContent = n.title;
  $('#v-meta').textContent = n.date + ' · 조회 ' + n.views.toLocaleString();
  $('#v-body').textContent = n.body;
  if (n.file) {
    $('#v-file').innerHTML = '<div style="border-top:1px solid var(--line);padding-top:18px"><b style="font-size:14px">첨부파일</b><br>' +
      '<button class="btn btn-ghost btn-sm" type="button" id="dl" style="margin-top:10px">📎 ' + n.file + '</button></div>';
    $('#dl').addEventListener('click', function () {
      var blob = new Blob(['﻿헤리가드공제조합 데모 첨부파일 — ' + n.file + '\n(실제 파일 자리, 가상 데이터)'], { type: 'text/plain;charset=utf-8' });
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = n.file.replace(/\.[^.]+$/, '') + '.txt'; a.click();
      HGCore.toast('첨부파일을 내려받았습니다 (데모)');
    });
  }
  function go(delta) {
    var t = sorted[idx + delta];
    if (t) location.href = 'notice-view.html?id=' + t.id;
    else HGCore.toast(delta < 0 ? '최신 글입니다' : '마지막 글입니다');
  }
  $('#prev-btn').addEventListener('click', function () { go(-1); });
  $('#next-btn').addEventListener('click', function () { go(1); });
})();
</script>
