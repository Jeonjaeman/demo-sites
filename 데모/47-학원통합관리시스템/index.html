<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>도장 — 학원 통합 관리 시스템 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --ink:#17233B; --ink2:#22304F; --paper:#F5F6F9; --card:#FFFFFF;
  --stamp:#C2402E; --stamp-soft:#FBEDEA;
  --ok:#0E8A6D; --ok-soft:#E6F4EF;
  --warn:#B5750B; --warn-soft:#FBF3E2;
  --line:#E3E6EC; --txt:#1E2433; --sub:#67708A; --mut:#9AA1B5;
  --r:10px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{overflow-x:clip}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;background:var(--paper);color:var(--txt);font-size:15px;line-height:1.6}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:inherit;color:inherit}
input,select,textarea{font-family:inherit;font-size:inherit}
a{color:var(--stamp)}

/* ── 데모 배너 ── */
.demo-band{background:var(--ink);color:#fff;font-size:12.5px;padding:7px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;position:relative;z-index:70}
.demo-band b{color:#F4C87A;font-weight:600}
.demo-band .bd-links{display:flex;gap:14px;flex-shrink:0}
.demo-band .bd-links button{color:#B9C2D8;text-decoration:underline;font-size:12px}

/* ── 리빌·모션 ── */
.rv{opacity:0;transform:translateY(8px);transition:opacity .35s ease,transform .35s ease}
.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}}

/* ── 게이트(진입) ── */
.gate{max-width:920px;margin:0 auto;padding:48px 20px 64px}
.gate-brand{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.gate-mark{width:46px;height:46px;border:3px solid var(--stamp);border-radius:50%;color:var(--stamp);font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;transform:rotate(-8deg);letter-spacing:1px;flex-shrink:0}
.gate-brand .t{font-size:24px;font-weight:800;letter-spacing:-.5px}
.gate-brand .s{font-size:13px;color:var(--sub)}
.gate-sub{font-size:14px;color:var(--sub);margin:2px 0 26px}
.gate-checkin{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;text-align:left;background:var(--ink);color:#fff;border-radius:14px;padding:24px 28px;margin-bottom:14px;transition:background .16s}
.gate-checkin:hover{background:var(--ink2)}
.gate-checkin .big{font-size:19px;font-weight:800;letter-spacing:-.3px}
.gate-checkin .sm{font-size:13px;color:#B9C2D8;margin-top:3px}
.gate-checkin .arrow{font-size:22px;color:#F4C87A}
.gate-roles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.gate-role{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;text-align:left;transition:border-color .16s,transform .16s,box-shadow .16s}
.gate-role:hover{border-color:#C9CEDA;transform:translateY(-2px);box-shadow:0 6px 18px rgba(23,35,59,.06)}
.gate-role .who{font-size:16.5px;font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;gap:8px}
.gate-role .how{font-size:12.5px;color:var(--sub);margin-top:6px;line-height:1.55}
.gate-role .go{display:inline-block;margin-top:14px;font-size:13px;font-weight:700;color:var(--stamp)}
.gate-role .tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:#EEF0F5;color:var(--sub)}
.gate-auth{margin-top:40px}
.gate-auth h2{font-size:16px;font-weight:800;letter-spacing:-.3px;margin-bottom:4px}
.gate-auth .lead{font-size:13px;color:var(--sub);margin-bottom:14px}
.auth-grid{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.auth-card{padding:18px 20px}
.auth-card+.auth-card{border-left:1px solid var(--line)}
.auth-card .h{font-size:13.5px;font-weight:700;margin-bottom:6px}
.auth-card p{font-size:12.5px;color:var(--sub);line-height:1.6}
.gate-foot{margin-top:28px;font-size:12px;color:var(--mut);line-height:1.7}
@media(max-width:760px){
  .gate{padding:30px 16px 48px}
  .gate-roles,.auth-grid{grid-template-columns:1fr}
  .auth-card+.auth-card{border-left:none;border-top:1px solid var(--line)}
}

/* ── 로그인 ── */
.login-wrap{max-width:400px;margin:0 auto;padding:56px 20px}
.login-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:30px}
.login-card .mark{width:40px;height:40px;border:3px solid var(--stamp);border-radius:50%;color:var(--stamp);font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;transform:rotate(-8deg);margin-bottom:14px}
.login-card h1{font-size:19px;font-weight:800;letter-spacing:-.4px}
.login-card .d{font-size:13px;color:var(--sub);margin:3px 0 18px}
.login-err{background:var(--stamp-soft);color:var(--stamp);font-size:12.5px;font-weight:600;border-radius:8px;padding:8px 12px;margin-bottom:12px}
.login-note{background:#F4F6FA;border:1px solid var(--line);font-size:12px;color:var(--sub);border-radius:8px;padding:9px 12px;margin-top:14px;line-height:1.6}
.login-links{display:flex;justify-content:space-between;margin-top:14px;font-size:12.5px}
.login-links button{color:var(--sub);text-decoration:underline}

/* ── 레이아웃(셸) ── */
.app{display:flex;min-height:calc(100vh - 34px)}
.side{width:216px;background:var(--ink);color:#C7CEDE;flex-shrink:0;display:flex;flex-direction:column;padding:20px 0}
.logo{padding:0 20px 18px;border-bottom:1px solid var(--ink2);margin-bottom:12px;display:flex;align-items:center;gap:10px}
.logo .mk{width:30px;height:30px;border:2.5px solid var(--stamp);border-radius:50%;color:#E8705C;font-weight:900;font-size:10px;display:flex;align-items:center;justify-content:center;transform:rotate(-8deg);flex-shrink:0}
.logo .t{color:#fff;font-weight:700;font-size:15.5px;letter-spacing:-.3px}
.logo .s{font-size:11px;color:#7C87A3;margin-top:1px}
.nav{flex:1}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 20px;color:#C7CEDE;font-size:14px;font-weight:500;border-left:3px solid transparent}
.nav button:hover{background:var(--ink2);color:#fff}
.nav button.on{background:var(--ink2);color:#fff;border-left-color:var(--stamp)}
.nav .ico{width:18px;text-align:center;font-size:14px;opacity:.85}
.side-foot{padding:14px 20px 0;border-top:1px solid var(--ink2);font-size:11.5px;color:#7C87A3}
.side-foot .me{color:#C7CEDE;font-weight:600;font-size:12.5px}
.side-foot button{color:#8FA3CE;text-decoration:underline;font-size:11.5px;margin-top:6px}

.main{flex:1;padding:26px 30px;max-width:1080px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;gap:12px;flex-wrap:wrap}
h1{font-size:21px;font-weight:700;letter-spacing:-.4px}
.pagehead .desc{font-size:13px;color:var(--sub);margin-top:3px}
.rolechip{font-size:12px;font-weight:700;background:#fff;border:1px solid var(--line);border-radius:99px;padding:6px 14px;color:var(--sub)}
.rolechip b{color:var(--ink)}

/* ── 카드/그리드 ── */
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:980px){.g4,.g3{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.card h3{font-size:14.5px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.stat .n{font-size:26px;font-weight:800;letter-spacing:-.5px}
.stat .l{font-size:12.5px;color:var(--sub);margin-top:2px}
.stat .n.red{color:var(--stamp)} .stat .n.ok{color:var(--ok)} .stat .n.warn{color:var(--warn)}

/* ── 테이블 ── */
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:12px;color:var(--mut);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #F0F1F5;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.click{cursor:pointer} tr.click:hover td{background:#FAFBFD}

/* ── 뱃지/버튼 ── */
.bdg{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.bdg.ok{background:var(--ok-soft);color:var(--ok)}
.bdg.red{background:var(--stamp-soft);color:var(--stamp)}
.bdg.warn{background:var(--warn-soft);color:var(--warn)}
.bdg.gray{background:#EEF0F5;color:var(--sub)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;font-size:13.5px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--txt);transition:border-color .14s,background .14s}
.btn:hover{border-color:#C9CEDA}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.pri:hover{background:var(--ink2)}
.btn.pri:disabled{opacity:.55;cursor:default}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn.wide{width:100%;justify-content:center;padding:12px}

/* ── 폼 ── */
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--sub);margin-bottom:5px}
.inp,select.inp,textarea.inp{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}
.inp:focus{outline:2px solid #B9C6E4;border-color:#8FA3CE}
.frow{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.frow>div{flex:1;min-width:120px}

/* ── 필터 세그먼트 ── */
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:99px;padding:3px;gap:2px}
.seg button{padding:5px 13px;border-radius:99px;font-size:12.5px;font-weight:600;color:var(--sub)}
.seg button.on{background:var(--ink);color:#fff}

/* ── 키오스크 ── */
.kwrap{max-width:520px;margin:0 auto;padding:34px 18px 60px}
.khead{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}
.khead .clock{font-size:14px;color:var(--sub)}
.kiosk-title{font-size:24px;font-weight:800;letter-spacing:-.5px;margin-bottom:20px;text-align:center}
.kmode{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.kmode button{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:34px 20px;text-align:center;transition:border-color .16s,transform .16s}
.kmode button:hover{border-color:#C9CEDA;transform:translateY(-2px)}
.kmode .mi{height:36px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.kmode .mt2{font-size:16.5px;font-weight:800;letter-spacing:-.3px}
.kmode .ms{font-size:12.5px;color:var(--sub);margin-top:4px}
.kswitch{display:flex;justify-content:center;gap:8px;margin-bottom:18px}
.kiosk{max-width:430px;margin:0 auto;text-align:center}
.kdisplay{background:#fff;border:2px solid var(--line);border-radius:14px;font-size:34px;font-weight:800;letter-spacing:8px;padding:16px;margin-bottom:14px;min-height:76px;color:var(--ink)}
.kpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpad button{background:#fff;border:1px solid var(--line);border-radius:12px;font-size:24px;font-weight:700;padding:18px 0;color:var(--ink)}
.kpad button:active{background:#EEF0F5}
.kpad .act{font-size:16px;font-weight:700}
.kpad .go{background:var(--ink);color:#fff;border-color:var(--ink)}
.khint{font-size:12.5px;color:var(--mut);margin-top:14px}

/* ── QR 스캔 ── */
.qrcam{position:relative;width:min(300px,80vw);height:min(300px,80vw);margin:0 auto 8px;border-radius:18px;background:radial-gradient(circle at 50% 42%,#2E3A54 0%,#141C2E 70%);overflow:hidden}
.qrcam .corner{position:absolute;width:34px;height:34px;border:3px solid rgba(255,255,255,.85)}
.qrcam .c1{top:22px;left:22px;border-right:none;border-bottom:none;border-radius:8px 0 0 0}
.qrcam .c2{top:22px;right:22px;border-left:none;border-bottom:none;border-radius:0 8px 0 0}
.qrcam .c3{bottom:22px;left:22px;border-right:none;border-top:none;border-radius:0 0 0 8px}
.qrcam .c4{bottom:22px;right:22px;border-left:none;border-top:none;border-radius:0 0 8px 0}
.qrcam .scanline{position:absolute;left:30px;right:30px;height:2px;background:linear-gradient(90deg,transparent,#F4C87A 30%,#F4C87A 70%,transparent);top:15%;opacity:.9}
@media(prefers-reduced-motion:no-preference){
  .qrcam .scanline{animation:scan 2.2s ease-in-out infinite}
  .qrcam.busy .scanline{animation-duration:.7s;background:linear-gradient(90deg,transparent,#7EE2C0 30%,#7EE2C0 70%,transparent)}
  @keyframes scan{0%,100%{top:15%}50%{top:82%}}
}
.qrcam .qrfloat{position:absolute;inset:0;display:none;align-items:center;justify-content:center}
.qrcam.busy .qrfloat{display:flex}
.qrcam .qrfloat svg{background:#fff;padding:10px;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.qrstat{font-size:13px;color:var(--sub);min-height:22px;margin-bottom:16px;text-align:center}
.qrstat b{color:var(--ok)}
.qrcards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:430px;margin:0 auto}
.qrcards button{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;text-align:left;transition:border-color .14s}
.qrcards button:hover{border-color:#C9CEDA}
.qrcards button:disabled{opacity:.5;cursor:default}
.qrcards svg{flex-shrink:0;border:1px solid #F0F1F5;border-radius:6px}
.qrcards .qn{font-size:13.5px;font-weight:700}
.qrcards .qc{font-size:11.5px;color:var(--sub)}

/* ── 도장 ── */
.stamp-layer{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(23,35,59,.35);z-index:60}
.stamp-layer.show{display:flex}
.stamp-card{background:#fff;border-radius:18px;padding:40px 48px;text-align:center;position:relative;min-width:300px}
.stamp-name{font-size:20px;font-weight:800;margin-bottom:4px}
.stamp-meta{font-size:13.5px;color:var(--sub)}
.stamp{width:110px;height:110px;border:5px solid var(--stamp);border-radius:50%;color:var(--stamp);font-size:30px;font-weight:900;display:flex;align-items:center;justify-content:center;margin:18px auto 6px;letter-spacing:2px;transform:rotate(-8deg)}
@media(prefers-reduced-motion:no-preference){
  .stamp-layer.show .stamp{animation:slam .45s cubic-bezier(.2,1.4,.4,1) both}
  @keyframes slam{0%{transform:scale(2.6) rotate(-20deg);opacity:0}55%{transform:scale(.94) rotate(-7deg);opacity:1}100%{transform:scale(1) rotate(-8deg)}}
}
.stamp.late{border-color:var(--warn);color:var(--warn)}

/* ── 탭/기타 ── */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{padding:9px 15px;font-size:13.5px;font-weight:600;color:var(--sub);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--stamp)}
.mt{margin-top:14px}.mb{margin-bottom:14px}
.muted{color:var(--mut);font-size:12.5px}
.note{background:var(--warn-soft);border:1px solid #EBD9B0;color:#6B4E10;font-size:13px;border-radius:8px;padding:10px 14px;margin-bottom:14px}
.note.ok{background:var(--ok-soft);border-color:#BFE0D4;color:#0A5C48}
.note.plain{background:#F4F6FA;border-color:var(--line);color:var(--txt)}
.empty{padding:28px;text-align:center;color:var(--mut);font-size:13.5px}

/* ── 카톡 미리보기 ── */
.kakao{background:#A9C0D5;border-radius:14px;padding:16px;max-width:340px}
.kk-head{font-size:12px;font-weight:700;color:#3D4B58;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.kk-ch{width:22px;height:22px;background:#FAE100;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;color:#3B1E1E}
.kk-bubble{background:#fff;border-radius:4px 14px 14px 14px;overflow:hidden;font-size:13px;line-height:1.55}
.kk-tag{background:#FAE100;font-size:11px;font-weight:700;padding:5px 12px;color:#3B1E1E}
.kk-body{padding:12px 14px;white-space:pre-line;color:#222}
.kk-btn{border-top:1px solid #EEE;text-align:center;padding:9px;font-size:12.5px;font-weight:600;color:#3D4B58;cursor:pointer;background:#fff;width:100%}
.kk-btn:hover{background:#FAFAFA}

/* ── 학부모 독립 UI ── */
body.parent-bg{background:#F3F1ED}
.pwrap{max-width:440px;margin:0 auto;padding:0 14px 56px}
.pbar{position:sticky;top:0;z-index:40;background:rgba(243,241,237,.92);backdrop-filter:blur(8px);padding:14px 2px 10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.pbar .pt{font-size:15px;font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;gap:8px}
.pbar .pm{width:26px;height:26px;border:2.5px solid var(--stamp);border-radius:50%;color:var(--stamp);font-weight:900;font-size:9px;display:flex;align-items:center;justify-content:center;transform:rotate(-8deg)}
.tokchip{font-size:11px;font-weight:700;background:var(--ok-soft);color:var(--ok);border-radius:99px;padding:4px 10px;white-space:nowrap}
.pcard{background:#fff;border:1px solid #E8E4DD;border-radius:16px;padding:20px;margin-bottom:12px}
.pcard h3{font-size:14.5px;font-weight:800;letter-spacing:-.2px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.phello{padding:20px 4px 12px}
.phello .hi{font-size:20px;font-weight:800;letter-spacing:-.4px}
.phello .hs{font-size:13px;color:var(--sub);margin-top:3px}
.pstat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pstat>div{background:#FAF9F6;border-radius:12px;padding:12px 14px}
.pstat .k{font-size:11.5px;color:var(--sub)}
.pstat .v{font-size:15px;font-weight:800;margin-top:2px}
.pfoot{text-align:center;font-size:11.5px;color:var(--mut);line-height:1.7;padding:8px 10px 0}
.clinic-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #F3F0EA}
.clinic-row:last-of-type{border-bottom:none}

/* ── 학부모 진입(알림톡 시뮬) ── */
.pentry{max-width:430px;margin:0 auto;padding:44px 18px 60px}
.pentry h1{font-size:20px;letter-spacing:-.4px;margin-bottom:4px}
.pentry .d{font-size:13px;color:var(--sub);margin-bottom:20px}
.expired{background:#fff;border:1px solid var(--line);border-radius:16px;padding:34px 24px;text-align:center}
.expired .xi{width:52px;height:52px;border-radius:50%;background:var(--stamp-soft);color:var(--stamp);font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}

/* ── 차트 ── */
.chartbox{overflow-x:auto}
svg text{font-family:inherit}
.hbar{margin-bottom:12px}
.hbar .hl{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px}
.hbar .hl b{font-weight:700}
.hbar .tr{height:8px;background:#EEF0F5;border-radius:99px;overflow:hidden}
.hbar .fl{height:100%;background:var(--ink);border-radius:99px;width:0;transition:width .7s cubic-bezier(.22,.61,.36,1)}
.hbar .fl.red{background:var(--stamp)}
.hbar .fl.okc{background:var(--ok)}

/* ── 진행바(백업) ── */
.prog{height:8px;background:#EEF0F5;border-radius:99px;overflow:hidden;margin:10px 0 6px}
.prog i{display:block;height:100%;background:var(--ok);border-radius:99px;width:0;transition:width 1.1s ease}

/* ── 모달 ── */

function buildSeed(){
  const s = structuredClone(SEED);
  /* 지난 30일 내 평일(오늘 제외)을 등원일로 생성 */
  const days=[]; const base=new Date();
  for(let i=1;i<=30;i++){
    const t=new Date(base); t.setDate(base.getDate()-i);
    if(t.getDay()!==0 && t.getDay()!==6) days.push(localDate(t));
  }
  s.histDays = days; /* 최근순 */
  s.students.forEach(st=>{
    days.forEach((dt,di)=>{
      const h=(st.id*31+di*17)%100;
      if(h<8) return;                                  /* 결석 */
      const late = h>=8 && h<16;                       /* 지각 */
      const time = late ? '16:'+pad2(11+(h%20)) : '15:'+pad2(25+(h%35));
      s.attendance.push({sid:st.id,date:dt,time,st:late?'late':'ok'});
    });
  });
  /* 발송 이력 날짜를 최근 평일로 */
  s.talkLog.forEach((t,i)=>{ t.date=(days[i<3?0:1]||today())+' '+t.time; delete t.time; });
  /* 백업 이력 — 지난달 1일 */
  const b=new Date(); b.setDate(1); const bm=localDate(b);
  s.backupLog=[{date:bm+' 03:00',type:'자동(월간)',target:'구글시트',st:'성공'}];
  return s;
}

/* 데모용 QR 패턴 (학생 번호 기반 결정적 생성) */
function qrSVG(seed,px){
  const N=21, c=px/N, cells=[];
  const finder=(x,y)=>{
    for(let i=0;i<7;i++)for(let j=0;j<7;j++){
      const edge = i===0||i===6||j===0||j===6;
      const core = i>=2&&i<=4&&j>=2&&j<=4;
      if(edge||core) cells.push([x+i,y+j]);
    }
  };
  finder(0,0); finder(14,0); finder(0,14);
  const inF=(x,y)=>(x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12);
  for(let x=0;x<N;x++)for(let y=0;y<N;y++){
    if(inF(x,y)) continue;
    let h=seed*7349+x*131+y*571; h=(h*h+h)%1009;
    if(h%100<46) cells.push([x,y]);
  }
  return `<svg width="${px}" height="${px}" viewBox="0 0 ${px} ${px}" aria-hidden="true">${cells.map(([x,y])=>`<rect x="${(x*c).toFixed(1)}" y="${(y*c).toFixed(1)}" width="${c.toFixed(1)}" height="${c.toFixed(1)}" fill="#17233B"/>`).join('')}</svg>`;
}

/* ══════════ 성적 추이 SVG ══════════ */
function chartSVG(exams){
  if(!exams.length) return '';
  const pts=exams.map(e=>({label:e.name.replace(' ',''),v:e.items.reduce((a,i)=>a+i.s,0)}));
  const W=500,H=150,pad=34,max=100;
  const x=i=>pad+(W-pad*2)*(pts.length===1?.5:i/(pts.length-1));
  const y=v=>H-24-(H-52)*(v/max);
  const line=pts.map((p,i)=>`${i?'L':'M'}${x(i)},${y(p.v)}`).join(' ');
  return `<div class="chartbox"><svg width="100%" viewBox="0 0 ${W} ${H}">
  ${[0,50,100].map(g=>`<line x1="${pad}" y1="${y(g)}" x2="${W-pad}" y2="${y(g)}" stroke="#EDEFF4"/><text x="${pad-6}" y="${y(g)+4}" font-size="10" fill="#9AA1B5" text-anchor="end">${g}</text>`).join('')}
  <path d="${line}" fill="none" stroke="#C2402E" stroke-width="2.5" stroke-linecap="round"/>
  ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="4" fill="#C2402E"/><text x="${x(i)}" y="${y(p.v)-10}" font-size="11" font-weight="700" fill="#1E2433" text-anchor="middle">${p.v}</text><text x="${x(i)}" y="${H-6}" font-size="10" fill="#67708A" text-anchor="middle">${p.label}</text>`).join('')}
  </svg></div>`;
}

function runCSV(){
  CSV_ROWS.forEach(r=>{

  });
  DB.csv.ran=true; save(); render();
  toast('CSV 3건 분석 완료 — 2건 자동 매칭, 1건 확인 대기');
}
function resolveCSV(sid){
  const s=stu(sid);

  if(p){ p.st='paid'; p.via='카드'; }
  DB.csv.resolved=true; DB.csv.resolvedTo=sid+' '+s.name+'('+s.cls+')';
  save(); render();
  toast(s.name+'('+s.cls+') 완납 처리되었습니다');
}

  dlCSV('출결부.csv',rows);

function dlCSV(name,rows){
  const csv='﻿'+rows.map(r=>r.map(v=>{v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(',')).join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download=name; a.click(); URL.revokeObjectURL(a.href);
  toast(name+' 다운로드 — 엑셀에서 한글이 깨지지 않습니다(BOM)');
}

function simAbsent(){
  const absent=DB.students.filter(s=>!DB.attendance.some(a=>a.sid===s.id&&a.date===today()));

    document.getElementById('absResult').innerHTML='<div class="note ok mt">오늘은 전원 등원 — 발송 대상이 없습니다.</div>';
    return;
  }
  const t=today()+' '+nowT();
  absent.forEach(s=>{
    DB.talkLog.unshift({date:t,to:s.name+' 학부모',type:'미등원 안내',st:s.id===105?'대체발송(SMS)':'성공',read:s.id===105?'-':''});

function statDays(){ return DB.histDays.slice(0, statPeriod===7?5:22); } /* 평일 기준 */
function statStus(){ return statCls==='all'?DB.students:DB.students.filter(s=>s.cls===statCls); }
function vReport(){
  const days=statDays(), ss=statStus();
  const recs=DB.attendance.filter(a=>days.includes(a.date)&&ss.some(s=>s.id===a.sid));
  const total=days.length*ss.length;
  const attRate=total?Math.round(recs.length/total*100):0;
  const lateRate=recs.length?Math.round(recs.filter(r=>r.st==='late').length/recs.length*100):0;
  const pays=DB.payments.filter(p=>ss.some(s=>s.id===p.sid));
  const payRate=pays.length?Math.round(pays.filter(p=>p.st==='paid').length/pays.length*100):0;
  const latests=ss.map(s=>{const ex=DB.exams.filter(e=>e.sid===s.id).slice(-1)[0];return ex?ex.items.reduce((a,i)=>a+i.s,0):null;}).filter(v=>v!==null);
  const avg=latests.length?Math.round(latests.reduce((a,b)=>a+b,0)/latests.length):0;

  /* 반별 평균 바 */
  const classes=['중2 수학A','고1 수학B'];
  const clsBars=classes.map(c=>{
    const cs=DB.students.filter(s=>s.cls===c);
    const vs=cs.map(s=>{const ex=DB.exams.filter(e=>e.sid===s.id).slice(-1)[0];return ex?ex.items.reduce((a,i)=>a+i.s,0):null;}).filter(v=>v!==null);
    const m=vs.length?Math.round(vs.reduce((a,b)=>a+b,0)/vs.length):0;
    return {c,m,n:vs.length};
  });
  /* 일별 출석률 (최근 → 과거 순 생성이므로 뒤집어 그림) */
  const dayPts=days.slice(0,10).reverse().map(d=>{
    const n=DB.attendance.filter(a=>a.date===d&&ss.some(s=>s.id===a.sid)).length;
    return {label:d.slice(5),v:Math.round(n/ss.length*100)};
  });
  return head('통계 리포트','반별·기간별 현황 — 아래 숫자는 목데이터를 실제로 집계한 값입니다 (오늘 제외)')+`
  <div class="pagehead" style="margin-bottom:14px">
    <div class="seg">
      <button class="${statCls==='all'?'on':''}" onclick="statCls='all';render()">전체</button>
      <button class="${statCls==='중2 수학A'?'on':''}" onclick="statCls='중2 수학A';render()">중2 수학A</button>
      <button class="${statCls==='고1 수학B'?'on':''}" onclick="statCls='고1 수학B';render()">고1 수학B</button>
    </div>
    <div class="seg">
      <button class="${statPeriod===7?'on':''}" onclick="statPeriod=7;render()">최근 1주</button>
      <button class="${statPeriod===30?'on':''}" onclick="statPeriod=30;render()">최근 1개월</button>
    </div>
  </div>
  <div class="grid g4 mb">
    <div class="card stat rv"><div class="n ok"><span class="cnt" data-v="${attRate}">0</span>%</div><div class="l">출석률 (수업일 ${days.length}일)</div></div>
    <div class="card stat rv"><div class="n warn"><span class="cnt" data-v="${lateRate}">0</span>%</div><div class="l">등원 중 지각 비율</div></div>
    <div class="card stat rv"><div class="n"><span class="cnt" data-v="${avg}">0</span>점</div><div class="l">최근 시험 평균 (${latests.length}명 기준)</div></div>
    <div class="card stat rv"><div class="n ${payRate<100?'red':'ok'}"><span class="cnt" data-v="${payRate}">0</span>%</div><div class="l">6월 수납률</div></div>
  </div>
  <div class="grid g2">
    <div class="card rv">
      <h3>일별 출석률 <span class="muted">최근 ${dayPts.length}수업일</span></h3>
      ${lineChart(dayPts)}
    </div>
    <div class="card rv">
      <h3>반별 최근 시험 평균</h3>
      ${clsBars.map(b=>`<div class="hbar"><div class="hl"><span>${b.c} <span class="muted">응시 ${b.n}명</span></span><b>${b.m}점</b></div><div class="tr"><div class="fl grow" data-w="${b.m}"></div></div></div>`).join('')}
      <p class="muted mt">시험 응시 기록이 있는 학생만 평균에 포함됩니다 — 미응시생을 0점으로 섞어 평균을 왜곡하지 않습니다.</p>
    </div>
  </div>
  <div class="card mt rv">
    <h3>유형별 정답률 <span class="muted">전 시험 문항 합산 · 낮은 순</span></h3>
    ${typeBarsHTML(ss)}
    <p class="muted mt">정답률이 클리닉 기준(${DB.settings.clinicThreshold}%) 미만인 유형은 붉게 표시됩니다 — 다음 커리큘럼에서 어느 단원을 보강할지 근거가 됩니다.</p>
  </div>
  <div class="card mt rv">
    <h3>데이터 내보내기</h3>
    <p class="muted mb">모든 표는 엑셀에서 바로 열리는 CSV로 내려받을 수 있습니다 (UTF-8 BOM — 한글 안 깨짐).</p>
    <button class="btn" onclick="dlAttCSV()">출결부 CSV</button>
    <button class="btn" onclick="dlPayCSV()" style="margin-left:8px">수납대장 CSV</button>
  </div>`;
}
function typeBarsHTML(ss){
  const agg={};
  DB.exams.filter(e=>ss.some(s=>s.id===e.sid)).forEach(e=>e.items.forEach(i=>{
    agg[i.t]=agg[i.t]||{s:0,m:0,n:0}; agg[i.t].s+=i.s; agg[i.t].m+=i.m; agg[i.t].n++;
  }));
  const rows=Object.entries(agg).map(([t,v])=>({t,p:Math.round(v.s/v.m*100),n:v.n})).sort((a,b)=>a.p-b.p);
  if(!rows.length) return '<div class="empty">시험 기록 없음</div>';
  return rows.map(r=>`<div class="hbar"><div class="hl"><span>${r.t} <span class="muted">문항 ${r.n}회 채점</span></span><b>${r.p}%</b></div><div class="tr"><div class="fl grow ${r.p<DB.settings.clinicThreshold?'red':''}" data-w="${r.p}"></div></div></div>`).join('');
}
function lineChart(pts){
  if(!pts.length) return '<div class="empty">데이터 없음</div>';
  const W=500,H=150,pad=34,max=100;
  const x=i=>pad+(W-pad*2)*(pts.length===1?.5:i/(pts.length-1));
  const y=v=>H-24-(H-52)*(v/max);
  const line=pts.map((p,i)=>`${i?'L':'M'}${x(i)},${y(p.v)}`).join(' ');
  return `<div class="chartbox"><svg width="100%" viewBox="0 0 ${W} ${H}">
  ${[0,50,100].map(g=>`<line x1="${pad}" y1="${y(g)}" x2="${W-pad}" y2="${y(g)}" stroke="#EDEFF4"/><text x="${pad-6}" y="${y(g)+4}" font-size="10" fill="#9AA1B5" text-anchor="end">${g}</text>`).join('')}
  <path d="${line}" fill="none" stroke="#17233B" stroke-width="2.5" stroke-linecap="round"/>
  ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="3.5" fill="#17233B"/>${pts.length<=10?`<text x="${x(i)}" y="${H-6}" font-size="9.5" fill="#67708A" text-anchor="middle">${p.label}</text>`:''}`).join('')}
  </svg></div>`;
}

      </div>
    </div>
    <p class="muted mt rv" style="line-height:1.7">버튼 링크에는 <b>24시간 만료 토큰</b>이 담겨 있습니다. 학부모는 앱 설치도, 회원가입도, 비밀번호도 필요 없습니다 — 링크마다 자녀 1명으로 열람 범위가 잠깁니다.</p>
    <div class="mt rv"><button class="btn sm" onclick="pentryStage='expired';render()">만료된 링크를 열면 어떻게 되나요?</button></div>`;
  }
  return `<div class="pentry">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
      <h1>학부모 열람</h1><button class="btn sm" onclick="pentryStage='msg';goGate()">← 처음으로</button>
    </div>
    <div class="d rv">학부모의 카카오톡에 실제로 도착하는 메시지입니다. 버튼을 눌러보세요.</div>
    ${inner}
  </div>`;
}
function openParent(){
  if(pentryStage==='verify') return;
  pentryStage='verify'; render();
  setTimeout(()=>{
    sessionStorage.setItem('dojangTok', String(Date.now()));
    /* 성적표 열람 → 발송 이력에 열람 시각 기록 */
    const lg=DB.talkLog.find(t=>t.to==='김서연 학부모'&&t.type==='성적표 업데이트'&&!t.read);
    if(lg){ lg.read=nowT(); save(); }
    pentryStage='msg'; mode='parent'; render();
  },750);
}

/* ══════════ 학부모 리포트 (독립 UI) ══════════ */
function tokLeftStr(){
  const at=+sessionStorage.getItem('dojangTok')||Date.now();
  const left=24*3600*1000-(Date.now()-at);
  if(left<=0) return '만료됨';
  const h=Math.floor(left/3600000), m=Math.floor(left%3600000/60000);
  return h+'시간 '+m+'분 남음';
}
function vParent(){
  const s=stu(PARENT_SID);
  const exams=DB.exams.filter(e=>e.sid===s.id);
  const last=exams.slice(-1)[0];
  const hw=DB.homework.filter(h=>h.sid===s.id);
  const clinic=clinicFor(s.id);
  const att=DB.attendance.filter(a=>a.sid===s.id&&a.date===today())[0];
  const pay=DB.payments.find(p=>p.sid===s.id&&p.month==='2026-06');
  return `<div class="pwrap">
    <div class="pbar">
      <span class="pt"><span class="pm">도장</span>도장수학학원</span>
      <span class="tokchip" id="tokLeft">안전 링크 · ${tokLeftStr()}</span>
    </div>
    <div class="phello rv">
      <div class="hi">${s.name} 학생 리포트</div>
      <div class="hs">${s.cls} · 학부모님만 보실 수 있는 화면입니다</div>
    </div>
    <div class="pcard rv">
      <div class="pstat">
        <div><div class="k">오늘 등원</div><div class="v">${att?att.time+(att.st==='late'?' · 지각':' · 등원'):'기록 없음'}</div></div>
        <div><div class="k">6월 수강료</div><div class="v">${pay?(pay.st==='paid'?'납부 완료':'미납'):'-'}</div></div>
      </div>
    </div>
    <div class="pcard rv">
      <h3>성적 추이</h3>
      ${chartSVG(exams)||'<div class="empty">시험 기록 없음</div>'}
      ${last?`<div class="tblwrap"><table class="mt"><thead><tr><th>유형</th><th>점수</th><th>코멘트</th></tr></thead><tbody>
      ${last.items.map(i=>`<tr><td>${i.t}</td><td><b>${i.s}</b>/${i.m}</td><td class="muted">${esc(i.c)}</td></tr>`).join('')}
      </tbody></table></div>
      <div class="note plain mt" style="margin-bottom:0"><b>담임 총평</b> — ${esc(last.cm)}</div>`:''}
    </div>
    ${clinic.length?`<div class="pcard rv">
      <h3>오답 클리닉 <span class="bdg red">복습 필요</span></h3>
      ${clinic.map(c=>`<div class="clinic-row">
        <div><b>${c.t}</b><div class="muted">${c.exam} · ${c.s}/${c.m}점</div></div>
        ${c.url?`<a class="btn sm" href="#" onclick="toast('데모 — 실서비스에서는 해설영상이 열립니다');return false">▶ 해설영상</a>`:'<span class="bdg gray">영상 준비 중</span>'}</div>`).join('')}
      <p class="muted mt" style="margin-bottom:0">기준 점수(${DB.settings.clinicThreshold}%) 미달 유형에 해설영상이 자동 배정됩니다.</p>
    </div>`:''}
    <div class="pcard rv">
      <h3>과제 성취도</h3>
      <div class="tblwrap"><table><thead><tr><th>주차</th><th>수행률</th><th>피드백</th></tr></thead><tbody>
      ${hw.map(h=>`<tr><td>${h.w}</td><td><b>${h.rate}%</b></td><td class="muted">${esc(h.note)}</td></tr>`).join('')}
      </tbody></table></div>
    </div>
    <div class="pcard rv" style="text-align:center">
      <p style="font-size:13.5px;margin-bottom:10px">궁금한 점은 학원으로 편하게 연락 주세요.</p>
      <button class="btn wide" onclick="toast('데모 — 실서비스에서는 바로 전화가 걸립니다')">학원에 전화하기</button>
    </div>
    <p class="pfoot rv">이 링크는 발송 후 24시간이 지나면 만료됩니다. 만료 후에는 알림톡 재발송으로 다시 열람하실 수 있습니다.<br>상담 이력·내부 메모는 학부모 화면에 표시되지 않습니다 (권한 분리).</p>
  </div>`;
}
setInterval(()=>{ const e=document.getElementById('tokLeft'); if(e) e.textContent='안전 링크 · '+tokLeftStr(); },30000);

/* ══════════ 라우팅·렌더 ══════════ */
function render(){
  const root=document.getElementById('appRoot');
  document.body.classList.toggle('parent-bg', mode==='parent'||mode==='pentry');
  if(mode==='gate') root.innerHTML=vGate();
  else if(mode==='login') root.innerHTML=vLogin();
  else if(mode==='kiosk') root.innerHTML=vKiosk();
  else if(mode==='pentry') root.innerHTML=vPentry();
  else if(mode==='parent') root.innerHTML=vParent();
  else{
    const V={dash:vDash,students:vStudents,grades:vGrades,pay:vPay,talk:vTalk,report:vReport,settings:vSettings};
    root.innerHTML=shellHTML((V[view]||vDash)());
  }
  afterRender();
}
function afterRender(){
  /* 리빌 stagger */
  const rvs=[...document.querySelectorAll('.rv:not(.in)')];
  requestAnimationFrame(()=>rvs.forEach((el,i)=>{ el.style.transitionDelay=Math.min(i,8)*45+'ms'; el.classList.add('in'); }));
  /* 카운트업 */
  document.querySelectorAll('.cnt').forEach(el=>{
    const target=+el.dataset.v||0, t0=performance.now(), dur=600;
    const step=t=>{
      const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3);
      el.textContent=fmt(Math.round(target*e));
      if(p<1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
  /* 바 성장 */
  setTimeout(()=>document.querySelectorAll('.grow').forEach(el=>{ el.style.width=(+el.dataset.w||0)+'%'; }),60);
}
render();
</script>
</body>
