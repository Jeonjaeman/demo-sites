<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지를 찾을 수 없습니다 — 아파트고</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/pages.css">
</head>
<body>
<div data-header></div>
<main id="main" class="shell"><div class="p404"><div>
  <div class="big" aria-hidden="true">404</div>
  <h1 class="h1" style="margin-top:-8px">페이지를 찾을 수 없습니다</h1>
  <p class="body-lg muted mt-3" style="max-width:48ch;margin-inline:auto">주소가 바뀌었거나 삭제된 페이지입니다. 리뉴얼 이후 옛 주소는 자동으로 새 주소로 보냅니다. 그래도 이 화면이 보이면 단지명으로 다시 검색하거나 최근 본 단지로 돌아가세요.</p>
  <form class="search-big" action="search.html" role="search"><div class="sb-box"><svg class="ico ico-24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input name="q" type="search" placeholder="단지명 또는 주소" aria-label="단지명 또는 주소"><button class="btn btn-primary" type="submit">검색</button></div></form>
  <div class="recent" id="recent"></div>
  <div class="row gap-2 jc-c mt-6" style="justify-content:center"><a class="btn btn-secondary" href="index.html">홈으로</a><button class="btn btn-ghost" onclick="history.back()">이전 페이지</button></div>
  <p class="micro muted-3 mt-6 dev-note">상태 화면 S-02 — 앱 프레임(헤더·푸터)을 유지한 채 본문만 404 · 검색창과 최근 본 단지로 직접 경로 제공</p>
</div></div></main>
<div data-footer></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script>
UI.init();
const rc = Store.get('recent').map(id => APT.complex(id)).filter(Boolean).slice(0, 3);
document.getElementById('recent').innerHTML = rc.length ? `<span class="micro muted-3" style="width:100%">최근 본 단지</span>` + rc.map(c => `<a class="chip" href="complex.html?id=${c.id}">${UI.esc(c.name)}</a>`).join('') : '';
</script>
