<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Demo Portal | 데모사이트 모음</title>
<meta name="description" content="제안용 데모사이트 통합 포털 — 산업별 데모를 데스크톱·모바일 화면 썸네일 갤러리로 한 곳에서." />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  /* 레이아웃·그리드 문법 실측 출처: printline.kr/category/homepage (사이드바 260px · 무여백 정사각 그리드 2/3/4열 · 방향 인식 호버 오버레이) */
  :root{
    --green:#2ba739; --green-dark:#1f7f2b; --ink:#222222; --gray:#6d6e71;
    --muted:#767676; --line:#e9ebe9; --line-soft:#f1f3f1; --paper:#fff; --paper-soft:#f7f8f7;
    --rail:260px; --bar:56px;
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box}
  html{background:var(--paper)}
  body{margin:0;min-width:320px;font-family:"Pretendard",system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;
    color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
  img{display:block;max-width:100%}
  a{color:inherit;text-decoration:none}
  :focus-visible{outline:3px solid var(--green);outline-offset:3px}
  .skip{position:absolute;left:-9999px;top:0;z-index:99;padding:12px 18px;background:var(--ink);color:#fff;font-size:13px}
  .skip:focus{left:0}

  /* ── 상단 바 (모바일) ── */
  .topbar{position:fixed;inset:0 0 auto 0;z-index:40;display:none;align-items:center;justify-content:space-between;
    height:var(--bar);padding:0 16px;border-bottom:1px solid var(--line-soft);background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(12px)}
  .burger{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px;border:1px solid var(--line);
    background:var(--paper);color:var(--ink);font:700 12px/1 inherit;letter-spacing:.06em;cursor:pointer}
  .burger i{display:block;width:14px;height:9px;border-top:1.5px solid currentColor;border-bottom:1.5px solid currentColor;position:relative}
  .burger i::before{content:"";position:absolute;left:0;top:3px;width:14px;height:1.5px;background:currentColor}

  /* ── 좌측 레일 ── */
  .rail{position:fixed;inset:0 auto 0 0;z-index:50;display:flex;flex-direction:column;width:var(--rail);
    padding:40px 28px;border-right:1px solid var(--line-soft);background:var(--paper);overflow-y:auto}
  .mark{display:block;margin-bottom:34px}
  .mark b{display:block;font-size:23px;font-weight:800;letter-spacing:-.045em;line-height:1.1}
  .mark b i{font-style:normal;color:var(--green)}
  .mark span{display:block;margin-top:9px;color:var(--muted);font-size:11.5px;line-height:1.6;letter-spacing:.01em}
  .navhead{margin:0 0 12px;font-size:13px;font-weight:700;letter-spacing:.025em}
  .nav{display:flex;flex-direction:column;align-items:flex-start;gap:9px;margin:0 0 30px}
  .nav button{display:flex;align-items:baseline;gap:7px;min-height:24px;padding:0;border:0;background:none;cursor:pointer;
    color:#6b7280;font:400 13px/1.5 inherit;transition:color .18s var(--ease)}
  .nav button:hover{color:var(--ink)}
  .nav button:active{color:var(--green-dark)}
  .nav button em{font-style:normal;font-size:11px;color:#a3a8a3;font-variant-numeric:tabular-nums}
  .nav button[aria-current="true"]{color:var(--green);font-weight:700}
  .nav button[aria-current="true"] em{color:var(--green)}
  .rail .ext{color:#6b7280;font-size:13px;transition:color .18s var(--ease)}
  .rail .ext:hover{color:var(--ink)}
  .railfoot{margin-top:auto;padding-top:34px;color:#8b8f8b;font-size:11px;line-height:1.75;word-break:keep-all}
  .railfoot b{display:block;margin-bottom:6px;color:var(--gray);font-size:11px;font-weight:700;letter-spacing:.09em}
  .scrim{position:fixed;inset:0;z-index:45;background:rgba(34,34,34,.4);opacity:0;pointer-events:none;transition:opacity .2s var(--ease)}

  /* ── 본문 ── */
  main{margin-left:var(--rail)}
  .pagehead{display:flex;align-items:baseline;justify-content:space-between;gap:20px;padding:30px 40px 20px}
  .pagehead h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.03em}
  .pagehead p{margin:0;color:var(--muted);font-size:12.5px;letter-spacing:.01em}
  .pagehead p b{color:var(--ink);font-variant-numeric:tabular-nums}

  /* ── 바둑판 그리드 (여백 0 · 정사각) ── */
  .grid{display:grid;grid-template-columns:repeat(2,1fr);border-top:1px solid var(--line-soft)}
  .tile{position:relative;display:block;aspect-ratio:1/1;overflow:hidden;background:var(--paper-soft)}
  .tile img{width:100%;height:100%;object-fit:cover;transition:transform .7s var(--ease)}
  .tile:hover img,.tile:focus-visible img{transform:scale(1.035)}
  .tile:active img{transform:scale(1.012);transition-duration:.18s}
  /* 첫 화면 진입 리빌 — CSS 애니메이션(fill:both)이라 어떤 상황에도 최종 상태는 노출 */
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .tile.rise{animation:rise .55s var(--ease) both;animation-delay:calc(var(--i,0) * 45ms)}
  .ov{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;gap:9px;
    padding:20px;background:rgba(0,0,0,.6);color:#fff;pointer-events:none;
    transform:translate3d(var(--ox,0),var(--oy,101%),0);transition:transform .42s var(--ease)}
  .tile.on .ov,.tile:focus-visible .ov{transform:translate3d(0,0,0)}
  .ov .no{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.14em;color:#8ce09a;font-variant-numeric:tabular-nums}
  .ov strong{font-size:20px;font-weight:700;line-height:1.375;letter-spacing:-.02em;word-break:keep-all}
  .ov .sum{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
    color:rgba(255,255,255,.82);font-size:12.5px;line-height:1.65;word-break:keep-all}
  .ov .go{margin-top:2px;font-size:15px;letter-spacing:.04em}
  .tile.soon{display:grid;place-items:center;border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);
    background:var(--paper-soft);color:#a3a8a3;font-size:12.5px;letter-spacing:.02em;cursor:default}
  .tile.soon span{display:block;text-align:center;line-height:1.7}
  .tile.soon span b{display:block;margin-bottom:4px;color:var(--gray);font-size:13px}

  footer{padding:34px 40px 56px;color:#8b8f8b;font-size:11.5px;line-height:1.8;word-break:keep-all}

  @media (min-width:768px){ .grid{grid-template-columns:repeat(3,1fr)} }
  @media (min-width:1280px){ .grid{grid-template-columns:repeat(4,1fr)} }

  @media (max-width:1023px){
    .topbar{display:flex}
    main{margin-left:0;padding-top:var(--bar)}
    .rail{transform:translateX(-100%);transition:transform .24s var(--ease);box-shadow:0 0 60px rgba(34,34,34,.14)}
    .rail.open{transform:translateX(0)}
    .scrim.on{opacity:1;pointer-events:auto}
    .pagehead{padding:26px 20px 18px}
    .pagehead p{flex:0 1 auto;min-width:0}
    .nav{gap:2px}
    .nav button,.rail .ext{display:flex;min-height:44px;align-items:center}
    footer{padding:26px 20px 44px}
  }
  @media (hover:none){
    .ov{transform:translate3d(0,0,0);justify-content:flex-end;padding:16px;gap:5px;
      background:linear-gradient(to top,rgba(0,0,0,.82) 0%,rgba(0,0,0,.34) 48%,rgba(0,0,0,0) 78%)}
    .ov .sum,.ov .go{display:none}
    .ov strong{font-size:14px;line-height:1.4}
    .ov .no{font-size:10px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;scroll-behavior:auto!important}
    .tile:hover img{transform:none}
  }
</style>
</head>

      const live = DEMOS.filter(d=>d.status!=="soon");
      const n = c.key==="all" ? live.length : live.filter(d=>d.cat===c.key).length;
      const on = c.key===activeCat;
      return `<button type="button" data-cat="${c.key}" aria-current="${on}">${c.label} <em>${n}</em></button>`;
    }).join("");
  }

  // 카드 정렬: 번호가 있는 데모는 원본 폴더 번호순, 외부 레거시는 카테고리순, 준비중은 맨 뒤
  const CAT_RANK = { home:0, platform:1, admin:2 };
  const catRank = (d)=> CAT_RANK[d.cat]===undefined ? 9 : CAT_RANK[d.cat];
  function renderGrid(){
    const list = DEMOS.filter(inCat).sort((a,b)=>{
      const an = demoNo(a), bn = demoNo(b);
      if(an!==null && bn!==null) return an-bn;
      if(an!==null) return -1;
      if(bn!==null) return 1;
      const sa = a.status==="soon"?1:0, sb = b.status==="soon"?1:0;
      if(sa!==sb) return sa-sb;
      return catRank(a)-catRank(b);
    });
    grid.innerHTML = list.map(d=>{
      if(d.status==="soon" || !d.thumb){
        return `<div class="tile soon"><span><b>${esc(d.name)}</b>준비 중입니다</span></div>`;
      }
      const no = demoNo(d);
      const noHtml = no===null ? "" : `<em class="no">NO. ${String(no).padStart(2,"0")}</em>`;
      const sum = d.sum ? `<span class="sum">${esc(d.sum)}</span>` : "";
      return `<a class="tile" href="${esc(d.url)}" target="_blank" rel="noopener" aria-label="${esc(d.name)} — 새 탭에서 열기">
        <img src="${esc(d.thumb)}" width="900" height="900" loading="lazy" decoding="async" alt="${esc(d.name)} 데스크톱·모바일 대표 화면" />
        <span class="ov">${noHtml}<strong>${esc(d.name)}</strong>${sum}<span class="go">→</span></span>
      </a>`;
    }).join("");
    document.getElementById("cnt").textContent = list.filter(d=>d.status!=="soon").length;
    ph.textContent = (CATS.find(c=>c.key===activeCat)||CATS[0]).label;
    bindTiles();
    rise();
  }

  // 첫 화면 타일만 순차 등장 — 아래쪽 타일은 스크롤하면 이미 그려져 있다
  function rise(){
    if(matchMedia("(prefers-reduced-motion:reduce)").matches) return;
    const cols = Math.round(grid.offsetWidth / (grid.firstElementChild?.offsetWidth || 1)) || 4;
    grid.querySelectorAll(".tile").forEach((el, i)=>{
      if(i >= cols * 2) return;
      el.style.setProperty("--i", i);
      el.classList.add("rise");
    });
  }

  // 방향 인식 호버 오버레이 — 마우스가 들어온 변에서 슬라이드 인, 나간 변으로 슬라이드 아웃
  const OFF = { l:["-101%","0"], r:["101%","0"], t:["0","-101%"], b:["0","101%"] };
  function edgeOf(e, el){
    const r = el.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width - .5;
    const y = (e.clientY - r.top) / r.height - .5;
    return Math.abs(x) > Math.abs(y) ? (x>0?"r":"l") : (y>0?"b":"t");
  }
  function setOff(el, d){
    const v = OFF[d] || OFF.b;
    el.style.setProperty("--ox", v[0]);
    el.style.setProperty("--oy", v[1]);
  }
  function bindTiles(){
    grid.querySelectorAll("a.tile").forEach(el=>{
      el.addEventListener("mouseenter", (e)=>{ setOff(el, edgeOf(e, el)); void el.offsetWidth; el.classList.add("on"); });
      el.addEventListener("mouseleave", (e)=>{ setOff(el, edgeOf(e, el)); el.classList.remove("on"); });
    });
  }

  function closeRail(){
    rail.classList.remove("open");
    scrim.classList.remove("on"); scrim.hidden = true;
    burger.setAttribute("aria-expanded","false");
  }
  burger.addEventListener("click", ()=>{
    const open = rail.classList.toggle("open");
    scrim.hidden = !open;
    requestAnimationFrame(()=> scrim.classList.toggle("on", open));
    burger.setAttribute("aria-expanded", String(open));
  });
  scrim.addEventListener("click", closeRail);
  document.addEventListener("keydown", (e)=>{ if(e.key==="Escape") closeRail(); });

  nav.addEventListener("click", (e)=>{
    const b = e.target.closest("[data-cat]"); if(!b) return;
    activeCat = b.getAttribute("data-cat");
    renderNav(); renderGrid();
    nav.querySelector(`[data-cat="${activeCat}"]`)?.focus();
    closeRail();
    window.scrollTo({ top:0, behavior:"smooth" });
  });

  renderNav();
  renderGrid();
</script>
</body>
</html>
